name: test-stress
# A stress run of the kit's tests, for the failures that come only sometimes or only under load.
# Daily on main it runs the chrome and rest groups three times; dispatched (gh workflow run
# test-stress.yml --ref <branch> -f files=... -f repeat=... -f load=... -f node=...) it runs chosen
# files, with CPU burners beside them if asked, on the Node major chosen (18 to 24; 24 by default, and on a
# schedule). The job summary names every file that failed on any repeat. The stress job is never a
# pull request check.
# The parity jobs (parity@1, test/split/parity.mjs) run daily on main and on pull requests that touch
# test/split/, apps/ or the root package.json, and on no other pull request: they build the cutover
# tree, run test.yml's Node 24 parts in it beside the same parts at the commit, and keep the report
# (parity.json, parity.md) as the run's parity-report artifact. Until the tree is at 1:1 the report job
# is red by design. The stress and parity jobs are never required: test.yml is the gate.
on:
  pull_request:
    paths: ['test/split/**', 'apps/**', 'package.json']
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      files:
        description: 'Space-separated test files (e.g. test/search.test.mjs); empty runs the chrome and rest groups'
        type: string
        required: false
        default: ''
      repeat:
        description: 'Times to run each file, 1 to 5'
        type: string
        required: false
        default: '3'
      load:
        description: 'CPU burners (node -e "for(;;){}") beside the tests, 0 to 8'
        type: string
        required: false
        default: '0'
      node:
        description: 'Node major to run on'
        type: choice
        options: ['18', '20', '22', '24']
        required: false
        default: '24'
permissions:
  contents: read
# A newer push to a pull request cancels its older run (keyed on the PR's number, as test.yml). Other
# runs share one group per ref and never cancel one in progress; GitHub keeps at most one pending
# run per group, so a newer one replaces a run still waiting.
concurrency:
  group: test-stress-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  stress:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # a full scheduled run is about 30 to 40 minutes; run.mjs's own watchdog bounds each file
    timeout-minutes: 240
    # the kit won't start a worker while the machine's memory is over its ceiling: the tests read a
    # machine of their own (or none), never the runner's (as in test.yml)
    env:
      DEVTEAM_CGROUP: /nonexistent/devteam-cgroup
      DEVTEAM_MEMINFO: /nonexistent/devteam-meminfo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # a scheduled run has no inputs: 24
          node-version: ${{ inputs.node || '24' }}
      - run: command -v tmux || (sudo apt-get update -q && sudo apt-get install -yq tmux)
      - name: stress
        shell: bash
        # inputs reach the script only here, as environment; on a schedule they are empty
        env:
          FILES: ${{ inputs.files }}
          REPEAT: ${{ inputs.repeat || '3' }}
          LOAD: ${{ inputs.load || '0' }}
          NODE: ${{ inputs.node || '24' }}
        run: |
          set -euo pipefail
          # --- inputs ---
          case "$REPEAT" in [1-5]) ;; *) echo "::error::repeat must be one of 1 to 5"; exit 2 ;; esac
          case "$LOAD" in [0-8]) ;; *) echo "::error::load must be one of 0 to 8"; exit 2 ;; esac
          case "$FILES" in *$'\n'* | *$'\t'* | *$'\r'*) echo "::error::files is one line of space-separated paths"; exit 2 ;; esac
          SEL=()
          if [ -z "${FILES// /}" ]; then
            SEL=(--group 'chrome,rest')
          else
            set -f
            read -ra WORDS <<< "$FILES"
            set +f
            for w in "${WORDS[@]}"; do
              # a path, never an option for run.mjs
              if [[ ! "$w" =~ ^[A-Za-z0-9._/-]+$ || "$w" == -* ]]; then echo "::error::not a test file path: '$w'"; exit 2; fi
              SEL+=("$w")
            done
          fi
          # --- end inputs ---
          cat > "$RUNNER_TEMP/summary.mjs" <<'EOF'
          // node summary.mjs <run.mjs log> <repeat>: a table of every file's result per repeat, from
          // run.mjs's summary rows, to $GITHUB_STEP_SUMMARY and stdout. Exits 1 unless every cell is ok.
          import fs from 'node:fs';
          const [log, repeatArg] = process.argv.slice(2);
          const repeat = Number(repeatArg);
          const lines = fs.readFileSync(log, 'utf8').split('\n');
          const HEADER = /^summary: \d+ files?, concurrency \d+$/;
          const ROW = /^(\S+)  (\d+(?:\.\d+)?)  (.*?)(?: \(run (\d+)\))?$/;
          const NEAR = /, near timeout$/;
          const isOk = (result) => result.replace(NEAR, '') === 'ok';
          const md = (t) => t.replace(/\|/g, '\\|');
          const out = [`## ${process.env.STRESS_TITLE || 'test-stress'}`, ''];
          let bad = false;
          let at = -1;
          lines.forEach((l, i) => { if (HEADER.test(l)) at = i; });
          if (at < 0) {
            out.push('**No summary**: run.mjs printed no summary line (a usage error or an interrupt). See the log.');
            bad = true;
          } else {
            const files = new Map();
            let i = at + 1;
            for (; i < lines.length; i++) {
              const m = ROW.exec(lines[i]);
              if (!m) break;
              const [, file, secs, result, run] = m;
              if (!files.has(file)) files.set(file, new Map());
              files.get(file).set(Number(run ?? 1), { result, secs });
            }
            const failed = [];
            for (const [file, runs] of files) {
              for (let r = 1; r <= repeat; r++) {
                const c = runs.get(r);
                if (!c) failed.push(`- \`${file}\` run ${r}: not run`);
                else if (!isOk(c.result)) failed.push(`- \`${file}\` run ${r}: ${md(c.result)}`);
              }
            }
            const timeouts = lines.slice(i).filter((l) => l.startsWith('timed out: '));
            if (!files.size) { out.push('**No files** in the summary.', ''); bad = true; }
            if (failed.length) {
              bad = true;
              out.push(`### Failed (${failed.length})`, '', ...failed, '');
              if (timeouts.length) out.push('```', ...timeouts, '```', '');
            } else if (files.size) out.push(`All ${files.size} file${files.size === 1 ? '' : 's'} passed on every repeat.`, '');
            const head = Array.from({ length: repeat }, (_, k) => `Run ${k + 1}`);
            out.push(`| File | ${head.join(' | ')} |`, `|---|${head.map(() => '---|').join('')}`);
            for (const [file, runs] of files) {
              const cells = Array.from({ length: repeat }, (_, k) => {
                const c = runs.get(k + 1);
                if (!c) return '**not run**';
                const res = isOk(c.result) ? `ok ${c.secs} s${NEAR.test(c.result) ? ' (near timeout)' : ''}` : `**${md(c.result)}** ${c.secs} s`;
                return res;
              });
              out.push(`| \`${file}\` | ${cells.join(' | ')} |`);
            }
          }
          const text = out.join('\n') + '\n';
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);
          process.stdout.write(text);
          process.exit(bad ? 1 : 0);
          EOF
          # --- burners ---
          BURNERS=()
          # kills only the burners started here, by pid; never fails, so it never sets the step's status
          stop_burners() {
            local p
            for p in "${BURNERS[@]}"; do kill "$p" 2>/dev/null || true; wait "$p" 2>/dev/null || true; done
            BURNERS=()
            return 0
          }
          trap stop_burners EXIT
          for _ in $(seq 1 "$LOAD"); do
            node -e "for(;;){}" &
            BURNERS+=("$!")
          done
          # --- end burners ---
          # --- run ---
          export STRESS_TITLE="test-stress: ${SEL[*]}, repeat $REPEAT, load $LOAD, concurrency 4, node $NODE"
          echo "+ node test/run.mjs ${SEL[*]} --repeat $REPEAT --concurrency 4 (burners: $LOAD)"
          set +e
          node test/run.mjs "${SEL[@]}" --repeat "$REPEAT" --concurrency 4 2>&1 | tee "$RUNNER_TEMP/stress.log"
          rc=${PIPESTATUS[0]}
          set -e
          n=${#BURNERS[@]}
          stop_burners
          echo "stopped $n burners"
          s=0
          node "$RUNNER_TEMP/summary.mjs" "$RUNNER_TEMP/stress.log" "$REPEAT" || s=1
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          exit "$s"
          # --- end run ---
  # ---- parity@1: build the tree once, run each Node 24 part in it and at the commit, then report ----
  parity-build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # a pull request's own head, never the merge GitHub makes of it
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: command -v tmux || (sudo apt-get update -q && sudo apt-get install -yq tmux)
      - name: build
        run: |
          set -euo pipefail
          node test/split/parity.mjs build --at "$SHA" --work "$RUNNER_TEMP/parity"
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/parity-work.tar" parity
      - uses: actions/upload-artifact@v4
        with:
          name: parity-work
          overwrite: true
          path: ${{ runner.temp }}/parity-work.tar
          if-no-files-found: error
          retention-days: 7
  parity-test:
    needs: parity-build
    name: parity (${{ matrix.part }})
    runs-on: ubuntu-latest
    # one part of test.yml's Node 24 column, twice: in the tree and at the commit. test.yml bounds each
    # of a part's steps at 11 minutes (alone, then the part), so a part here is at most 44 minutes
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: chain, key: chain }
          - { part: rest 1/5, key: rest-1, gitleaks: true }
          - { part: rest 2/5, key: rest-2, gitleaks: true }
          - { part: rest 3/5, key: rest-3, gitleaks: true }
          - { part: rest 4/5, key: rest-4, gitleaks: true }
          - { part: rest 5/5, key: rest-5, gitleaks: true }
          - { part: chrome 1/4, key: chrome-1 }
          - { part: chrome 2/4, key: chrome-2 }
          - { part: chrome 3/4, key: chrome-3 }
          - { part: chrome 4/4, key: chrome-4 }
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PART: ${{ matrix.part }}
      # as test.yml: in every rest part the gitleaks and sops tests run for real, never skip
      DEVTEAM_TEST_GITLEAKS: ${{ matrix.gitleaks && '1' || '' }}
      DEVTEAM_TEST_SOPS: ${{ matrix.gitleaks && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: command -v tmux || (sudo apt-get update -q && sudo apt-get install -yq tmux)
      # test.yml's pinned gitleaks, sops and age, copied as they are (the parity test checks they match)
      - if: matrix.gitleaks
        run: |
          set -euo pipefail
          V=8.30.1
          SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL --retry 3 -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "${SHA}  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - if: matrix.gitleaks
        run: |
          set -euo pipefail
          SOPS=3.13.3
          SOPS_SHA=e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
          AGE=1.3.2
          AGE_SHA=cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
          curl -fsSL --retry 3 -o /tmp/sops "https://github.com/getsops/sops/releases/download/v${SOPS}/sops-v${SOPS}.linux.amd64"
          echo "${SOPS_SHA}  /tmp/sops" | sha256sum -c -
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          curl -fsSL --retry 3 -o /tmp/age.tgz "https://github.com/FiloSottile/age/releases/download/v${AGE}/age-v${AGE}-linux-amd64.tar.gz"
          echo "${AGE_SHA}  /tmp/age.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/age.tgz -C /usr/local/bin --strip-components=1 age/age age/age-keygen
          sops --version --check-for-updates=false 2>/dev/null || sops --version
          age-keygen --version
      - uses: actions/download-artifact@v4
        with:
          name: parity-work
          path: ${{ runner.temp }}
      - name: test
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/parity-work.tar"
          node test/split/parity.mjs test --work "$RUNNER_TEMP/parity" --part "$PART"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-part-${{ matrix.key }}
          overwrite: true
          path: ${{ runner.temp }}/parity/parts/${{ matrix.key }}.json
          if-no-files-found: warn
          retention-days: 7
  parity-report:
    needs: [parity-build, parity-test]
    # after a failed or cancelled part too: a missing part is named in the report
    if: always() && needs.parity-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the report is red until 1:1, and the merge gate refuses every red check: the run stays green,
    # the red is the report step's own outcome, its summary and the parity-report artifact (the
    # supervisor's ruling, kit-895). The step carries it too, so the job's check is green as well.
    continue-on-error: true
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: parity-work
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          pattern: parity-part-*
          path: ${{ runner.temp }}/parity/parts
          merge-multiple: true
      - name: report
        run: |
          set -uo pipefail
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/parity-work.tar"
          # the report exits 1 until 1:1; GitHub runs this under bash -e, so catch it to write the summary
          rc=0
          node test/split/parity.mjs report --at "$SHA" --work "$RUNNER_TEMP/parity" > "$RUNNER_TEMP/report.txt" || rc=$?
          cat "$RUNNER_TEMP/report.txt"
          if [ -f "$RUNNER_TEMP/parity/parity.md" ]; then cat "$RUNNER_TEMP/parity/parity.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          overwrite: true
          path: |
            ${{ runner.temp }}/parity/parity.json
            ${{ runner.temp }}/parity/parity.md
          if-no-files-found: error
          retention-days: 30
