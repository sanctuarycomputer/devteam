name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  kit:
    # named as before: the test_timeout below would otherwise join the name on 20, 22 and 24
    name: kit (${{ matrix.node }}, ${{ matrix.part }})
    # Projects run the kit on whatever Node they pin, so test every supported major. Each major
    # runs in two jobs side by side: the "devteam kit" chain (and the forks it starts), and every
    # other test file.
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
        part: [chain, rest]
        # A hung test file ends its step in minutes, not at the job's limit. --test-timeout is
        # 600000 (above dashboard.test.mjs, the longest file at about 400 s):
        # - Node 18 rejects the flag (bad option), so it gets none;
        # - on 20 and 22 it caps each whole file, killed and named as "not ok - <file>" if that
        #   comes before the step's own limit;
        # - on 24 it caps each top-level test only, and never ends a file held open after its tests.
        # So every test step also has timeout-minutes: 12 (the slowest healthy step is about 7),
        # and the last step lists what is still running.
        include:
          - node: 20
            test_timeout: --test-timeout=600000
          - node: 22
            test_timeout: --test-timeout=600000
          - node: 24
            test_timeout: --test-timeout=600000
    runs-on: ubuntu-latest
    # the kit won't start a worker while the machine's memory is over its ceiling: the tests read a
    # machine of their own (or none), never the runner's
    env:
      DEVTEAM_CGROUP: /nonexistent/devteam-cgroup
      DEVTEAM_MEMINFO: /nonexistent/devteam-meminfo
    # a hung test should fail the job, not hold it for hours
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # the kit drives workers through tmux; the tests run it on servers of their own, through a shim
      # that refuses the machine's default server (test/lib/kit.mjs)
      - run: command -v tmux || (sudo apt-get update -q && sudo apt-get install -yq tmux)
      # test/gitleaks.test.mjs runs the kit's gitleaks config through gitleaks itself: a pinned
      # release, checked against its published sha256, and required (DEVTEAM_TEST_GITLEAKS) so the
      # test can't fall back to its regex-only check here
      - if: matrix.part == 'rest'
        run: |
          set -euo pipefail
          V=8.30.1
          SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL --retry 3 -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "${SHA}  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      # test files are *.test.mjs directly under test/; test/lib holds helpers, which node --test's
      # own discovery would also pick up
      - if: matrix.part == 'chain'
        timeout-minutes: 12
        run: node --test ${{ matrix.test_timeout }} --test-concurrency=8 test/kit.test.mjs
      # bounds.test.mjs times the kit's code against a bound: alone, so nothing else's load counts
      - if: matrix.part == 'rest'
        timeout-minutes: 12
        run: node --test ${{ matrix.test_timeout }} test/bounds.test.mjs
      - if: matrix.part == 'rest'
        env:
          DEVTEAM_TEST_GITLEAKS: '1'
        timeout-minutes: 12
        run: node --test ${{ matrix.test_timeout }} --test-concurrency=8 $(ls test/*.test.mjs | grep -v '/\(kit\|bounds\)\.test\.mjs$')
      # Names a hung file. A step's timeout signals only its shell, so the node --test runner, the
      # hung file's own process (its path names the file) and what it started (a dashboard's or
      # hub's tmp folder names its test) are all still running here; when Node's per-file limit
      # fired first instead, its "not ok - <file>" line above names it.
      - if: failure()
        run: ps -eww -o pid,ppid,etimes,args
