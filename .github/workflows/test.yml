name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  kit:
    # Projects run the kit on whatever Node they pin, so test every supported major.
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # the kit drives workers through tmux; the test checks pane detection on its own tmux server
      - run: command -v tmux || (sudo apt-get update -q && sudo apt-get install -yq tmux)
      - run: node --test
