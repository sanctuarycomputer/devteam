# The box's image is otherwise first built by a release, on the owner's live box. Build it on every
# change to it first (cloud/, and what it copies: the hub page, the operator's prompt, and the kit
# its own commands run).
name: box-image
on:
  pull_request:
    paths: ['cloud/**', 'docs/devteam/dashboard/hub.html', 'docs/devteam/process/operator.md', 'docs/devteam/scripts/**', 'docs/devteam/schema/**', '.github/workflows/box-image.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f cloud/Dockerfile -t box .
      # the kit's own commands from the image's copy, with no repo and no tmux server: they say so, and never fail
      - run: |
          docker run --rm --entrypoint sh box -ec 'box-recover --dry-run; box-status | grep -q "^machine: disk "; test "$(node /opt/devteam/kit/scripts/devteam.mjs machine pane-state %0)" = gone; if command -v box-supervisors; then exit 1; fi; box-pg nope 2>&1 | grep -q "no Postgres"; ffmpeg -version >/dev/null; chromium --version; test -f /opt/devteam/operator.md'
