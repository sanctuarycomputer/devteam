<!doctype html><title>Routes</title>
<button id="buy">Start trial</button>
<script>
// each way out, and the capture server told once one was tried and refused
Object.defineProperty(document, 'fonts', { value: { ready: new Promise((r) => setTimeout(r, 2500)) } });
const tried = (f) => { try { Promise.resolve(f()).catch(() => {}); } catch (e) { /* refused here */ } };
tried(() => { const ws = new WebSocket('__OTHER__/ws'.replace('http', 'ws')); ws.onerror = () => fetch('tried-ws'); });
tried(() => window.open('__OTHER__/popup'));
const blob = (js) => URL.createObjectURL(new Blob([js]));
tried(() => new Worker(blob("fetch('__OTHER__/worker', { mode: 'no-cors' }).catch(() => {})")));
tried(() => new SharedWorker(blob("fetch('__OTHER__/shared', { mode: 'no-cors' }).catch(() => fetch(location.origin + '/tried-shared'))")));
tried(() => navigator.serviceWorker.register('sw.js'));
tried(async () => {
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:127.0.0.1:__UDP__' }] });
  pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === 'complete') fetch('tried-rtc'); };
  pc.createDataChannel('x');
  await pc.setLocalDescription(await pc.createOffer());
});
setTimeout(() => tried(() => { location.href = '__OTHER__/moved'; }), 1800);
</script>
