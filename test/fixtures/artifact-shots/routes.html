<!doctype html><title>Routes</title>
<button id="buy">Start trial</button>
<script>
// each way out, and the capture server told once one was tried and refused
Object.defineProperty(document, 'fonts', { value: { ready: new Promise((r) => setTimeout(r, 6000)) } });
const tried = (f) => { try { Promise.resolve(f()).catch(() => {}); } catch (e) { /* refused here */ } };
tried(() => { const ws = new WebSocket('__OTHER__/ws'.replace('http', 'ws')); ws.onerror = () => fetch('tried-ws').catch(() => {}); });
tried(() => window.open('__OTHER__/popup'));
const blob = (js) => URL.createObjectURL(new Blob([js]));
tried(() => new Worker(blob("fetch('__OTHER__/worker', { mode: 'no-cors' }).catch(() => {})")));
const home = location.href.replace(/[^/]*$/, '');
const told = () => fetch(home + 'tried-shared', { mode: 'no-cors' }).catch(() => {});
tried(() => { try { new SharedWorker(blob("fetch('__OTHER__/shared', { mode: 'no-cors' }).catch(() => fetch('" + home + "tried-shared', { mode: 'no-cors' }))")).onerror = told; } catch (e) { told(); } });
// refused where the page has no origin of its own
tried(() => { try { navigator.serviceWorker.register('sw.js').catch(() => fetch('tried-sw').catch(() => {})); } catch (e) { fetch('tried-sw').catch(() => {}); } });
tried(async () => {
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:127.0.0.1:__UDP__' }, { urls: 'turn:127.0.0.1:__TCP__?transport=tcp', username: 'u', credential: 'c' }] });
  pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === 'complete') fetch('tried-rtc').catch(() => {}); };
  pc.createDataChannel('x');
  await pc.setLocalDescription(await pc.createOffer());
  // a peer that says it waits at the other server, over each protocol
  const peer = new RTCPeerConnection();
  await peer.setRemoteDescription(pc.localDescription);
  await peer.setLocalDescription(await peer.createAnswer());
  await pc.setRemoteDescription(peer.localDescription);
  await Promise.all([['udp __UDP__', ''], ['tcp __TCP__', ' tcptype passive']].map(([how, kind]) => { const [proto, port] = how.split(' '); return pc.addIceCandidate({ candidate: 'candidate:1 1 ' + proto + ' 2122260223 127.0.0.1 ' + port + ' typ host' + kind, sdpMid: '0' }).catch(() => {}); }));
  fetch('tried-peer').catch(() => {});
});
setTimeout(() => tried(() => { location.href = '__OTHER__/moved'; }), 1800);
</script>
