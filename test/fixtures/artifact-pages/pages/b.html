<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pages, B</title>
<style>
  body { margin: 0; font: 16px/1.4 sans-serif; }
  #b-el, #to-section-2, #section-2 { position: absolute; display: block; box-sizing: border-box; left: 40px; width: 200px; height: 40px; }
  #b-el { top: 40px; }
  #to-section-2 { top: 120px; }
  /* in view already: following the link to it scrolls nothing, so #b-el stays where its pin is drawn */
  #section-2 { top: 300px; }
</style></head>
<body>
<button id="b-el" type="button">Section one</button>
<a id="to-section-2" href="#section-2">To section 2</a>
<h2 id="section-2">Section 2</h2>
<script>
const ids = ['b-el', 'to-section-2'];
const rects = () => Object.fromEntries(ids.map((id) => { const r = document.getElementById(id).getBoundingClientRect(); return [id, { x: r.left, y: r.top, w: r.width, h: r.height }]; }));
const say = () => parent.postMessage({ own: 'at', page: 'pages/b.html', hash: location.hash, rects: rects() }, '*');
addEventListener('load', () => { say(); requestAnimationFrame(() => requestAnimationFrame(say)); });
addEventListener('resize', say);
addEventListener('hashchange', say);
</script>
</body></html>
