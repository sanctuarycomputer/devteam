<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pages</title>
<style>
  body { margin: 0; font: 16px/1.4 sans-serif; }
  /* at fixed places, so a click inside the frame lands where the test aims */
  #to-a, #to-b, #to-tab2, #push { position: absolute; display: block; box-sizing: border-box; left: 40px; width: 160px; height: 32px; }
  #to-a { top: 40px; }
  #to-b { top: 100px; }
  #to-tab2 { top: 160px; }
  #push { top: 220px; }
</style></head>
<body>
<a id="to-a" href="a.html">To page A</a>
<a id="to-b" href="b.html">To page B</a>
<a id="to-tab2" href="#tab2">To its second view</a>
<button id="push" type="button">Push a view</button>
<script>
// Where this page is, and where its elements are in its own viewport, told to the dashboard's window
// (the frame's origin is opaque, so the test reads nothing in here itself): on load, on a fragment move
// and after its own pushState (which fires no event).
const ids = ['to-a', 'to-b', 'to-tab2', 'push'];
const rects = () => Object.fromEntries(ids.map((id) => { const r = document.getElementById(id).getBoundingClientRect(); return [id, { x: r.left, y: r.top, w: r.width, h: r.height }]; }));
const say = () => parent.postMessage({ own: 'at', page: 'pages/index.html', hash: location.hash, rects: rects() }, '*');
addEventListener('load', () => { say(); requestAnimationFrame(() => requestAnimationFrame(say)); });
addEventListener('resize', say);
addEventListener('hashchange', say);
// a move with no load and no hashchange: a history router's
document.getElementById('push').addEventListener('click', () => { history.pushState({ view: 'pushed' }, '', '#pushed'); say(); });
</script>
</body></html>
