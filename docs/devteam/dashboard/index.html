<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devteam</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1d1d1b; --muted:#6b6a65; --line:#e3e1da; --card:#fff; --hi:#b42318; --mid:#b54708; --lo:#475467; --ok:#067647; --bar:#1d1d1b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --fg:#ecebe6; --muted:#9a998f; --line:#2c2b28; --card:#1c1c1a; --hi:#f97066; --mid:#fdb022; --lo:#98a2b3; --ok:#47cd89; --bar:#ecebe6; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 10px; }
  .muted { color: var(--muted); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat b { display: block; font-size: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); margin-right: 6px; }
  .high { color: var(--hi); border-color: var(--hi); } .medium { color: var(--mid); border-color: var(--mid); } .low { color: var(--lo); border-color: var(--lo); }
  textarea { width: 100%; min-height: 54px; margin-top: 8px; padding: 8px; font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); cursor: pointer; margin-top: 6px; }
  button.opt { background: transparent; color: var(--fg); border-color: var(--line); margin-right: 6px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  .scroll { overflow-x: auto; }
  .bars div { display: grid; grid-template-columns: 120px 1fr 70px; gap: 8px; align-items: center; margin: 4px 0; }
  .bars span.b { height: 10px; background: var(--bar); border-radius: 3px; min-width: 2px; }
  .two { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .crit { font-weight: 700; }
  code { font-size: 12px; }
  .err { color: var(--hi); }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">devteam</h1>
    <span class="muted" id="when"></span>
    <span class="muted" id="err"></span>
  </header>

  <div class="grid" id="stats"></div>

  <h2>Questions for you</h2>
  <div id="questions"></div>

  <h2>Blockers and inefficiencies</h2>
  <div id="findings"></div>

  <h2>Tickets</h2>
  <div class="scroll"><table id="tickets"></table></div>

  <div class="two">
    <div><h2>Time by phase (hours)</h2><div class="bars card" id="phase-time"></div></div>
    <div><h2>Cost by phase (USD)</h2><div class="bars card" id="phase-cost"></div></div>
  </div>

  <h2>Gates</h2>
  <div class="scroll"><table id="gates"></table></div>
  <div class="two">
    <div><h2>Flaky tests</h2><div id="flaky"></div></div>
    <div><h2>Slowest tests</h2><div id="slow"></div></div>
  </div>

  <h2>Messages waiting for a reply</h2>
  <div id="messages"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const drafts = {};
const dur = (s) => (s < 60 ? `${s}s` : `${(s / 60).toFixed(1)} min`);

function bars(el, obj, fmt) {
  const entries = Object.entries(obj || {});
  if (!entries.length) { el.innerHTML = '<span class="muted">no data yet</span>'; return; }
  const max = Math.max(...entries.map(([, v]) => v), 0.0001);
  el.innerHTML = entries.map(([k, v]) => `<div><span>${esc(k)}</span><span class="b" style="width:${(100 * v) / max}%"></span><span>${fmt(v)}</span></div>`).join('');
}

function render(d) {
  const m = d.metrics;
  $('title').textContent = d.project && !String(d.project).startsWith('<') ? `devteam · ${d.project}` : 'devteam';
  $('when').textContent = `updated ${new Date(d.generated_at).toLocaleTimeString()}`;
  const active = d.tickets.filter((t) => t.phase && !['done', 'parked'].includes(t.phase)).length;
  const stats = [
    ['workers active', `${active}/${d.caps.max_active_tickets}`],
    ['tickets merged', m.tickets_merged],
    ['median cycle', m.cycle_hours.median == null ? '–' : `${m.cycle_hours.median}h`],
    ['cost per ticket', m.cost.usd_per_merged_ticket == null ? '–' : `$${m.cost.usd_per_merged_ticket}`],
    ['spend', `$${m.cost.usd_total}`],
    ['open questions', d.questions.length],
    ['escaped defects', m.escaped_defects],
  ];
  $('stats').innerHTML = stats.map(([k, v]) => `<div class="stat"><span class="muted">${esc(k)}</span><b>${esc(v)}</b></div>`).join('');

  // Questions: keep any half-typed answer across refreshes.
  document.querySelectorAll('textarea[data-q]').forEach((t) => { drafts[t.dataset.q] = t.value; });
  $('questions').innerHTML = d.questions.length ? d.questions.map((q) => `
    <div class="card">
      <span class="badge ${q.kind === 'one-way-door' ? 'high' : 'medium'}">${esc(q.kind)}</span>
      ${q.ticket ? `<code>${esc(q.ticket)}</code>` : ''} <span class="muted">${esc(q.id)}</span>
      <p><b>${esc(q.question)}</b></p>
      ${q.context ? `<p class="muted">${esc(q.context)}</p>` : ''}
      ${q.recommendation ? `<p>Recommendation: ${esc(q.recommendation)}</p>` : ''}
      ${q.blocks?.length ? `<p class="muted">Blocks ${q.blocks.map(esc).join(', ')}</p>` : ''}
      ${q.default ? `<p class="muted">Default if unanswered: ${esc(q.default)}</p>` : ''}
      ${(q.options || []).map((o) => `<button class="opt" data-fill="${esc(q.id)}" data-val="${esc(o)}">${esc(o)}</button>`).join('')}
      <textarea data-q="${esc(q.id)}" placeholder="Your answer">${esc(drafts[q.id] || '')}</textarea>
      <button data-answer="${esc(q.id)}">Answer</button> <span class="err" id="e-${esc(q.id)}"></span>
    </div>`).join('') : '<p class="muted">Nothing needs you right now.</p>';

  $('findings').innerHTML = m.findings.length ? m.findings.map((f) => `
    <div class="card"><span class="badge ${f.severity}">${f.severity}</span><b>${esc(f.kind)}</b> · <code>${esc(f.subject)}</code>
    <div class="muted">${esc(f.detail)}</div><div>→ ${esc(f.suggestion)}</div></div>`).join('') : '<p class="muted">None found.</p>';

  const crit = new Set(d.critical_path);
  $('tickets').innerHTML = '<tr><th>Ticket</th><th>Stage</th><th>Phase</th><th>Heartbeat</th><th>Cost</th></tr>' + d.tickets.map((t) => `
    <tr><td class="${crit.has(t.id) ? 'crit' : ''}">${esc(t.id)}${crit.has(t.id) ? ' ★' : ''}</td><td>${esc(t.stage)}</td>
    <td>${esc(t.phase || '')}${t.task ? ` <span class="muted">${esc(t.task)}</span>` : ''}</td>
    <td>${t.heartbeat_minutes == null ? '' : `${t.heartbeat_minutes}m ago`}</td>
    <td>${m.cost.by_ticket[t.id] == null ? '' : `$${m.cost.by_ticket[t.id]}`}</td></tr>`).join('');

  bars($('phase-time'), m.phase_hours, (v) => `${v}h`);
  bars($('phase-cost'), m.phase_usd, (v) => `$${v}`);

  $('gates').innerHTML = '<tr><th>Gate</th><th>Runs</th><th>Median</th><th>Slowest</th><th>Fail rate</th></tr>' + (m.gates.gates.length
    ? m.gates.gates.map((g) => `<tr><td>${esc(g.gate)}${m.gates.flaky_gates.some((f) => f.gate === g.gate) ? ' <span class="badge high">flaky</span>' : ''}</td><td>${g.runs}</td><td>${dur(g.median_seconds)}</td><td>${dur(g.max_seconds)}</td><td>${Math.round(g.fail_rate * 100)}%</td></tr>`).join('')
    : '<tr><td colspan="5" class="muted">No gate runs recorded. Run gates through <code>devteam.mjs gate</code>.</td></tr>');
  $('flaky').innerHTML = m.gates.flaky_tests.length ? m.gates.flaky_tests.map((t) => `<div class="card"><code>${esc(t.name)}</code> <span class="muted">${t.times}×</span></div>`).join('') : '<p class="muted">None seen.</p>';
  $('slow').innerHTML = m.gates.slowest_tests.length ? m.gates.slowest_tests.map((t) => `<div class="card"><code>${esc(t.name)}</code> <span class="muted">${t.median_seconds}s</span></div>`).join('') : '<p class="muted">No test reports yet (pass --junit).</p>';

  $('messages').innerHTML = d.open_messages.length ? d.open_messages.map((x) => `
    <div class="card"><span class="badge medium">${esc(x.kind)}</span>${esc(x.actor)} → ${esc(x.to)} <span class="muted">${esc(x.id)}</span><div>${esc(x.summary)}</div></div>`).join('') : '<p class="muted">None.</p>';
}

async function load() {
  try {
    const r = await fetch('/api/data');
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    $('err').textContent = '';
    render(d);
  } catch (e) { $('err').textContent = `could not load: ${e.message}`; }
}

document.addEventListener('click', async (ev) => {
  const fill = ev.target.closest('[data-fill]');
  if (fill) { document.querySelector(`textarea[data-q="${fill.dataset.fill}"]`).value = fill.dataset.val; return; }
  const btn = ev.target.closest('[data-answer]');
  if (!btn) return;
  const id = btn.dataset.answer;
  const answer = document.querySelector(`textarea[data-q="${id}"]`).value;
  btn.disabled = true;
  const r = await fetch('/api/answer', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id, answer }) });
  const out = await r.json();
  btn.disabled = false;
  if (!r.ok) { $(`e-${id}`).textContent = out.error || 'failed'; return; }
  delete drafts[id];
  load();
});

load();
setInterval(load, 10000);
</script>
</body>
</html>
