<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>devteam</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="devteam">
<style>
  /* devteam-ui tokens start */
  :root {
    color-scheme: light;
    --bg: #fafafa; --surface: #ffffff; --raised: #ffffff; --hover: #f2f2f2; --well: #f2f2f2;
    --fg: #171717; --fg-2: #666666; --muted: #8f8f8f; --line: #ebebeb; --line-2: #dcdcdc;
    --blue: #0070f3; --blue-fg: #0068d6; --red: #ee0000; --red-fg: #cb2a2f; --amber: #f5a623; --amber-fg: #a35200; --green: #45a557; --green-fg: #297a3a;
    --series-1: #0070f3; --grid: #ebebeb; --shadow: 0 1px 2px rgba(0,0,0,.04);
    --sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --bg: #000000; --surface: #0a0a0a; --raised: #111111; --hover: #1a1a1a; --well: #111111;
    --fg: #ededed; --fg-2: #a1a1a1; --muted: #7d7d7d; --line: #1f1f1f; --line-2: #2e2e2e;
    --blue: #52a8ff; --blue-fg: #52a8ff; --red: #ff6166; --red-fg: #ff6166; --amber: #ffb224; --amber-fg: #ffb224; --green: #3cd58c; --green-fg: #62c073;
    --series-1: #52a8ff; --grid: #1f1f1f; --shadow: none;
  } }
  /* devteam-ui tokens end */
  :root { --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: ui-monospace, SFMono-Regular, Menlo, monospace; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { touch-action: manipulation; }
  /* an app, not a page: the hub itself never scrolls or rubber-bands; its views scroll inside */
  html, body { overscroll-behavior: none; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  header { display: flex; align-items: flex-end; gap: 12px; padding: 6px 12px 0; background: var(--surface); border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  /* The tabs scroll sideways only: no vertical scroll, no pull, and a swipe that reaches either end
     stays in the strip. The strip, not each tab, hangs 1px over the header's rule, so the chosen
     tab covers it without the strip having anything to scroll up or down. */
  nav { display: flex; gap: 2px; overflow-x: auto; overflow-y: hidden; overscroll-behavior: contain; touch-action: pan-x; flex: 1 1 auto; margin-bottom: -1px; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  .tab { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 7px; border: 1px solid transparent; border-bottom: 0; border-radius: 7px 7px 0 0; background: none; color: var(--fg-2); font: 500 13px/18px var(--sans); cursor: pointer; white-space: nowrap; flex: 0 0 auto; }
  .tab:hover { color: var(--fg); background: var(--hover); }
  .tab[aria-selected="true"] { color: var(--fg); background: var(--bg); border-color: var(--line); }
  .tab.gone { opacity: .45; }
  /* as the dashboard's nav shows its Inbox count */
  .badge { font-size: 11px; color: var(--red-fg); font-variant-numeric: tabular-nums; }
  #notify { flex: 0 0 auto; padding-bottom: 7px; color: var(--muted); font-size: 12px; }
  #box-links { flex: 0 0 auto; padding-bottom: 7px; font-size: 12px; }
  #box-links a { color: var(--fg-2); }
  #box-links a + a { margin-left: 10px; }
  #notify button { font: inherit; color: var(--fg-2); background: none; border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  #notify button.plain { color: inherit; border: 0; padding: 0; }
  main { flex: 1 1 auto; position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  iframe[hidden] { display: none; }
  @media (max-width: 640px) { header { flex-wrap: wrap; } nav { order: 3; flex-basis: 100%; } }
  #drop-hint { position: fixed; left: 50%; top: 52px; transform: translateX(-50%); z-index: 10; padding: 8px 14px; border-radius: 6px; background: var(--fg); color: var(--bg); font-size: 13px; pointer-events: none; }
  #empty { margin: 48px auto; max-width: 520px; padding: 0 16px; color: var(--fg-2); text-align: center; }
  /* the Overview: a card per project, read at a glance */
  #overview { position: absolute; inset: 0; overflow: auto; padding: 20px 16px 40px; }
  #overview[hidden] { display: none; }
  .ov-head { max-width: 1200px; margin: 0 auto 16px; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
  .ov-head h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .ov-head .sum { color: var(--fg-2); }
  .ov-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 12px; align-items: start; }
  .ov-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); min-width: 0; overflow-wrap: anywhere; }
  .ov-card.bad { border-color: color-mix(in srgb, var(--red) 45%, var(--line)); }
  .ov-card.warn { border-color: color-mix(in srgb, var(--amber) 55%, var(--line)); }
  .ov-top { display: flex; align-items: center; gap: 8px; }
  .ov-name { font: 600 15px/1.3 var(--sans); color: var(--fg); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; min-width: 0; }
  .ov-name:hover { text-decoration: underline; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--well); color: var(--fg-2); }
  .pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.green { color: var(--green-fg); background: color-mix(in srgb, var(--green) 14%, transparent); }
  .pill.blue { color: var(--blue-fg); background: color-mix(in srgb, var(--blue) 12%, transparent); }
  .pill.amber { color: var(--amber-fg); background: color-mix(in srgb, var(--amber) 16%, transparent); }
  .pill.red { color: var(--red-fg); background: color-mix(in srgb, var(--red) 12%, transparent); }
  .ov-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .ov-stat { display: flex; flex-direction: column; min-width: 0; }
  .ov-stat .k { color: var(--muted); font-size: 11px; }
  .ov-stat .v { font: 500 14px/1.3 var(--sans); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ov-stat .v.red { color: var(--red-fg); }
  .ov-stat .v.amber { color: var(--amber-fg); }
  .ov-stat button.v { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font: inherit; font: 500 14px/1.3 var(--sans); }
  .ov-bar { height: 6px; border-radius: 3px; background: var(--well); overflow: hidden; }
  .ov-bar { display: flex; }
  .ov-bar > span { display: block; height: 100%; background: var(--green); }
  .ov-bar > span.held { background: var(--amber); }
  .ov-pills { display: flex; gap: 6px; flex: 0 0 auto; }
  .ov-goal { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; min-width: 0; }
  .ov-goal .k { color: var(--muted); font-size: 11px; flex: 0 0 auto; }
  .ov-goal .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .ov-goal .n { color: var(--fg-2); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; flex: 0 0 auto; }
  .seg button { font: 500 12px/1 var(--sans); color: var(--fg-2); background: none; border: 0; padding: 6px 10px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button:hover:not(:disabled) { background: var(--hover); color: var(--fg); }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .seg button.confirm { background: var(--red); color: #fff; }
  .seg button:disabled { cursor: default; opacity: .6; }
  .seg button[aria-pressed="true"]:disabled { opacity: 1; }
  .ov-ctl { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .ov-ctl .msg { font-size: 12px; color: var(--fg-2); }
  .ov-ctl .msg.err { color: var(--red-fg); }
  .ov-head .acts { margin-left: auto; display: flex; gap: 8px; }
  .ov-head .acts button { font: 500 12.5px/1 var(--sans); padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); cursor: pointer; }
  .ov-head .acts button:hover { background: var(--hover); }
  .ov-head .acts button.confirm { background: var(--red); border-color: var(--red); color: #fff; }
  .ov-prog { display: flex; flex-direction: column; gap: 4px; }
  .ov-prog .k { color: var(--fg-2); font-size: 12px; }
  .ov-att { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .ov-att li { position: relative; padding-left: 14px; font-size: 12.5px; color: var(--fg); }
  .ov-att li::before { content: ''; position: absolute; left: 2px; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
  .ov-att li.red::before { background: var(--red); }
  .ov-ok { font-size: 12.5px; color: var(--fg-2); }
  .ov-mosaic { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 9px); grid-auto-columns: 9px; gap: 2px; }
  .ov-mosaic i { border-radius: 2px; background: var(--well); }
  .ov-mosaic i.l1 { background: color-mix(in srgb, var(--green) 30%, var(--well)); }
  .ov-mosaic i.l2 { background: color-mix(in srgb, var(--green) 55%, var(--well)); }
  .ov-mosaic i.l3 { background: color-mix(in srgb, var(--green) 78%, var(--well)); }
  .ov-mosaic i.l4 { background: var(--green); }
  .ov-mosaic i.pad { background: none; }
  .ov-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .ov-foot .k { color: var(--muted); font-size: 11px; }
  .ov-none { color: var(--fg-2); font-size: 12.5px; }
  @media (max-width: 640px) { .ov-stat .v { font-size: 13px; } #overview { padding: 14px 12px 32px; } .ov-grid { grid-template-columns: minmax(0, 1fr); } }
  /* threads with the operator: the dashboard's thread layer (index.html, .tl-*), over the Overview */
  #ov-body { min-width: 0; }
  #tl { position: fixed; left: 0; top: 0; width: 0; height: 0; }
  #tl[hidden] { display: none; }
  #tl button, .tl-pin { font: inherit; cursor: pointer; }
  #tl .btn { font-size: 12px; font-weight: 500; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); white-space: nowrap; flex: 0 0 auto; }
  #tl .btn:hover { opacity: .88; }
  #tl .btn:disabled { opacity: .5; cursor: default; }
  #tl .btn.ghost { background: var(--surface); color: var(--fg); border-color: var(--line-2); }
  #tl .btn.ghost:hover:not(:disabled) { background: var(--hover); opacity: 1; }
  #tl .btn.ghost[aria-pressed="true"] { border-color: var(--blue); color: var(--blue-fg); background: color-mix(in srgb, var(--blue) 10%, var(--surface)); }
  #tl .btn.x { width: 28px; padding: 0; font-size: 16px; line-height: 1; }
  #tl textarea { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px; outline: none; width: 100%; min-height: 56px; margin-top: 6px; padding: 8px 10px; resize: vertical; }
  #tl textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 18%, transparent); }
  #tl .muted { color: var(--fg-2); }
  #tl .small { font-size: 12px; }
  #tl .err { color: var(--red-fg); font-size: 12px; }
  #tl .grow { flex: 1 1 auto; }
  #tl .empty { color: var(--muted); font-size: 12px; margin: 0; padding: 6px; }
  #tl .meta { font-size: 12px; color: var(--muted); }
  #tl .row-inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--fg-2); }
  .tl-aiming, .tl-aiming * { cursor: none !important; }
  .tl-pinning { touch-action: none; }
  .tl-cursor { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .tl-cursor path { fill: var(--blue); stroke: #fff; stroke-width: 2; }
  .tl-cursor circle { fill: #fff; }
  .tl-hl { position: fixed; z-index: 58; pointer-events: none; border: 2px solid var(--blue); border-radius: 8px; background: color-mix(in srgb, var(--blue) 8%, transparent); }
  .tl-chip { position: fixed; z-index: 59; pointer-events: none; max-width: 260px; padding: 2px 8px; border-radius: 6px; background: var(--fg); color: var(--bg); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* fixed, beside its pin: the Overview scrolls inside its own box, and the card is placed again as it does */
  .tl-card { position: fixed; z-index: 50; width: 360px; max-height: min(560px, 80vh); display: flex; flex-direction: column; background: var(--raised); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.18); padding: 10px 12px; }
  .tl-card[hidden], .tl-panel[hidden], .tl-hl[hidden], .tl-chip[hidden], .tl-cursor[hidden] { display: none; }
  .tl-card.in-dock { right: 16px; bottom: 64px; }
  .tl-card.sheet { left: 0; right: 0; bottom: 0; width: auto; max-height: 75vh; border-radius: 12px 12px 0 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .tl-head { display: flex; align-items: center; gap: 6px; }
  .tl-head .tl-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .tl-ctx { margin: 6px 0; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--well); font-size: 12px; }
  .tl-ctx summary { display: flex; gap: 6px; align-items: center; cursor: pointer; list-style: none; min-width: 0; }
  .tl-ctx summary::-webkit-details-marker { display: none; }
  .tl-ctx summary b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; min-width: 0; }
  .tl-ctx summary span { flex: 0 0 auto; }
  .tl-ctx dl { margin: 6px 0 2px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  .tl-ctx dt { color: var(--muted); }
  .tl-ctx dd { margin: 0; overflow-wrap: anywhere; }
  .tl-turns { overflow-y: auto; flex: 1; min-height: 60px; display: flex; flex-direction: column; gap: 8px; padding: 4px 0; }
  .tl-turn .tl-text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .tl-turn.owner { align-self: flex-end; max-width: 88%; background: color-mix(in srgb, var(--blue) 10%, var(--surface)); border-radius: 8px; padding: 6px 8px; }
  @media (max-width: 640px) { .tl-card:not(.sheet) { width: calc(100vw - 32px); } }
  /* in the Overview's own box, so a pin scrolls with what it is on */
  .tl-pins { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 10; }
  .tl-pin { position: absolute; width: 22px; height: 22px; padding: 0; margin: 0; border-radius: 50%; border: 2px solid #fff; background: var(--blue); color: #fff; font: 600 11px/18px var(--sans); text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .tl-pin.on { outline: 2px solid var(--blue); outline-offset: 2px; }
  .tl-pin sup { font-size: 9px; margin-left: 1px; }
  .tl-dock { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 45; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #tl .tl-pill { border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.12); display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; }
  .tl-pill svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tl-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); flex: 0 0 auto; }
  .tl-panel { width: 320px; max-width: calc(100vw - 32px); max-height: 60vh; overflow-y: auto; background: var(--raised); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.18); }
  .tl-dock-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .tl-op { display: flex; align-items: center; gap: 8px; padding: 6px; margin-bottom: 4px; border-radius: 6px; background: var(--well); font-size: 12px; color: var(--fg-2); }
  .tl-op.warn { color: var(--amber-fg); }
  .tl-op span { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  #tl button.tl-row { display: flex; align-items: center; gap: 8px; width: 100%; margin: 0; text-align: left; background: none; border: 0; border-radius: 6px; padding: 6px; color: var(--fg); font-size: 12.5px; }
  #tl button.tl-row:hover { background: var(--hover); }
  .tl-row .tl-r { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .tl-row .tl-r b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .tl-row .tl-r span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-n { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 11px; line-height: 20px; text-align: center; }
  .tl-closed summary { cursor: pointer; font-size: 12px; color: var(--fg-2); padding: 6px; }
  @media (pointer: coarse) { #tl .btn { height: 36px; padding: 0 14px; } #tl .btn.x { width: 36px; padding: 0; } #tl .tl-pill { height: 40px; } }
</style>
</head>
<body>
<header>
  <nav id="tabs" role="tablist" aria-label="devteam instances"></nav>
  <span id="notify"></span>
  <span id="box-links" hidden></span>
</header>
<main id="frames"><p id="empty">Looking for devteam dashboards on this machine…</p><section id="overview" hidden aria-label="Overview of every project"><div id="ov-body"></div><div id="tl-pins" class="tl-pins"></div></section></main>
<div id="drop-hint" hidden></div>
<!-- the thread layer: outside what the Overview redraws every 10 s (the pins are in its box, beside it) -->
<div id="tl" hidden>
  <div id="tl-hl" class="tl-hl" hidden></div>
  <div id="tl-chip" class="tl-chip" hidden></div>
  <div id="tl-cursor" class="tl-cursor" hidden aria-hidden="true"><svg viewBox="0 0 28 36" width="28" height="36"><path d="M14 35C14 35 2 21 2 13a12 12 0 0 1 24 0c0 8-12 22-12 22z"/><circle cx="14" cy="13" r="4.5"/></svg></div>
  <div id="tl-card" class="tl-card" role="dialog" aria-label="A thread with the operator" hidden></div>
  <div id="tl-dock" class="tl-dock">
    <div id="tl-panel" class="tl-panel" hidden>
      <div class="tl-dock-head"><b>Threads</b><span class="small muted">with the operator</span><span class="grow"></span><button type="button" class="btn ghost" id="tl-pinbtn" aria-pressed="false" title="Point at something on the Overview to start a thread about it: for a phone, or for a long look around">Pin</button><button type="button" class="btn ghost" id="tl-new">New thread</button></div>
      <div id="tl-op" class="tl-op" hidden></div>
      <div id="tl-list"></div>
    </div>
    <button type="button" id="tl-pill" class="btn ghost tl-pill" aria-expanded="false"></button>
  </div>
</div>
<script>
// An app, not a page: iOS ignores user-scalable=no for pinches, so its gesture events are cancelled.
for (const t of ['gesturestart', 'gesturechange']) document.addEventListener(t, (e) => e.preventDefault(), { passive: false });
// The hub's page: a tab per devteam instance on the machine (its name, and a badge when its Inbox
// has something), and that instance's own dashboard in a frame under it, on the instance's own
// address. The list comes from the hub's own server (instances.json); text goes in as text.
const $ = (id) => document.getElementById(id);
const tabsEl = $('tabs');
const framesEl = $('frames');
const empty = $('empty');
const items = new Map(); // root -> { x, tab, frame, goneAt }
const hex6 = new Map();  // root -> 6 hex of its sha1, for telling two same-named instances apart
const lastInbox = new Map();
const openedWith = new Set(); // roots already there when the page opened: their first count is a baseline
let selected = null;
let firstDraw = true;
const GONE_MS = 30000;
const NOTIFY_OK = 'Notification' in window && window.isSecureContext;

async function hexOf(root) {
  if (!hex6.has(root)) {
    try { const d = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(root)); hex6.set(root, [...new Uint8Array(d)].slice(0, 3).map((b) => b.toString(16).padStart(2, '0')).join('')); } catch { hex6.set(root, String(hex6.size)); }
  }
  return hex6.get(root);
}
function keyOf(it) {
  const twins = [...items.values()].filter((o) => o.x.name === it.x.name).length > 1;
  return twins ? `${it.x.name}-${hex6.get(it.x.root)}` : String(it.x.name);
}
// Each dashboard is on its own address: on the machine, its own port on 127.0.0.1. On a cloud box
// behind a devteam gateway (cloud/gateway.mjs), box.json says where instead (its own subdomain, so
// still an origin of its own), and adds the box's terminal as the first tab.
let box = null; // { terminal, instance } when the gateway answers box.json
const urlOf = (x) => (box ? box.instance.replace('{port}', String(Number(x.port))) : `http://127.0.0.1:${Number(x.port)}/`);
const TERM = '\u0000terminal';
let term = null; // { tab, frame }
const OVERVIEW = '\u0000overview';

  if (want === 'overview') return void (selected !== OVERVIEW && selectOverview());
  const it = [...items.values()].find((o) => keyOf(o) === want);
  if (it && it.x.root !== selected) select(it.x.root);
});
tabsEl.addEventListener('keydown', (e) => {
  if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const roots = [...(term ? [TERM] : []), OVERVIEW, ...[...items.keys()].sort(byRoot)];
  const i = roots.indexOf(selected);
  const next = roots[(i + (e.key === 'ArrowRight' ? 1 : roots.length - 1)) % roots.length];
  if (next) { select(next); (next === TERM ? term.tab : next === OVERVIEW ? ovTab : items.get(next).tab).focus(); }
});
// Left alone, a browser opens whatever is dropped on a page in a new tab. A drop on the terminal
// goes to the terminal's own page, in its frame; this is for everywhere the hub itself is under
// the pointer (the tab bar, the margins), where nothing can take it. Refused, with a word why.
{
  const hint = $('drop-hint');
  let hide = 0;
  const say = () => {
    if (term) hint.textContent = selected === TERM ? 'Drop onto the terminal, below the tabs' : 'Drop onto the Terminal tab';
    else hint.textContent = 'This page doesn\'t take files';
    hint.hidden = false;
    clearTimeout(hide);
    hide = setTimeout(() => { hint.hidden = true; }, 1500);
  };
  window.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'none'; say(); });
  window.addEventListener('drop', (e) => { e.preventDefault(); say(); });
}
// The hub on a laptop has no box.json (404); a devteam gateway answers it.
async function findBox() {
  try {
    const r = await fetch('box.json', { cache: 'no-store' });
    const b = r.ok ? await r.json() : null;
    // https, or a local gateway on http://*.localhost (a laptop testing the box chain end to end)
    const secure = (u) => { try { const x = new URL(u.replace('{port}', '1')); return x.protocol === 'https:' || (location.protocol === 'http:' && x.protocol === 'http:' && x.hostname.endsWith('.localhost')); } catch { return false; } };
    if (b?.box !== 1 || typeof b.terminal !== 'string' || !secure(b.terminal) || typeof b.instance !== 'string' || !b.instance.includes('{port}') || !secure(b.instance)) return;
    box = { terminal: b.terminal, instance: b.instance, push: typeof b.push === 'string' ? b.push : null };
    if (typeof b.previews === 'string' && secure(b.previews)) {
      const a = document.createElement('a');
      a.href = b.previews;
      a.textContent = 'Previews';
      $('box-links').append(a);
      $('box-links').hidden = false;
    }
    // signing in and passkeys are on the gateway's own name, never in the hub's
    if (typeof b.passkeys === 'string' && secure(b.passkeys)) {
      const a = document.createElement('a');
      a.href = b.passkeys;
      a.textContent = 'Passkeys';
      $('box-links').append(a);
      $('box-links').hidden = false;
    }
    const tab = document.createElement('button');
    tab.className = 'tab';
    tab.setAttribute('role', 'tab');
    tab.textContent = 'Terminal';
    tab.title = 'The box\'s tmux sessions: supervisors, workers, logins';
    tab.onclick = selectTerminal;
    tabsEl.prepend(tab);
    term = { tab, frame: null };
  } catch {}
}
// The Overview's tab: after the box's Terminal, before the projects.
ovTab = document.createElement('button');
ovTab.className = 'tab';
ovTab.setAttribute('role', 'tab');
ovTab.textContent = 'Overview';
ovTab.title = 'Every project at a glance: is it moving, what it needs from you';
ovTab.onclick = selectOverview;
tabsEl.append(ovTab);
findBox().then(() => { notifyControl(); return draw(); });
setInterval(draw, 10000);
</script>
