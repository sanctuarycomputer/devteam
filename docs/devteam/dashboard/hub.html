<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>devteam</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="devteam">
<style>
  /* devteam-ui tokens start */
  :root {
    color-scheme: light;
    --bg: #fafafa; --surface: #ffffff; --raised: #ffffff; --hover: #f2f2f2; --well: #f2f2f2;
    --fg: #171717; --fg-2: #666666; --muted: #8f8f8f; --line: #ebebeb; --line-2: #dcdcdc;
    --blue: #0070f3; --blue-fg: #0068d6; --red: #ee0000; --red-fg: #cb2a2f; --amber: #f5a623; --amber-fg: #a35200; --green: #45a557; --green-fg: #297a3a;
    --series-1: #0070f3; --grid: #ebebeb; --shadow: 0 1px 2px rgba(0,0,0,.04);
    --sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --bg: #000000; --surface: #0a0a0a; --raised: #111111; --hover: #1a1a1a; --well: #111111;
    --fg: #ededed; --fg-2: #a1a1a1; --muted: #7d7d7d; --line: #1f1f1f; --line-2: #2e2e2e;
    --blue: #52a8ff; --blue-fg: #52a8ff; --red: #ff6166; --red-fg: #ff6166; --amber: #ffb224; --amber-fg: #ffb224; --green: #3cd58c; --green-fg: #62c073;
    --series-1: #52a8ff; --grid: #1f1f1f; --shadow: none;
  } }
  /* devteam-ui tokens end */
  :root { --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: ui-monospace, SFMono-Regular, Menlo, monospace; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { touch-action: manipulation; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  header { display: flex; align-items: flex-end; gap: 12px; padding: 6px 12px 0; background: var(--surface); border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  nav { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  .tab { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 7px; border: 1px solid transparent; border-bottom: 0; border-radius: 7px 7px 0 0; background: none; color: var(--fg-2); font: 500 13px/18px var(--sans); cursor: pointer; white-space: nowrap; margin-bottom: -1px; }
  .tab:hover { color: var(--fg); background: var(--hover); }
  .tab[aria-selected="true"] { color: var(--fg); background: var(--bg); border-color: var(--line); }
  .tab.gone { opacity: .45; }
  /* as the dashboard's nav shows its Inbox count */
  .badge { font-size: 11px; color: var(--red-fg); font-variant-numeric: tabular-nums; }
  #notify { flex: 0 0 auto; padding-bottom: 7px; color: var(--muted); font-size: 12px; }
  #box-links { flex: 0 0 auto; padding-bottom: 7px; font-size: 12px; }
  #box-links a { color: var(--fg-2); }
  #box-links a + a { margin-left: 10px; }
  #notify button { font: inherit; color: var(--fg-2); background: none; border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  #notify button.plain { color: inherit; border: 0; padding: 0; }
  main { flex: 1 1 auto; position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  iframe[hidden] { display: none; }
  @media (max-width: 640px) { header { flex-wrap: wrap; } nav { order: 3; flex-basis: 100%; } }
  #drop-hint { position: fixed; left: 50%; top: 52px; transform: translateX(-50%); z-index: 10; padding: 8px 14px; border-radius: 6px; background: var(--fg); color: var(--bg); font-size: 13px; pointer-events: none; }
  #empty { margin: 48px auto; max-width: 520px; padding: 0 16px; color: var(--fg-2); text-align: center; }
  /* the Overview: a card per project, read at a glance */
  #overview { position: absolute; inset: 0; overflow: auto; padding: 20px 16px 40px; }
  #overview[hidden] { display: none; }
  .ov-head { max-width: 1200px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
  .ov-head h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .ov-head .sum { color: var(--fg-2); }
  .ov-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; align-items: start; }
  .ov-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
  .ov-card.bad { border-color: color-mix(in srgb, var(--red) 45%, var(--line)); }
  .ov-card.warn { border-color: color-mix(in srgb, var(--amber) 55%, var(--line)); }
  .ov-top { display: flex; align-items: center; gap: 8px; }
  .ov-name { font: 600 15px/1.3 var(--sans); color: var(--fg); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; }
  .ov-name:hover { text-decoration: underline; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--well); color: var(--fg-2); }
  .pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.green { color: var(--green-fg); background: color-mix(in srgb, var(--green) 14%, transparent); }
  .pill.blue { color: var(--blue-fg); background: color-mix(in srgb, var(--blue) 12%, transparent); }
  .pill.amber { color: var(--amber-fg); background: color-mix(in srgb, var(--amber) 16%, transparent); }
  .pill.red { color: var(--red-fg); background: color-mix(in srgb, var(--red) 12%, transparent); }
  .ov-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .ov-stat { display: flex; flex-direction: column; min-width: 0; }
  .ov-stat .k { color: var(--muted); font-size: 11px; }
  .ov-stat .v { font: 500 14px/1.3 var(--sans); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ov-stat .v.red { color: var(--red-fg); }
  .ov-stat .v.amber { color: var(--amber-fg); }
  .ov-stat button.v { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font: inherit; font: 500 14px/1.3 var(--sans); }
  .ov-bar { height: 6px; border-radius: 3px; background: var(--well); overflow: hidden; }
  .ov-bar { display: flex; }
  .ov-bar > span { display: block; height: 100%; background: var(--green); }
  .ov-bar > span.held { background: var(--amber); }
  .ov-pills { display: flex; gap: 6px; flex: 0 0 auto; }
  .ov-goal { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; min-width: 0; }
  .ov-goal .k { color: var(--muted); font-size: 11px; flex: 0 0 auto; }
  .ov-goal .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .ov-goal .n { color: var(--fg-2); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; flex: 0 0 auto; }
  .seg button { font: 500 12px/1 var(--sans); color: var(--fg-2); background: none; border: 0; padding: 6px 10px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button:hover:not(:disabled) { background: var(--hover); color: var(--fg); }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .seg button.confirm { background: var(--red); color: #fff; }
  .seg button:disabled { cursor: default; opacity: .6; }
  .seg button[aria-pressed="true"]:disabled { opacity: 1; }
  .ov-ctl { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .ov-ctl .msg { font-size: 12px; color: var(--fg-2); }
  .ov-ctl .msg.err { color: var(--red-fg); }
  .ov-head .acts { margin-left: auto; display: flex; gap: 8px; }
  .ov-head .acts button { font: 500 12.5px/1 var(--sans); padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); cursor: pointer; }
  .ov-head .acts button:hover { background: var(--hover); }
  .ov-head .acts button.confirm { background: var(--red); border-color: var(--red); color: #fff; }
  .ov-prog { display: flex; flex-direction: column; gap: 4px; }
  .ov-prog .k { color: var(--fg-2); font-size: 12px; }
  .ov-att { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .ov-att li { position: relative; padding-left: 14px; font-size: 12.5px; color: var(--fg); }
  .ov-att li::before { content: ''; position: absolute; left: 2px; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
  .ov-att li.red::before { background: var(--red); }
  .ov-ok { font-size: 12.5px; color: var(--fg-2); }
  .ov-mosaic { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 9px); grid-auto-columns: 9px; gap: 2px; }
  .ov-mosaic i { border-radius: 2px; background: var(--well); }
  .ov-mosaic i.l1 { background: color-mix(in srgb, var(--green) 30%, var(--well)); }
  .ov-mosaic i.l2 { background: color-mix(in srgb, var(--green) 55%, var(--well)); }
  .ov-mosaic i.l3 { background: color-mix(in srgb, var(--green) 78%, var(--well)); }
  .ov-mosaic i.l4 { background: var(--green); }
  .ov-mosaic i.pad { background: none; }
  .ov-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .ov-foot .k { color: var(--muted); font-size: 11px; }
  .ov-none { color: var(--fg-2); font-size: 12.5px; }
  @media (max-width: 640px) { .ov-stat .v { font-size: 13px; } #overview { padding: 14px 12px 32px; } .ov-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <nav id="tabs" role="tablist" aria-label="devteam instances"></nav>
  <span id="notify"></span>
  <span id="box-links" hidden></span>
</header>
<main id="frames"><p id="empty">Looking for devteam dashboards on this machine…</p><section id="overview" hidden aria-label="Overview of every project"></section></main>
<div id="drop-hint" hidden></div>
<script>
// An app, not a page: iOS ignores user-scalable=no for pinches, so its gesture events are cancelled.
for (const t of ['gesturestart', 'gesturechange']) document.addEventListener(t, (e) => e.preventDefault(), { passive: false });
// The hub's page: a tab per devteam instance on the machine (its name, and a badge when its Inbox
// has something), and that instance's own dashboard in a frame under it, on the instance's own
// address. The list comes from the hub's own server (instances.json); text goes in as text.
const $ = (id) => document.getElementById(id);
const tabsEl = $('tabs');
const framesEl = $('frames');
const empty = $('empty');
const items = new Map(); // root -> { x, tab, frame, goneAt }
const hex6 = new Map();  // root -> 6 hex of its sha1, for telling two same-named instances apart
const lastInbox = new Map();
const openedWith = new Set(); // roots already there when the page opened: their first count is a baseline
let selected = null;
let firstDraw = true;
const GONE_MS = 30000;
const NOTIFY_OK = 'Notification' in window && window.isSecureContext;

async function hexOf(root) {
  if (!hex6.has(root)) {
    try { const d = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(root)); hex6.set(root, [...new Uint8Array(d)].slice(0, 3).map((b) => b.toString(16).padStart(2, '0')).join('')); } catch { hex6.set(root, String(hex6.size)); }
  }
  return hex6.get(root);
}
function keyOf(it) {
  const twins = [...items.values()].filter((o) => o.x.name === it.x.name).length > 1;
  return twins ? `${it.x.name}-${hex6.get(it.x.root)}` : String(it.x.name);
}
// Each dashboard is on its own address: on the machine, its own port on 127.0.0.1. On a cloud box
// behind a devteam gateway (cloud/gateway.mjs), box.json says where instead (its own subdomain, so
// still an origin of its own), and adds the box's terminal as the first tab.
let box = null; // { terminal, instance } when the gateway answers box.json
const urlOf = (x) => (box ? box.instance.replace('{port}', String(Number(x.port))) : `http://127.0.0.1:${Number(x.port)}/`);
const TERM = '\u0000terminal';
let term = null; // { tab, frame }
const OVERVIEW = '\u0000overview';
const ovEl = $('overview');
let ovTab = null;
const byRoot = (a, b) => String(a).localeCompare(String(b));
const wanted = () => { try { return decodeURIComponent(location.hash.slice(1)); } catch { return ''; } };

// Whatever is selected, only its own view shows: the Overview, the terminal or one dashboard.
function showOnly(key) {
  if (ovTab) { ovTab.setAttribute('aria-selected', String(key === OVERVIEW)); ovTab.tabIndex = key === OVERVIEW ? 0 : -1; }
  ovEl.hidden = key !== OVERVIEW;
  if (term) { term.tab.setAttribute('aria-selected', String(key === TERM)); term.tab.tabIndex = key === TERM ? 0 : -1; if (term.frame) term.frame.hidden = key !== TERM; }
  for (const [r, o] of items) {
    o.tab.setAttribute('aria-selected', String(r === key));
    o.tab.tabIndex = r === key ? 0 : -1;
    if (o.frame) o.frame.hidden = r !== key;
  }
}
function selectOverview() {
  selected = OVERVIEW;
  history.replaceState(null, '', '#overview');
  showOnly(OVERVIEW);
  paintOverview();
}
function selectTerminal() {
  if (!term) return;
  selected = TERM;
  history.replaceState(null, '', '#terminal');
  if (!term.frame) {
    term.frame = document.createElement('iframe');
    term.frame.title = 'Terminal';
    term.frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals allow-pointer-lock');
    term.frame.setAttribute('allow', 'clipboard-read; clipboard-write');
    term.frame.src = box.terminal;
    framesEl.append(term.frame);
  }
  showOnly(TERM);
  term.frame.focus();
}
function select(root) {
  if (root === TERM) return selectTerminal();
  if (root === OVERVIEW) return selectOverview();
  const it = items.get(root);
  if (!it) return;
  selected = root;
  history.replaceState(null, '', `#${encodeURIComponent(keyOf(it))}`);
  frameFor(it);
  showOnly(root);
}
// A project's dashboard in its frame, made once and kept; hidden until its tab is chosen. The
// Overview's fleet controls use it too: the dashboard does the owner action, on its own origin.
function frameFor(it) {
  if (!it.frame) {
    it.frame = document.createElement('iframe');
    it.frame.title = String(it.x.name);
    it.frame.hidden = selected !== it.x.root;
    // A dashboard runs scripts, fetches its own origin, posts forms and opens links in new tabs; it
    // never navigates this page, whatever answers in the block. A nested frame can't gain what this
    // one lacks, so modals, pointer lock and fullscreen are here for the dashboard's artifact viewer.
    it.frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals allow-pointer-lock');
    it.frame.setAttribute('allow', 'clipboard-write; fullscreen');
    it.loaded = new Promise((resolve) => it.frame.addEventListener('load', resolve, { once: true }));
    it.frame.src = urlOf(it.x);
    framesEl.append(it.frame);
  }
  return it.frame;
}
// ----- Run, Drain and Park from the Overview ------------------------------------------------------
// The hub can't post an owner action: it asks the project's own dashboard, in its frame, which
// posts it as a click there would (index.html, "The hub's Overview"). The answer comes back by
// message from that frame alone; nothing else is listened to.
const fleetWait = new Map(); // nonce -> { resolve, origin, win }
const fleetBusy = new Map(); // root -> what is being asked, or the last error
window.addEventListener('message', (ev) => {
  const m = ev.data;
  if (!m || typeof m !== 'object' || m.devteam !== 'hub-fleet-done' || typeof m.nonce !== 'string') return;
  const w = fleetWait.get(m.nonce);
  if (!w || ev.source !== w.win || ev.origin !== w.origin) return;
  fleetWait.delete(m.nonce);
  w.resolve({ ok: m.ok === true, error: typeof m.error === 'string' ? m.error : null });
});
async function fleetAsk(it, mode, all = false) {
  const frame = frameFor(it);
  await Promise.race([it.loaded, new Promise((r) => setTimeout(r, 15000))]);
  const origin = new URL(urlOf(it.x)).origin;
  const nonce = Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(36).padStart(2, '0')).join('').slice(0, 24);
  const answer = new Promise((resolve) => fleetWait.set(nonce, { resolve, origin, win: frame.contentWindow }));
  // asked again until it answers (a dashboard still starting its script); it does it once per nonce
  const send = () => { try { frame.contentWindow.postMessage({ devteam: 'hub-fleet', mode, nonce, all }, origin); } catch {} };
  send();
  const again = setInterval(send, 1500);
  const r = await Promise.race([answer, new Promise((r_) => setTimeout(() => r_({ ok: false, error: 'its dashboard didn\'t answer (an older kit can\'t be parked from here)' }), 20000))]);
  clearInterval(again);
  fleetWait.delete(nonce);
  return r;
}
async function setFleet(roots, mode) {
  const words = { park: 'Parking…', drain: 'Draining…', run: 'Resuming…' };
  for (const r of roots) fleetBusy.set(r, { asking: words[mode] });
  paintOverview();
  await Promise.all(roots.map(async (r) => {
    const it = items.get(r);
    const res = it ? await fleetAsk(it, mode, roots.length > 1) : { ok: false, error: 'gone' };
    if (res.ok) fleetBusy.delete(r); else fleetBusy.set(r, { error: res.error ?? 'it didn\'t work' });
  }));
  await draw();
  paintOverview();
}
// ----- the Overview: every project on one page, to see at a glance that each is moving ----------
// Each card is that project's own hello (its pulse), as text. A dashboard on an older kit sends no
// pulse; its card says so and shows what it does send.
const STATES = {
  building: { label: 'Building', tone: 'green', rank: 3 },
  moving: { label: 'Moving', tone: 'blue', rank: 3 },
  blocked: { label: 'Fully blocked', tone: 'red', rank: 0 },
  waiting: { label: 'Waiting on you', tone: 'amber', rank: 1 },
  stalled: { label: 'Stalled', tone: 'red', rank: 0 },
  idle: { label: 'Idle', tone: '', rank: 4 },
  parked: { label: 'Parked', tone: '', rank: 4 },
  gone: { label: 'Not answering', tone: 'red', rank: 0 },
  starting: { label: 'Starting', tone: '', rank: 5 },
  unknown: { label: 'Running', tone: 'blue', rank: 3 },
};
const stateOf = (it) => (it.goneAt ? 'gone' : it.x.inbox === null || it.x.inbox === undefined ? 'starting' : STATES[it.x.pulse?.state] ? it.x.pulse.state : 'unknown');
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = String(text); return e; };
const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;
function agoText(iso) {
  const t = Date.parse(iso ?? '');
  if (!(t > 0)) return 'never';
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`;
}
// kit releases compared by their numbers; "+local" is the same release with local changes
const relNums = (k) => { const m = /^v?(\d+)\.(\d+)\.(\d+)/.exec(String(k ?? '')); return m ? m.slice(1).map(Number) : null; };
const relCmp = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; };
function mosaic(days) {
  const box = el('div', 'ov-mosaic');
  const n = days.length;
  const max = Math.max(0, ...days);
  const today = new Date();
  const day0 = Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate());
  const first = new Date(day0 - (n - 1) * 86400000);
  for (let i = 0; i < first.getUTCDay(); i++) box.append(el('i', 'pad'));
  days.forEach((c, i) => {
    const q = !c || !max ? 0 : Math.min(4, Math.ceil((c / max) * 4));
    const cell = el('i', q ? `l${q}` : '');
    const d = new Date(first.getTime() + i * 86400000);
    cell.title = `${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' })}: ${plural(c, 'thing', 'things')} the fleet logged`;
    box.append(cell);
  });
  box.setAttribute('role', 'img');
  const active = days.filter(Boolean).length;
  box.setAttribute('aria-label', `Activity over the last ${Math.round(n / 7)} weeks: ${active} active days`);
  return box;
}
// A press that needs a second press to confirm (Park, Park all): remembered across redraws, 5 s.
const confirming = new Map(); // key -> until
const confirmed = (key) => { const until = confirming.get(key) ?? 0; if (until > Date.now()) { confirming.delete(key); return true; } confirming.set(key, Date.now() + 5000); setTimeout(paintOverview, 5100); paintOverview(); return false; };
const isConfirming = (key) => (confirming.get(key) ?? 0) > Date.now();
const modeOf = (it) => (['park', 'drain'].includes(it.x.fleet?.mode) ? it.x.fleet.mode : 'run');
// what the Overview can steer: a dashboard answering, on a kit that sends a pulse
const steerable = (it) => !it.goneAt && Boolean(it.x.pulse);
function fleetControl(it) {
  const root = it.x.root;
  const ctl = el('div', 'ov-ctl');
  const seg = el('div', 'seg');
  seg.setAttribute('role', 'group');
  seg.setAttribute('aria-label', `${it.x.name}: run, drain or park`);
  const busy = fleetBusy.get(root);
  const now = modeOf(it);
  const opts = [['run', 'Run', 'Workers start and continue tickets'], ['drain', 'Drain', 'Workers finish what they have; nothing new starts'], ['park', 'Park', 'Every session stops where it is']];
  for (const [mode, label, why] of opts) {
    const key = `${root}:${mode}`;
    const b = el('button', isConfirming(key) ? 'confirm' : '', isConfirming(key) ? 'Confirm park' : label);
    b.title = why;
    b.setAttribute('aria-pressed', String(now === mode));
    b.disabled = Boolean(busy?.asking) || now === mode;

}
function overviewCard(it, newest) {
  const { x } = it;
  const p = x.pulse ?? null;
  const st = stateOf(it);
  const S = STATES[st];
  const card = el('article', `ov-card${S.tone === 'red' ? ' bad' : S.tone === 'amber' ? ' warn' : ''}`);
  const top = el('div', 'ov-top');
  const name = el('button', 'ov-name', x.name);
  name.title = `Open ${x.name}'s dashboard\n${x.root}`;
  name.onclick = () => select(x.root);
  const pills = el('span', 'ov-pills');
  // partly blocked is beside what the project is doing: it is still doing it
  if (p?.blocking === 'partial' && st !== 'blocked') { const pb = el('span', 'pill amber', 'Partly blocked'); pb.title = `${p.blocked_tickets} of ${p.open_tickets} open tickets wait on your answers`; pills.append(pb); }
  pills.append(el('span', `pill ${S.tone}`, S.label));
  top.append(name, pills);
  card.append(top);

  const stats = el('div', 'ov-stats');
  const stat = (k, v, cls = '', onclick = null) => { const s_ = el('div', 'ov-stat'); s_.append(el('span', 'k', k)); const vv = el(onclick ? 'button' : 'span', `v ${cls}`.trim(), v); if (onclick) { vv.onclick = onclick; vv.title = `Open ${x.name}'s Inbox`; } s_.append(vv); stats.append(s_); };
  const kit = x.kit ?? '?';
  const nums = relNums(kit);
  const behind = newest && nums && relCmp(nums, newest) < 0;
  stat('Kit', String(kit).replace(/\+local$/, '+'), behind ? 'amber' : '');
  if (behind) stats.lastChild.title = `Behind the newest kit here (v${newest.join('.')})`;
  else if (/\+local$/.test(String(kit))) stats.lastChild.title = 'This release, with local changes to the kit';
  const inbox = typeof x.inbox === 'number' ? x.inbox : null;
  stat('Inbox', inbox ?? '–', inbox ? 'red' : '', inbox ? () => select(x.root) : null);
  stat('Working', p ? p.working : x.fleet ? x.fleet.workers : '–');
  stat('Last moved', p ? agoText(p.last_activity) : '–');
  card.append(stats);

  if (p?.goal) {
    const g = el('div', 'ov-goal');
    const more = (Number(p.goals_open) || 1) - 1;
    g.append(el('span', 'k', 'Goal'), el('span', 't', p.goal.title), el('span', 'n', `${p.goal.total ? `${p.goal.done} of ${p.goal.total}` : 'not planned yet'}${more > 0 ? ` · +${more} more` : ''}`));
    g.title = `${p.goal.title}\nthe approved goal first in priority${p.goal.mode && p.goal.mode !== 'run' ? ` (${p.goal.mode === 'park' ? 'parked' : 'draining'})` : ''}`;
    card.append(g);
  } else if (p && p.goals_open === 0 && st !== 'idle') { const g = el('div', 'ov-goal'); g.append(el('span', 'k', 'Goal'), el('span', 'n', 'none approved yet')); card.append(g); }

  if (p) {
    const total = p.open_tickets + p.done_tickets;
    const prog = el('div', 'ov-prog');
    const heldN = Math.max(0, Number(p.blocked_tickets) || 0);
    prog.append(el('span', 'k', total ? `${p.done_tickets} of ${plural(total, 'ticket')} merged${heldN ? `, ${heldN} waiting on you` : ''}` : 'No tickets planned yet'));
    const bar = el('div', 'ov-bar');

  if (notes.length) {

    foot.append(mosaic(p.activity.map((n) => Math.max(0, Number(n) || 0))), el('span', 'k', `${Math.round(p.activity.length / 7)} weeks`));
    card.append(foot);
  }

}
function paintOverview() {
  if (!ovTab || selected !== OVERVIEW) return;
  const all = [...items.values()];
  const newest = all.map((it) => relNums(it.x.kit)).filter(Boolean).sort(relCmp).pop() ?? null;
  // what needs the owner first: stalled and gone, then waiting, then the rest by name
  all.sort((a, b) => STATES[stateOf(a)].rank - STATES[stateOf(b)].rank || String(a.x.name).localeCompare(String(b.x.name)));
  const count = (s_) => all.filter((it) => stateOf(it) === s_).length;
  const owed = all.reduce((n, it) => n + (typeof it.x.inbox === 'number' ? it.x.inbox : 0), 0);
  const stuck = count('stalled') + count('gone');
  const full = count('blocked') + count('waiting');
  const partly = all.filter((it) => it.x.pulse?.blocking === 'partial' && stateOf(it) !== 'blocked').length;
  const head = el('div', 'ov-head');
  head.append(el('h1', '', !all.length ? 'No projects running' : full ? `${plural(full, 'project')} fully blocked on you` : stuck ? `${plural(stuck, 'project')} ${stuck === 1 ? 'needs' : 'need'} a look` : all.every((it) => ['parked', 'idle'].includes(stateOf(it))) ? (count('parked') ? 'Everything is parked or idle' : 'Everything is idle') : 'Everything is moving'));
  const parts = [plural(all.length, 'project'), count('building') + count('moving') ? `${count('building') + count('moving')} moving` : null, partly ? `${partly} partly blocked` : null, full && stuck ? `${stuck} stalled` : null, count('parked') ? `${count('parked')} parked` : null, owed ? `${plural(owed, 'answer')} owed` : null].filter(Boolean);
  head.append(el('span', 'sum', parts.join(' · ')));
  // every fleet at once: Park all (confirmed), and Resume all while any is held
  const can = all.filter(steerable);
  const acts = el('div', 'acts');
  const held_ = can.filter((it) => modeOf(it) !== 'run');
  const running = can.filter((it) => modeOf(it) !== 'park');
  const anyBusy = can.some((it) => fleetBusy.get(it.x.root)?.asking);
  if (held_.length) { const b = el('button', '', `Resume all (${held_.length})`); b.title = 'Undo every park and drain'; b.disabled = anyBusy; b.onclick = () => setFleet(held_.map((it) => it.x.root), 'run'); acts.append(b); }
  if (running.length) { const b = el('button', isConfirming('all:park') ? 'confirm' : '', isConfirming('all:park') ? `Confirm: park ${plural(running.length, 'project')}` : 'Park all'); b.title = 'Stop every session in every project where it is'; b.disabled = anyBusy; b.onclick = () => { if (confirmed('all:park')) setFleet(running.map((it) => it.x.root), 'park'); }; acts.append(b); }
  if (acts.childElementCount) head.append(acts);
  const grid = el('div', 'ov-grid');
  for (const it of all) grid.append(overviewCard(it, newest));
  ovEl.replaceChildren(head, ...(all.length ? [grid] : [el('p', 'ov-none', 'Start a dashboard in a devteam project and it shows up here.')]));
}
function paintTab(it) {
  const { x, tab } = it;
  tab.replaceChildren();
  const label = document.createElement('span');
  label.textContent = String(x.name);
  tab.append(label);
  if (typeof x.inbox === 'number' && x.inbox > 0) {
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = String(x.inbox);
    b.setAttribute('aria-label', `${x.inbox} in the Inbox`);
    tab.append(b);
  }
  if (x.alert) {
    const a = document.createElement('span');
    a.className = 'badge';
    a.textContent = '!';
    a.setAttribute('aria-label', String(x.alert));
    tab.append(a);
  }
  const state = x.inbox === null || x.inbox === undefined ? 'starting' : `${x.inbox} in the Inbox; ${x.fleet ? `${x.fleet.mode}, ${x.fleet.workers} session${x.fleet.workers === 1 ? '' : 's'}` : ''}`;
  tab.title = `${x.root}\nport ${Number(x.port)} · kit ${x.kit ?? '?'}\n${state}${x.alert ? `\n${x.alert}` : ''}${it.goneAt ? '\nnot answering' : ''}`;
  if (it.frame) it.frame.title = String(x.name);

}
function notifyFor(it, before) {
  const n = it.x.inbox;
  // on a box the gateway sends these, by push, whether or not this page is open
  if (box || !NOTIFY_OK || Notification.permission !== 'granted' || typeof n !== 'number' || typeof before !== 'number' || n <= before) return;
  const note = new Notification(`${it.x.name}: ${n - before} new in the Inbox`, { body: String(it.x.root), tag: `devteam-${it.x.root}` });
  note.onclick = () => { window.focus(); select(it.x.root); note.close(); };
}
const pushKey = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
const pushSave = async (sub) => { const r = await fetch('push/subscribe', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(sub) }); if (!r.ok) throw new Error(`the box answered ${r.status}`); };
// On a box this page only subscribes. iOS offers push only to an app on the Home Screen. A device
// already subscribed says so again each time, in case the box has forgotten it.
async function pushControl() {
  const el = $('notify');
  const say = (t) => { el.replaceChildren(); el.textContent = t; };
  if (!('serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && window.isSecureContext)) return say(navigator.standalone === false ? 'Add to Home Screen for notifications' : '');

    const p = Notification.permission;

    const sub = p === 'granted' ? await reg.pushManager.getSubscription() : null;
    if (sub) {
      await pushSave(sub).catch(() => {});
      const on = 'Notifying you of new Inbox items';
      const t = document.createElement('button');
      t.className = 'plain';
      t.textContent = on;
      t.title = 'Send a test notification to this device';
      t.onclick = async () => {
        t.disabled = true;
        try {
          const r = await fetch('push/test', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint }) });
          t.textContent = r.ok ? 'Test sent' : `Test failed: ${(await r.json()).error}`;
        } catch (e) { t.textContent = `Test failed: ${e.message}`; }
        setTimeout(() => { t.textContent = on; t.disabled = false; }, 4000);

        }

    };
    el.replaceChildren(b);
  };
  await paint().catch(() => say('Notifications are unavailable here'));
}
function notifyControl() {
  if (box?.push) return void pushControl();
  const el = $('notify');
  el.replaceChildren();
  if (!NOTIFY_OK) return;
  const p = Notification.permission;
  if (p === 'granted') { el.textContent = 'Notifying you of new Inbox items'; return; }
  if (p === 'denied') { el.textContent = 'Notifications are blocked for this page'; return; }
  const b = document.createElement('button');
  b.textContent = 'Notify me of new Inbox items';
  b.onclick = async () => { try { await Notification.requestPermission(); } catch {} notifyControl(); };
  el.append(b);
}

async function draw() {
  let data;
  try {
    const r = await fetch('instances.json', { cache: 'no-store' });
    // behind a gateway, a session that ended: load the page again, which signs in first
    if (r.status === 401) return location.reload();
    data = await r.json();
  } catch { return; }
  const now = Date.now();
  const seen = new Set();
  // One tab per root: if two answers claim one root (a second dashboard of one repo, or something
  // pretending), the tab keeps the port it already shows, else the lowest; the rest are ignored.
  const perRoot = new Map();
  for (const x of data.instances ?? []) {
    if (!x || typeof x.root !== 'string' || !Number.isInteger(Number(x.port))) continue;
    const had = perRoot.get(x.root);
    const keep = items.get(x.root)?.x.port;
    if (!had || Number(x.port) === Number(keep) || (Number(had.port) !== Number(keep) && Number(x.port) < Number(had.port))) perRoot.set(x.root, x);
  }
  for (const x of perRoot.values()) {
    seen.add(x.root);
    await hexOf(x.root);
    let it = items.get(x.root);
    if (!it) {
      const tab = document.createElement('button');
      tab.className = 'tab';
      tab.setAttribute('role', 'tab');
      tab.onclick = () => select(x.root);
      tabsEl.append(tab);
      it = { x, tab, frame: null, goneAt: null };
      items.set(x.root, it);
    }
    const moved = it.frame && Number(it.x.port) !== Number(x.port);
    const before = lastInbox.get(x.root);
    it.x = x;
    it.goneAt = null;
    if (moved) it.frame.src = urlOf(x);
    // an instance that turns up later with items already waiting counts them as new; one that was
    // there when the page opened (still starting) takes its first count as the baseline
    if (firstDraw) openedWith.add(x.root);
    else notifyFor(it, before ?? (typeof x.inbox === 'number' && !openedWith.has(x.root) ? 0 : undefined));
    if (typeof x.inbox === 'number') lastInbox.set(x.root, x.inbox);
  }
  for (const [root, it] of items) {
    if (seen.has(root)) continue;
    it.goneAt ??= now;
    if (now - it.goneAt > GONE_MS) {
      it.tab.remove();
      it.frame?.remove();
      items.delete(root);
      if (selected === root) selected = null;
    }
  }
  // tabs in the hub's order (by root)
  for (const root of [...items.keys()].sort(byRoot)) tabsEl.append(items.get(root).tab);
  if (ovTab) tabsEl.prepend(ovTab);
  if (term) tabsEl.prepend(term.tab);
  for (const it of items.values()) paintTab(it);
  empty.hidden = items.size > 0 || Boolean(term) || selected === OVERVIEW;
  if (!items.size) empty.textContent = 'No devteam dashboards are running on this machine.';
  if (!selected || (selected !== TERM && selected !== OVERVIEW && !items.has(selected))) {
    const want = wanted();
    const ordered = [...items.values()].sort((a, b) => byRoot(a.x.root, b.x.root));
    // the address picks a tab; with none, the Overview (the terminal when the address says so)
    const pick = ordered.find((it) => keyOf(it) === want);
    if (pick) select(pick.x.root);
    else if (term && want === 'terminal') selectTerminal();
    else selectOverview();
  }
  paintOverview();
  firstDraw = false;
}
window.addEventListener('hashchange', () => {
  const want = wanted();
  if (want === 'terminal' && term) return void (selected !== TERM && selectTerminal());
  if (want === 'overview') return void (selected !== OVERVIEW && selectOverview());
  const it = [...items.values()].find((o) => keyOf(o) === want);
  if (it && it.x.root !== selected) select(it.x.root);
});
tabsEl.addEventListener('keydown', (e) => {
  if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const roots = [...(term ? [TERM] : []), OVERVIEW, ...[...items.keys()].sort(byRoot)];
  const i = roots.indexOf(selected);
  const next = roots[(i + (e.key === 'ArrowRight' ? 1 : roots.length - 1)) % roots.length];
  if (next) { select(next); (next === TERM ? term.tab : next === OVERVIEW ? ovTab : items.get(next).tab).focus(); }
});
// Left alone, a browser opens whatever is dropped on a page in a new tab. A drop on the terminal
// goes to the terminal's own page, in its frame; this is for everywhere the hub itself is under
// the pointer (the tab bar, the margins), where nothing can take it. Refused, with a word why.
{
  const hint = $('drop-hint');
  let hide = 0;
  const say = () => {
    if (term) hint.textContent = selected === TERM ? 'Drop onto the terminal, below the tabs' : 'Drop onto the Terminal tab';
    else hint.textContent = 'This page doesn\'t take files';
    hint.hidden = false;
    clearTimeout(hide);
    hide = setTimeout(() => { hint.hidden = true; }, 1500);
  };
  window.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'none'; say(); });
  window.addEventListener('drop', (e) => { e.preventDefault(); say(); });
}
// The hub on a laptop has no box.json (404); a devteam gateway answers it.
async function findBox() {
  try {
    const r = await fetch('box.json', { cache: 'no-store' });
    const b = r.ok ? await r.json() : null;
    // https, or a local gateway on http://*.localhost (a laptop testing the box chain end to end)
    const secure = (u) => { try { const x = new URL(u.replace('{port}', '1')); return x.protocol === 'https:' || (location.protocol === 'http:' && x.protocol === 'http:' && x.hostname.endsWith('.localhost')); } catch { return false; } };
    if (b?.box !== 1 || typeof b.terminal !== 'string' || !secure(b.terminal) || typeof b.instance !== 'string' || !b.instance.includes('{port}') || !secure(b.instance)) return;
    box = { terminal: b.terminal, instance: b.instance, push: typeof b.push === 'string' ? b.push : null };
    if (typeof b.previews === 'string' && secure(b.previews)) {
      const a = document.createElement('a');
      a.href = b.previews;
      a.textContent = 'Previews';
      $('box-links').append(a);
      $('box-links').hidden = false;
    }
    // signing in and passkeys are on the gateway's own name, never in the hub's
    if (typeof b.passkeys === 'string' && secure(b.passkeys)) {
      const a = document.createElement('a');
      a.href = b.passkeys;
      a.textContent = 'Passkeys';
      $('box-links').append(a);
      $('box-links').hidden = false;
    }
    const tab = document.createElement('button');
    tab.className = 'tab';
    tab.setAttribute('role', 'tab');
    tab.textContent = 'Terminal';
    tab.title = 'The box\'s tmux sessions: supervisors, workers, logins';
    tab.onclick = selectTerminal;
    tabsEl.prepend(tab);
    term = { tab, frame: null };
  } catch {}
}
// The Overview's tab: after the box's Terminal, before the projects.
ovTab = document.createElement('button');
