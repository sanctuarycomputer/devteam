  :where(.shell) .heartbeat i.l1:not(:where(.no-shell, .no-shell *)) { background: color-mix(in srgb, var(--series-1) 35%, var(--line-2)); } :where(.shell) .heartbeat i.l2:not(:where(.no-shell, .no-shell *)) { background: color-mix(in srgb, var(--series-1) 60%, var(--line-2)); }
  :where(.shell) .heartbeat i.l3:not(:where(.no-shell, .no-shell *)) { background: color-mix(in srgb, var(--series-1) 80%, var(--line-2)); } :where(.shell) .heartbeat i.l4:not(:where(.no-shell, .no-shell *)) { background: var(--series-1); } :where(.shell) .heartbeat i.bad:not(:where(.no-shell, .no-shell *)) { background: var(--red); }

  /* the peek frame: it slides in with --ease, its header --bar-h tall, both panels padded --panel-pad; one backdrop */
  :where(.shell) .scrim:not(:where(.no-shell, .no-shell *)) { position: fixed; inset: 0; background: var(--backdrop); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 20; opacity: 0; pointer-events: none; transition: opacity var(--dur) var(--ease); }
  :where(.shell) .drawer:not(:where(.no-shell, .no-shell *)) { position: fixed; top: 0; bottom: 0; right: 0; width: min(720px, 100vw); box-sizing: border-box; background: var(--surface); border-left: 1px solid var(--line); z-index: 21; overflow-y: auto; box-shadow: -8px 0 32px rgba(0, 0, 0, .16); transform: translateX(104%); visibility: hidden; transition: transform var(--dur) var(--ease), right var(--dur) var(--ease), visibility 0s linear var(--dur); }
  :where(.shell).peek-open .scrim:not(:where(.no-shell, .no-shell *)) { opacity: 1; pointer-events: auto; }
  :where(.shell).peek-open .drawer:not(:where(.no-shell, .no-shell *)) { transform: none; visibility: visible; transition: transform var(--dur) var(--ease), right var(--dur) var(--ease), visibility 0s; }
  :where(.shell) .drawer-head:not(:where(.no-shell, .no-shell *)) { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; height: var(--bar-h); box-sizing: border-box; padding: 0 var(--panel-pad); background: var(--surface); border-bottom: 1px solid var(--line); }
  :where(.shell) .drawer-head h2:not(:where(.no-shell, .no-shell *)) { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  :where(.shell) .drawer-head .end:not(:where(.no-shell, .no-shell *)) { margin-left: auto; display: flex; gap: 6px; align-items: center; flex: none; }
  :where(.shell) .drawer-body:not(:where(.no-shell, .no-shell *)) { padding: 18px var(--panel-pad) 60px; }
  :where(.shell) .drawer-body > .card:not(:where(.no-shell, .no-shell *)) { margin-bottom: 12px; }
  /* the frame: .main holds the page bar and the page. peek-open and threads-open go on the .shell element itself;
     while Threads is open, the page and the peek stop at its edge (below 900px each panel takes the full width) */
  :where(.shell) .main:not(:where(.no-shell, .no-shell *)) { transition: margin-right var(--dur) var(--ease); }
  :where(.shell).threads-open .main:not(:where(.no-shell, .no-shell *)) { margin-right: var(--threads-w); }

  :where(.shell).threads-open .threads:not(:where(.no-shell, .no-shell *)) { transform: none; visibility: visible; transition: transform var(--dur) var(--ease), visibility 0s; }

  :where(.shell) .threads-head .tabbar:not(:where(.no-shell, .no-shell *)) { border-bottom: 0; flex: 1; align-items: flex-end; }
  :where(.shell) .threads-head .end:not(:where(.no-shell, .no-shell *)) { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; }

  /* devteam-layout end */
  :root { --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: ui-monospace, SFMono-Regular, Menlo, monospace; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { touch-action: manipulation; }
  /* an app, not a page: the hub itself never scrolls or rubber-bands; its views scroll inside */
  html, body { overscroll-behavior: none; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  header { display: flex; align-items: flex-end; gap: 12px; padding: 6px 12px 0; background: var(--surface); border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  /* The tabs scroll sideways only: no vertical scroll, no pull, and a swipe that reaches either end
     stays in the strip. The strip, not each tab, hangs 1px over the header's rule, so the chosen
     tab covers it without the strip having anything to scroll up or down. */
  nav { display: flex; gap: 2px; overflow-x: auto; overflow-y: hidden; overscroll-behavior: contain; touch-action: pan-x; flex: 1 1 auto; margin-bottom: -1px; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  .tab { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 7px; border: 1px solid transparent; border-bottom: 0; border-radius: 7px 7px 0 0; background: none; color: var(--fg-2); font: 500 13px/18px var(--sans); cursor: pointer; white-space: nowrap; flex: 0 0 auto; }
  .tab:hover { color: var(--fg); background: var(--hover); }
  .tab[aria-selected="true"] { color: var(--fg); background: var(--bg); border-color: var(--line); }
  .tab.gone { opacity: .45; }
  /* as the dashboard's nav shows its Inbox count */
  .badge { font-size: 11px; color: var(--red-fg); font-variant-numeric: tabular-nums; }
  #notify button { font: inherit; color: var(--fg-2); background: none; border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  #notify button.plain { color: inherit; border: 0; padding: 0; }
  main { flex: 1 1 auto; position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  iframe[hidden] { display: none; }
  @media (max-width: 640px) { header { flex-wrap: wrap; } nav { order: 3; flex-basis: 100%; } }
  #drop-hint { position: fixed; left: 50%; top: 52px; transform: translateX(-50%); z-index: 10; padding: 8px 14px; border-radius: 6px; background: var(--fg); color: var(--bg); font-size: 13px; pointer-events: none; }
  #empty { margin: 48px auto; max-width: 520px; padding: 0 16px; color: var(--fg-2); text-align: center; }
  /* the Overview: a card per project, read at a glance. On the shell (dashboard-shell@1, kit-94): the
     block styles the page, the grid, the cards and their heads, the pills, dots and switches; what
     follows is the hub's own. */
  #overview { position: absolute; inset: 0; overflow: auto; }
  #overview[hidden] { display: none; }
  /* the hub's Settings: a view like the Overview, its rows in the project settings' format */
  #settings-view { position: absolute; inset: 0; overflow: auto; }
  #settings-view[hidden] { display: none; }
  .set-row .t { flex: 1 1 auto; min-width: 0; }
  .set-key { font: 11px var(--mono); color: var(--muted); margin-left: 6px; }
  .set-row .r { margin-left: auto; text-align: right; max-width: 55%; min-width: 0; color: var(--fg-2); white-space: normal; overflow-wrap: anywhere; display: inline-flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 6px; }
  .set-row .r .amber { color: var(--amber-fg); }
  .set-row .r a { color: var(--fg); }
  .set-row .badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 500; line-height: 18px; padding: 0 7px; border-radius: 999px; white-space: nowrap; }
  .set-row .badge.amber { color: var(--amber-fg); background: color-mix(in srgb, var(--amber) 14%, transparent); }
  .set-desc { font-size: 12px; color: var(--fg-2); margin: -2px 0 8px; max-width: var(--measure); }
  #notify { color: var(--fg-2); }
  @media (max-width: 700px) { .set-row { flex-wrap: wrap; } .set-row .t { flex-basis: 100%; white-space: normal; } .set-row .r { flex-basis: 100%; max-width: none; justify-content: flex-start; text-align: left; margin-top: 2px; } }
  .ov-card .ov-name { font: 600 14px/1.3 var(--sans); color: var(--fg); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  .ov-card .ov-name:hover { text-decoration: underline; }

  .ov-card .menu-btn:hover { background: var(--hover); color: var(--fg); }

  .hub-goal .ov-bar { flex: 1 1 60px; min-width: 40px; }
  .ov-bar { height: 6px; border-radius: 3px; background: var(--well); overflow: hidden; display: flex; }
  .ov-bar > span { display: block; height: 100%; background: var(--green); }
  .ov-bar > span.held { background: var(--amber); }
  .ov-att { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .ov-att li { position: relative; padding-left: 14px; font-size: 12.5px; color: var(--fg); }
  .ov-att li::before { content: ''; position: absolute; left: 2px; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
  .ov-att li.red::before { background: var(--red); }
  .ov-card > .foot { padding-top: 12px; }
  .ov-mosaic { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 9px); grid-auto-columns: 9px; gap: 2px; }
  .ov-mosaic i { border-radius: 2px; background: var(--well); }
  .ov-mosaic i.l1 { background: color-mix(in srgb, var(--green) 30%, var(--well)); }
  .ov-mosaic i.l2 { background: color-mix(in srgb, var(--green) 55%, var(--well)); }
  .ov-mosaic i.l3 { background: color-mix(in srgb, var(--green) 78%, var(--well)); }
  .ov-mosaic i.l4 { background: var(--green); }

  .ov-none { color: var(--fg-2); font-size: 12.5px; }
  /* a project's tab: its state's dot, then its name, then the Inbox button's counts for it */
  .tab .dot { margin-right: 1px; }
  .tab-counts { display: inline-flex; align-items: baseline; gap: 4px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .tab-counts .dim { color: var(--muted); }
  .tab-counts .n.q { color: var(--red-fg); }
  .tab-counts .n.th.ok { color: var(--green-fg); }
  .tab-counts .n.th.you { color: var(--blue-fg); }
  .tab-counts .n.th.wait { color: var(--muted); }
  /* a card's ⋯: a small menu, placed by the page */
  .menu-pop { position: fixed; z-index: 45; min-width: 200px; max-width: calc(100vw - 16px); background: var(--raised); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.18); padding: 4px; display: flex; flex-direction: column; }

  .menu-pop .mi div { display: flex; justify-content: space-between; gap: 12px; }

  .menu-pop button:hover, .menu-pop button:focus-visible { background: var(--hover); }
  /* threads with the operator: the dashboard's thread layer (index.html, .tl-*), over the Overview */
  #ov-body { min-width: 0; }
  #tl { position: fixed; left: 0; top: 0; width: 0; height: 0; }

  #tl .btn.ghost:hover:not(:disabled) { background: var(--hover); opacity: 1; }

  #tl .meta { font-size: 12px; color: var(--muted); }

  /* fixed, beside its pin: the Overview scrolls inside its own box, and the card is placed again as it does */

<script>

function tlDock() {

function paintTab(it) {

  tab.append(el('span', `dot${S.tone ? ` ${S.tone}` : ''}${S.tone === 'red' ? ' pulse' : ''}`), el('span', '', x.name));

function notifyFor(it, before) {

const pushKey = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));

async function pushControl() {

async function draw() {
  let data;
  try {
    const r = await fetch('instances.json', { cache: 'no-store' });
    // behind a gateway, a session that ended: load the page again, which signs in first
    if (r.status === 401) return location.reload();
    data = await r.json();
    if (!data || typeof data !== 'object') throw new Error('not a list');
    hubSeen = data;
  } catch { hubSeen = null; paintOverview(); paintSettings(); return; }

  const perRoot = new Map();
  for (const x of data.instances ?? []) {
    if (!x || typeof x.root !== 'string' || !Number.isInteger(Number(x.port))) continue;
    const had = perRoot.get(x.root);

      tab.setAttribute('role', 'tab');

      items.set(x.root, it);

    const moved = it.frame && Number(it.x.port) !== Number(x.port);
    const before = lastInbox.get(x.root);
    it.x = x;
    it.goneAt = null;
    if (moved) it.frame.src = urlOf(x);

    // there when the page opened (still starting) takes its first count as the baseline

    if (seen.has(root)) continue;
    it.goneAt ??= now;
    if (now - it.goneAt > GONE_MS) {

      items.delete(root);
      if (selected === root) selected = null;
    }

    const pick = ordered.find((it) => keyOf(it) === want);

// Left alone, a browser opens whatever is dropped on a page in a new tab. A drop on the terminal

{

async function findBox() {
