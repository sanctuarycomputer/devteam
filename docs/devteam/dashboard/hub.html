<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devteam</title>
<style>
  /* devteam-ui tokens start */
  :root {
    color-scheme: light;
    --bg: #fafafa; --surface: #ffffff; --raised: #ffffff; --hover: #f2f2f2; --well: #f2f2f2;
    --fg: #171717; --fg-2: #666666; --muted: #8f8f8f; --line: #ebebeb; --line-2: #dcdcdc;
    --blue: #0070f3; --blue-fg: #0068d6; --red: #ee0000; --red-fg: #cb2a2f; --amber: #f5a623; --amber-fg: #a35200; --green: #45a557; --green-fg: #297a3a;
    --series-1: #0070f3; --grid: #ebebeb; --shadow: 0 1px 2px rgba(0,0,0,.04);
    --sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --bg: #000000; --surface: #0a0a0a; --raised: #111111; --hover: #1a1a1a; --well: #111111;
    --fg: #ededed; --fg-2: #a1a1a1; --muted: #7d7d7d; --line: #1f1f1f; --line-2: #2e2e2e;
    --blue: #52a8ff; --blue-fg: #52a8ff; --red: #ff6166; --red-fg: #ff6166; --amber: #ffb224; --amber-fg: #ffb224; --green: #3cd58c; --green-fg: #62c073;
    --series-1: #52a8ff; --grid: #1f1f1f; --shadow: none;
  } }
  /* devteam-ui tokens end */
  :root { --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: ui-monospace, SFMono-Regular, Menlo, monospace; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--fg-2); margin: 0 0 20px; }
  .card { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 0 0 10px; color: inherit; text-decoration: none; box-shadow: var(--shadow); }
  .card:hover { background: var(--hover); border-color: var(--line-2); }
  .root { font: 500 14px/1.4 var(--mono); color: var(--blue-fg); word-break: break-all; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; color: var(--fg-2); font-size: 13px; }
  .badge { border: 1px solid var(--line-2); border-radius: 999px; padding: 0 8px; font: 12px/18px var(--mono); }
  .local { color: var(--amber-fg); border-color: var(--amber); }
  .inbox { color: var(--amber-fg); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>devteam on this machine</h1>
  <p class="sub">Every running instance. Open one to go to its own dashboard.</p>
  <div id="list"><p class="sub">Looking…</p></div>
</main>
<script>
// The hub's page: it lists what its own server found (instances.json), one card per instance,
// each linking to that instance's own dashboard. Text goes in as text, never as markup.
const list = document.getElementById('list');
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
async function draw() {
  let data;
  try { data = await (await fetch('instances.json', { cache: 'no-store' })).json(); } catch { return; }
  list.replaceChildren();
  if (!data.instances.length) { list.append(el('p', 'sub', 'No devteam dashboards are running on this machine.')); return; }
  for (const x of data.instances) {
    const card = el('a', 'card');
    card.href = `http://127.0.0.1:${Number(x.port)}/`;
    const meta = el('div', 'meta');
    if (x.name) meta.append(el('span', '', String(x.name)));
    if (x.kit) meta.append(el('span', String(x.kit).endsWith('+local') ? 'badge local' : 'badge', String(x.kit)));
    if (x.inbox === null || x.inbox === undefined) meta.append(el('span', '', 'starting'));
    else {
      meta.append(el('span', x.inbox > 0 ? 'inbox' : '', `${x.inbox} in the Inbox`));
      if (x.fleet) meta.append(el('span', '', `${x.fleet.mode}, ${x.fleet.workers} session${x.fleet.workers === 1 ? '' : 's'}`));
    }
    card.append(el('div', 'root', String(x.root)), meta);
    list.append(card);
  }
}
draw();
setInterval(draw, 10000);
</script>
</body>
</html>
