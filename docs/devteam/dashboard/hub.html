  :where(.shell) .heartbeat i.l3:not(:where(.no-shell, .no-shell *)) { background: color-mix(in srgb, var(--series-1) 80%, var(--line-2)); } :where(.shell) .heartbeat i.l4:not(:where(.no-shell, .no-shell *)) { background: var(--series-1); } :where(.shell) .heartbeat i.bad:not(:where(.no-shell, .no-shell *)) { background: var(--red); }

  :where(.shell) .drawer:not(:where(.no-shell, .no-shell *)) { position: fixed; top: 0; bottom: 0; right: 0; width: min(720px, 100vw); box-sizing: border-box; background: var(--surface); border-left: 1px solid var(--line); z-index: 21; overflow-y: auto; box-shadow: -8px 0 32px rgba(0, 0, 0, .16); transform: translateX(104%); visibility: hidden; transition: transform var(--dur) var(--ease), right var(--dur) var(--ease), visibility 0s linear var(--dur); }

  :where(.shell) .drawer-head:not(:where(.no-shell, .no-shell *)) { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; height: var(--bar-h); box-sizing: border-box; padding: 0 var(--panel-pad); background: var(--surface); border-bottom: 1px solid var(--line); }

  :where(.shell) .drawer-head .end:not(:where(.no-shell, .no-shell *)) { margin-left: auto; display: flex; gap: 6px; align-items: center; flex: none; }

  /* the frame: .main holds the page bar and the page. peek-open and threads-open go on the .shell element itself;

  /* devteam-layout end */
  :root { --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: ui-monospace, SFMono-Regular, Menlo, monospace; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { touch-action: manipulation; }
  /* an app, not a page: the hub itself never scrolls or rubber-bands; its views scroll inside */
  html, body { overscroll-behavior: none; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  header { display: flex; align-items: flex-end; gap: 12px; padding: 6px 12px 0; background: var(--surface); border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  /* The tabs scroll sideways only: no vertical scroll, no pull, and a swipe that reaches either end
     stays in the strip. The strip, not each tab, hangs 1px over the header's rule, so the chosen
     tab covers it without the strip having anything to scroll up or down. */
  nav { display: flex; gap: 2px; overflow-x: auto; overflow-y: hidden; overscroll-behavior: contain; touch-action: pan-x; flex: 1 1 auto; margin-bottom: -1px; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  .tab { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 7px; border: 1px solid transparent; border-bottom: 0; border-radius: 7px 7px 0 0; background: none; color: var(--fg-2); font: 500 13px/18px var(--sans); cursor: pointer; white-space: nowrap; flex: 0 0 auto; }
  .tab:hover { color: var(--fg); background: var(--hover); }
  .tab[aria-selected="true"] { color: var(--fg); background: var(--bg); border-color: var(--line); }
  .tab.gone { opacity: .45; }
  /* as the dashboard's nav shows its Inbox count */
  .badge { font-size: 11px; color: var(--red-fg); font-variant-numeric: tabular-nums; }
  #notify button { font: inherit; color: var(--fg-2); background: none; border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  #notify button.plain { color: inherit; border: 0; padding: 0; }
  main { flex: 1 1 auto; position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  iframe[hidden] { display: none; }
  @media (max-width: 640px) { header { flex-wrap: wrap; } nav { order: 3; flex-basis: 100%; } }
  #drop-hint { position: fixed; left: 50%; top: 52px; transform: translateX(-50%); z-index: 10; padding: 8px 14px; border-radius: 6px; background: var(--fg); color: var(--bg); font-size: 13px; pointer-events: none; }
  #empty { margin: 48px auto; max-width: 520px; padding: 0 16px; color: var(--fg-2); text-align: center; }

     follows is the hub's own. */
  #overview { position: absolute; inset: 0; overflow: auto; }

/* devteam-shell-js start */
// dashboard-shell@1 (test/contracts/shell.md): the builders, binders and URL rules both

const escHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---- the tab bar: counts, a disabled state, roving tabindex, arrows that skip disabled tabs ----
function tabBar({ tabs = [], selected = null } = {}) {
  const sel = tabs.some((t) => t.id === selected && !t.disabled) ? selected : (tabs.find((t) => !t.disabled) || {}).id;

    const on = t.id === sel;

// the tab an arrow, Home or End moves to from fromId, wrapping and skipping disabled tabs (null: not a move)
function tabStep(tabs, fromId, key) {

  if (!on.length || !['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(key)) return null;
  if (key === 'Home') return on[0].id;

  const all = tabs.map((t) => t.id);

  if (i < 0) return key === 'ArrowRight' ? on[0].id : on[on.length - 1].id;
  for (let n = 0; n < all.length; n++) {

// ---- the record table: one row per record, sortable headers, every row opens its record ----

const shellText2 = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });

    const on = sort && sort.col === i;
    return `<th aria-sort="${on ? (sort.dir === -1 ? 'descending' : 'ascending') : 'none'}"><button type="button" class="sort" data-col="${i}">${escHtml(c.label)}${on ? (sort.dir === -1 ? ' ↓' : ' ↑') : ''}</button></th>`;

    ? sortRows(rows, sort).map(([i, r]) => `<tr class="click" data-row="${i}" tabindex="0">${shellCells(r).map((v) => `<td><div class="cell">${v}</div></td>`).join('')}</tr>`).join('')

  root.addEventListener('click', (e) => {

    const tr = e.target.closest('tr[data-row]');

    if (tr && root.contains(tr) && !e.target.closest('a, button, input, select, textarea, summary, label') && onOpen) onOpen(Number(tr.dataset.row));
  });

    if (e.key !== 'Enter') return;
    const tr = e.target.closest('tr[data-row]');
    if (!tr || !root.contains(tr) || e.target !== tr || !onOpen) return;
    e.preventDefault();

// ---- the properties table: [key, value HTML, tooltip?] ----
const props = (rows) => `<dl class="props">${rows.map(([k, v, tip]) => `<dt${tip ? ` title="${escHtml(tip)}" tabindex="0"` : ''}>${escHtml(k)}</dt><dd>${v ?? ''}</dd>`).join('')}</dl>`;

// ---- the step bar: Defining, Planning, Waiting on you, Built, Met; each word follows its state ----
const GOAL_STEP_WORDS = [['Defining', 'Defining', 'Defined'], ['Planning', 'Planning', 'Planned'], ['Approval', 'Waiting on you', 'Approved'], ['Built', 'Building', 'Built'], ['Met', 'Met?', 'Met']];

  if (want === 'settings') return void (selected !== SETTINGS && selectSettings());
  const it = [...items.values()].find((o) => keyOf(o) === want);
  if (it && it.x.root !== selected) select(it.x.root);
});
tabsEl.addEventListener('keydown', (e) => {
  if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const roots = [...(term ? [TERM] : []), OVERVIEW, ...[...items.keys()].sort(byRoot)];
  // Settings has no tab: its arrows move on from the Overview's
  const i = roots.indexOf(selected === SETTINGS ? OVERVIEW : selected);
  const next = roots[(i + (e.key === 'ArrowRight' ? 1 : roots.length - 1)) % roots.length];
  if (next) { select(next); (next === TERM ? term.tab : next === OVERVIEW ? ovTab : items.get(next).tab).focus(); }
});
// Left alone, a browser opens whatever is dropped on a page in a new tab. A drop on the terminal
// goes to the terminal's own page, in its frame; this is for everywhere the hub itself is under
// the pointer (the tab bar, the margins), where nothing can take it. Refused, with a word why.
{
  const hint = $('drop-hint');
  let hide = 0;
  const say = () => {
    if (term) hint.textContent = selected === TERM ? 'Drop onto the terminal, below the tabs' : 'Drop onto the Terminal tab';
    else hint.textContent = 'This page doesn\'t take files';
    hint.hidden = false;
    clearTimeout(hide);
    hide = setTimeout(() => { hint.hidden = true; }, 1500);
  };
  window.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'none'; say(); });
  window.addEventListener('drop', (e) => { e.preventDefault(); say(); });
}
// The hub on a laptop has no box.json (404); a devteam gateway answers it.
/* viewOnly start */
// View only (kit-250), from /box.json's level: <body> gets view-only, a "View only" badge ends the tab
// bar, after the tabs (the hub shows no person's name), the mock's line sits under it on every tab, and a capturing
// listener stops a press on the hub's writes with the toast (oaToast's node). The gateway refuses those
// writes anyway; this is so nobody presses and waits. Anything else is left alone.
const HUB_WRITES = ".fleet-switch [data-fleet], [data-tl-send], #tl-c-text, [data-tl-start], [data-tl-end], [data-tl-reopen], #view-notify";
let viewToastAt = 0;
function viewStop(e) {
  if (!document.body.classList.contains('view-only')) return;
  const el = e.target instanceof Element ? e.target : null;
  const write = el?.closest(HUB_WRITES);
  if (!write || write.id === 'view-notify') return;
  if (e.type === 'keydown') {
    const typing = write.matches('textarea, input');
    if (!(e.key === 'Enter' || (e.key === ' ' && !typing))) return;
  }
  e.preventDefault();
  e.stopImmediatePropagation();
  if (Date.now() - viewToastAt < 2000) return;
  viewToastAt = Date.now();
  oaToast('View only: you can look, but not change anything');
}
let viewListening = false;
// the Terminal tab at View: there, disabled, and kept first by draw() as term's is (term stays null)
let viewTermTab = null;
function viewOnly() {
  const view = box?.level === 'view';
  document.body.classList.toggle('view-only', view);
  let badge = $('view-only'), line = $('view-line');
  if (view && !badge) {
    badge = el('span', '', 'View only');
    badge.id = 'view-only';
    badge.title = 'View only: you can look at everything on this box. Buttons that would change something are greyed out.';
    line = el('div', 'view-line', 'View only: you can look at everything on this box. Buttons that would change something are greyed out.');
    line.id = 'view-line';
    // the badge ends the header's bar, after the tabs' strip (which scrolls); the line sits under the header
    tabsEl.after(badge);
    tabsEl.parentElement.after(line);
  }
  if (badge) badge.hidden = !view;
  if (line) line.hidden = !view;
  if (view && !viewListening) {
    viewListening = true;
    for (const type of ['click', 'submit', 'keydown']) window.addEventListener(type, viewStop, true);
  }
}
/* viewOnly end */
async function findBox() {
  try {
    const r = await fetch('box.json', { cache: 'no-store' });
    const b = r.ok ? await r.json() : null;
    // https, or a local gateway on http://*.localhost (a laptop testing the box chain end to end)
    const secure = (u) => { try { const x = new URL(u.replace('{port}', '1').replace('{project}', 'a')); return x.protocol === 'https:' || (location.protocol === 'http:' && x.protocol === 'http:' && x.hostname.endsWith('.localhost')); } catch { return false; } };
    // box: 1 names each dashboard by its port ({port}), box: 2 by its project's name ({project})
    const tpl = (k, hole) => typeof b?.[k] === 'string' && b[k].includes(hole) && secure(b[k]);
    const v = b?.box === 1 && tpl('instance', '{port}') ? 1 : b?.box === 2 && tpl('project', '{project}') ? 2 : 0;
    if (!v || typeof b.terminal !== 'string' || !secure(b.terminal)) return;
    box = { v, terminal: b.terminal, instance: v === 1 ? b.instance : null, project: v === 2 ? b.project : null, push: typeof b.push === 'string' ? b.push : null, image: b.image, previews: null, passkeys: null, role: null, people: null };
    // the box's links, shown in Settings (Serving, Signing in)
    if (typeof b.previews === 'string' && secure(b.previews)) box.previews = b.previews;
    // signing in and passkeys are on the gateway's own name, never in the hub's
    if (typeof b.passkeys === 'string' && secure(b.passkeys)) box.passkeys = b.passkeys;
    // who is signed in, and where People are: the page may fetch only its own origin (connect-src)
    if (OA_ROLES.includes(b.role)) box.role = b.role;
    // the signed-in person's level (kit-250): View has no terminal and changes nothing
    box.level = b.level === 'full' || b.level === 'view' ? b.level : null;
    if (box.role && box.role !== 'member' && typeof b.people === 'string') { try { const u = new URL(b.people, location.href); if (u.origin === location.origin) box.people = u.href; } catch {} }
    const tab = document.createElement('button');
    tab.className = 'tab';
    tab.setAttribute('role', 'tab');
    tab.textContent = 'Terminal';
    tabsEl.prepend(tab);
    if (box.level === 'view') {
      // there but disabled: term stays null, so #terminal and a remembered Terminal tab fall back as a laptop's do
      tab.setAttribute('aria-disabled', 'true');
      tab.setAttribute('aria-selected', 'false');
      tab.tabIndex = -1;
      viewTermTab = tab;
      tab.title = 'View only: no terminal';
      tab.onclick = () => oaToast('View only: no terminal');
    } else {
      tab.title = 'The box\'s tmux sessions: supervisors, workers, logins';
      tab.onclick = selectTerminal;
      term = { tab, frame: null };
    }
    viewOnly();
  } catch {}
}
// The Overview's tab: after the box's Terminal, before the projects.
ovTab = document.createElement('button');
ovTab.className = 'tab';
ovTab.setAttribute('role', 'tab');
ovTab.textContent = 'Overview';
ovTab.title = 'Every project at a glance: is it moving, what it needs from you';
ovTab.onclick = selectOverview;
tabsEl.append(ovTab);
findBox().then(() => { notifyControl(); return draw(); });
setInterval(draw, 10000);
</script>
