<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas</title>
<!-- The canvas editor (kit-661): a canvas-doc@1 document read from GET /api/canvas/doc and drawn as
     plain DOM. Its own HTML, CSS and one script; nothing from another origin. The document is data:
     text goes in with textContent, every style value through a checker and one CSSOM property. -->
<style>
  /* the dashboard's tokens (devteam-ui tokens), with the system font stacks: this page loads no font */
  :root {
    color-scheme: light;
    --bg: #fafafa; --surface: #ffffff; --raised: #ffffff; --hover: #f2f2f2; --well: #f2f2f2;
    --fg: #171717; --fg-2: #666666; --muted: #8f8f8f; --line: #ebebeb; --line-2: #dcdcdc;
    --blue: #0070f3; --blue-fg: #0068d6; --red: #ee0000; --red-fg: #cb2a2f; --amber: #f5a623; --amber-fg: #a35200; --green: #45a557; --green-fg: #297a3a;
    --shadow: 0 1px 2px rgba(0,0,0,.04);
    --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --serif: ui-serif, Georgia, Cambria, 'Times New Roman', serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    /* this page's own */
    --stage: #ececec; --amber-bg: #fff4e5; --sel: #0070f3;
    --bar-h: 49px; --left-w: 240px; --right-w: 300px;
    /* running text: six of twelve columns at 1440 (the dashboard's devteam-layout measure) */
    --measure: calc((1200px - 2 * 32px - 11 * 16px) / 2 + 5 * 16px);
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --bg: #000000; --surface: #0a0a0a; --raised: #111111; --hover: #1a1a1a; --well: #111111;
    --fg: #ededed; --fg-2: #a1a1a1; --muted: #7d7d7d; --line: #1f1f1f; --line-2: #2e2e2e;
    --blue: #52a8ff; --blue-fg: #52a8ff; --red: #ff6166; --red-fg: #ff6166; --amber: #ffb224; --amber-fg: #ffb224; --green: #3cd58c; --green-fg: #62c073;
    --shadow: none;
    --stage: #161616; --amber-bg: #2a1d05; --sel: #52a8ff;
  } }

  * { box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); }
  body { margin: 0; color: var(--fg); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  [hidden] { display: none !important; }
  button { font: inherit; font-size: 12px; font-weight: 500; height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); cursor: pointer; }
  button:hover { background: var(--hover); }
  select { font: inherit; font-size: 12px; color: var(--fg); background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px; height: 28px; padding: 0 8px; min-width: 0; }

  /* the bar */
  .bar { height: var(--bar-h); display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--surface); position: relative; z-index: 5; }
  .bar .back { color: var(--fg-2); text-decoration: none; white-space: nowrap; }
  .bar .back:hover { color: var(--fg); }
  .bar h1 { font-size: 14px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .bar .where { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .bar .grow { flex: 1; }
  .chip { font-size: 11px; height: 24px; padding: 0 8px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg-2); display: inline-flex; align-items: center; white-space: nowrap; overflow: hidden; min-width: 0; }
  /* the chip's two parts: the repo name may be cut with an ellipsis (a block, so one is drawn), the
     visibility never is */
  .chip .repo-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
  .chip .repo-vis { display: block; white-space: nowrap; flex: none; margin-left: .3em; }
  .chip.public { color: var(--amber-fg); border-color: var(--amber-fg); background: var(--amber-bg); }

  /* the three columns */
  .work { position: absolute; top: var(--bar-h); left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: var(--left-w) minmax(0, 1fr) var(--right-w); }
  .panel { background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; min-height: 0; }
  .panel.right { border-right: 0; border-left: 1px solid var(--line); }
  .ptitle { font: 500 11px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 14px 12px 8px; margin: 0; }
  .pages a { display: block; padding: 5px 12px; color: var(--fg-2); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pages a:hover { background: var(--hover); }
  .pages a[aria-current="page"] { color: var(--fg); background: var(--well); }
  /* the Pages panel's controls (kit-669), made by the script: + beside the title, and on the shown
     page's row Rename, Move up, Move down and Delete, buttons as the panel's at 11-12 px */
  .phead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-right: 8px; }
  #pageAdd { flex: none; height: 20px; min-width: 20px; padding: 0 5px; font-size: 12px; line-height: 1; color: var(--fg-2); }
  .prow { display: flex; align-items: center; gap: 2px; }
  .prow a { flex: 1 1 auto; min-width: 0; }
  .prow button { flex: none; height: 20px; min-width: 20px; padding: 0 4px; font-size: 11px; line-height: 1; color: var(--fg-2); }
  .prow button:last-child { margin-right: 8px; }
  .prow button:disabled, #pageAdd:disabled { opacity: .5; cursor: not-allowed; }
  .prow input { flex: 1 1 auto; min-width: 0; margin: 2px 8px; font: inherit; font-size: 12px; color: var(--fg); background: var(--surface); border: 1px solid var(--sel); border-radius: 6px; height: 24px; padding: 0 4px; }
  .layers { padding-bottom: 20px; }
  .layer { display: flex; align-items: center; gap: 6px; height: 26px; padding-right: 8px; color: var(--fg-2); cursor: pointer; white-space: nowrap; font-size: 12px; }
  .layer:hover { background: var(--hover); }
  .layer[aria-selected="true"] { background: color-mix(in srgb, var(--sel) 14%, transparent); color: var(--fg); }
  /* the focused row (kit-662: the tree by keyboard) is ringed, not only tinted */
  .layer:focus { outline: none; }
  .layer:focus-visible { outline: 2px solid var(--sel); outline-offset: -2px; }
  .layer .ic { width: 14px; text-align: center; color: var(--muted); font-family: var(--mono); font-size: 10px; flex: none; }
  .layer .nm { overflow: hidden; text-overflow: ellipsis; }
  .props { padding: 0 12px 24px; }
  .props .row { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; align-items: baseline; margin: 8px 0; font-size: 12px; }
  .props .row .k { color: var(--fg-2); }
  .props .row .v { overflow-wrap: anywhere; max-width: var(--measure); }
  .note { font-size: 12px; color: var(--fg-2); margin: 8px 0; max-width: var(--measure); }
  /* the editable fields (kit-662), under the read-only rows */
  .props .fields { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 4px; }
  .props .fields .row { align-items: center; }
  .props input, .props textarea { font: inherit; font-size: 12px; color: var(--fg); background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px; height: 28px; padding: 0 8px; min-width: 0; width: 100%; }
  .props .foot { margin-top: 16px; }
  .props .ctl { display: flex; gap: 4px; align-items: center; min-width: 0; }
  .props .ctl > select, .props .ctl > input:not([type="checkbox"]) { flex: 1 1 0; width: auto; }
  .props select { width: 100%; }
  .props input[type="checkbox"] { width: 16px; height: 16px; margin: 0; padding: 0; }
  .props textarea { height: auto; min-height: 64px; padding: 4px 8px; resize: vertical; line-height: 1.4; }
  .props .group { display: flex; flex-wrap: wrap; gap: 2px; flex: 1 1 auto; min-width: 0; }
  .props .group button { flex: 1 1 auto; padding: 0 5px; }
  .props .group button[aria-pressed="true"] { background: var(--well); border-color: var(--fg-2); color: var(--fg); }
  .props .pad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; flex: 1 1 auto; min-width: 0; }
  .props .pad input { padding: 0 4px; }
  .props .swatch { flex: none; width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--line-2); }
  .props .swatch.none { border-style: dashed; }
  .props .fnote { margin: -4px 0 8px 80px; color: var(--red-fg); }
  .props :disabled { opacity: .5; cursor: not-allowed; }
  .props .acts { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
  .props .vname { flex: 1 1 auto; overflow-wrap: anywhere; }

  /* the stage: the page surface is the one element zoom and pan move */
  /* clip, not hidden: the stage is no scroll container, so nothing (scrollIntoView included) scrolls it */
  .stage { position: relative; background: var(--stage); overflow: clip; min-width: 0; touch-action: none; user-select: none; }
  .stage.panning, .stage.space { cursor: grab; }
  .stage.panning { cursor: grabbing; }
  #surface { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .zoom { position: absolute; right: 12px; top: 12px; display: flex; gap: 4px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; z-index: 3; }
  .zoom .pct { font-size: 12px; width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
  .stage-top { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; z-index: 3; max-width: calc(100% - 24px); }
  #pageSel, #narrowNote { display: none; }
  #capNote { font-size: 12px; color: var(--fg-2); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; margin: 0; max-width: var(--measure); }
  #narrowNote { font-size: 12px; color: var(--fg-2); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; margin: 0; max-width: var(--measure); }
  #msg { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); margin: 0; padding: 0 16px; width: max-content; max-width: min(var(--measure), 100%); color: var(--fg-2); text-align: center; z-index: 2; pointer-events: none; }
  /* the banner and the message line (kit-662): at the stage's top, centred, clear of its corners; they
     take no pointer events, so the stage under them can still be used */
  .say { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; width: max-content; max-width: calc(100% - 24px); z-index: 4; pointer-events: none; }
  .say p { margin: 0; max-width: var(--measure); font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
  #banner { background: var(--amber-bg); color: var(--amber-fg); border-color: var(--amber-fg); }
  /* the tools bar (kit-662): one row at the stage's foot, centred, its right edge at least 160 px left
     of the stage's (kit-661 checks the stage's own bottom-right corner, 60 and 120 px in). It never
     wraps, and stays centred while key buttons of a usable size fit so: by the stage's width it shows
     names and keys (about 470 px, centred, from 840 px), the keys alone (about 190 px, centred, from
     520 px), then below that the keys in 12 px buttons at the stage's left (90 px); under a 260 px
     stage, where not even that keeps 160 px clear, it is hidden and the tool keys still work. */
  .stage { container: stage / inline-size; }
  .tools { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: nowrap; gap: 2px; width: max-content; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; box-shadow: var(--shadow); z-index: 3; }
  .tools button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; border-color: transparent; background: transparent; }
  @container stage (width < 840px) {
    .tools .tn { display: none; }
  }
  @container stage (width < 520px) {
    .tools { left: 4px; transform: none; gap: 0; padding: 2px; }
    .tools button { width: 12px; padding: 0; overflow: hidden; }
  }
  @container stage (width < 260px) {
    .tools { display: none; }
  }
  .tools button:hover { background: var(--hover); }
  .tools button[aria-pressed="true"] { background: var(--well); border-color: var(--fg-2); }
  .tools button:disabled { opacity: .5; cursor: not-allowed; }
  .tools kbd { font: 10px/1 var(--mono); color: var(--muted); }
  .stage.drawing:not(.space):not(.panning) { cursor: crosshair; }
  /* a tool's preview: stage chrome, never a drawn node, taking no pointer events */
  .draft { position: absolute; border: 1px dashed var(--sel); pointer-events: none; z-index: 2; }
  .draft.round { border-radius: 50%; }
  .pen { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 2; }
  .pen polyline { fill: none; stroke: var(--sel); stroke-width: 1.5px; stroke-dasharray: 4 3; }
  /* the one selected node's resize handles (kit-669 §3): stage chrome on its box's corners and edges */
  .handle { position: absolute; box-sizing: border-box; width: 8px; height: 8px; margin: -4px 0 0 -4px; background: var(--surface); border: 1px solid var(--sel); z-index: 2; touch-action: none; }
  .handle[data-handle="nw"], .handle[data-handle="se"] { cursor: nwse-resize; }
  .handle[data-handle="ne"], .handle[data-handle="sw"] { cursor: nesw-resize; }
  .handle[data-handle="n"], .handle[data-handle="s"] { cursor: ns-resize; }
  .handle[data-handle="e"], .handle[data-handle="w"] { cursor: ew-resize; }
  body[data-state="error"] #surface, body[data-state="error"] .zoom { display: none; }

  /* under 760 px, watch and comment: no panels, the stage the full width under the bar, the bar's
     title and chip cut with an ellipsis (never wrapped), the page select and the note on the stage,
     at its bottom left, clear of the zoom controls at its top right */
  @media (max-width: 760px) {
    .work { grid-template-columns: minmax(0, 1fr); }
    .panel { display: none; }
    .bar { gap: 8px; }
    .bar > * { min-width: 0; }
    .bar .where { display: none; }
    .bar h1, .bar .back { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar .back { flex: none; }
    /* the title gives way first (shrink weighs by size, so a factor this large cuts it before the chip),
       down to a floor of its whole text or 5em, whichever is less; then the chip's repo name gives way.
       (min() takes no intrinsic size, so calc-size; without it, a 5em floor.) */
    .bar h1 { flex: 0 1000 auto; min-width: 5em; min-width: calc-size(max-content, min(size, 5em)); }
    .bar .chip { flex: 0 1 auto; }
    .stage-top { top: auto; bottom: 12px; }
    #pageSel { display: block; max-width: 100%; }
    .say { top: 52px; }
    #narrowNote { display: block; }
    #tools { display: none; }
  }

  /* the design being drawn keeps its own colours, light or dark */
  .dnode { margin: 0; }
  img.dnode, svg.dnode { display: block; }
  .dnode.sel { outline: 2px solid var(--sel); }
  /* a node that can't be drawn: a dashed box with its name */
  .placeholder { border: 1px dashed #8f8f8f; color: #666666; font: 11px/1.4 var(--sans); padding: 2px 6px; min-width: 24px; min-height: 18px; white-space: nowrap; background: transparent; }
  /* a component's label: stage chrome above its box, placed by CSS anchor positioning */
  .clabel { position: absolute; left: anchor(left); bottom: anchor(top); margin-bottom: 4px; font: 500 11px/1 var(--sans); color: var(--sel); white-space: nowrap; pointer-events: none; }
  /* without anchor positioning a label would sit at the surface's corner, over the design: none then */
  @supports not (anchor-name: --a) { .clabel { display: none; } }
</style>
</head>
<body data-state="loading">
<header class="bar">
  <a class="back" href="/#library">&larr; Library</a>
  <h1 id="title"></h1>
  <span class="where">canvas</span>
  <span class="grow"></span>
  <span class="chip" id="repoChip" hidden></span>
</header>
<main class="work">
  <aside class="panel left">
    <h2 class="ptitle">Pages</h2>
    <nav class="pages" id="pages" aria-label="Pages"></nav>
    <h2 class="ptitle">Layers</h2>
    <div class="layers" id="layers" role="tree" aria-label="Layers"></div>
  </aside>
  <section class="stage" id="stage" aria-label="Canvas">
    <div id="surface"></div>
    <div class="stage-top">
      <select id="pageSel" aria-label="Page"></select>
      <p id="narrowNote">Watching: editing needs a wider screen.</p>
      <p id="capNote" role="status" hidden>Some components weren't drawn: this page holds too many.</p>
    </div>
    <div class="zoom">
      <button id="zoomOut" type="button" aria-label="Zoom out">&minus;</button>
      <span class="pct" id="zoomPct">100%</span>
      <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
      <button id="zoomFit" type="button">Fit</button>
    </div>
    <p id="msg" role="status" hidden></p>
    <div class="say">
      <p id="banner" role="status" hidden></p>
      <p id="toast" role="status" hidden></p>
    </div>
    <div class="tools" id="tools" role="toolbar" aria-label="Tools" hidden>
      <button type="button" data-tool="move" aria-pressed="true" aria-label="Move" title="Move (V)"><span class="tn">Move</span> <kbd>V</kbd></button>
      <button type="button" data-tool="frame" aria-pressed="false" aria-label="Frame" title="Frame (F)"><span class="tn">Frame</span> <kbd>F</kbd></button>
      <button type="button" data-tool="text" aria-pressed="false" aria-label="Text" title="Text (T)"><span class="tn">Text</span> <kbd>T</kbd></button>
      <button type="button" data-tool="rect" aria-pressed="false" aria-label="Rectangle" title="Rectangle (R)"><span class="tn">Rectangle</span> <kbd>R</kbd></button>
      <button type="button" data-tool="ellipse" aria-pressed="false" aria-label="Ellipse" title="Ellipse (O)"><span class="tn">Ellipse</span> <kbd>O</kbd></button>
      <button type="button" data-tool="vector" aria-pressed="false" aria-label="Vector" title="Vector (P)"><span class="tn">Vector</span> <kbd>P</kbd></button>
      <button type="button" data-tool="image" aria-pressed="false" aria-label="Image" title="Image (I)"><span class="tn">Image</span> <kbd>I</kbd></button>
    </div>
    <input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp,image/gif" aria-label="Image file" hidden>
  </section>
  <aside class="panel right">
    <h2 class="ptitle">Properties</h2>
    <div class="props" id="props"><p class="note">Select a layer to see what it is.</p></div>
  </aside>
</main>
<script>
'use strict';
(() => {
  const SLUG_RE = /^[a-z][a-z0-9]*(-[a-z0-9]+)*$/;
  const TEXT = {
    notAddress: "This isn't a canvas address.",
    notOpen: "This canvas isn't open for editing.",
    notLoaded: "This canvas couldn't be loaded.",
    empty: 'This page is empty.',
    noSelection: 'Select a layer to see what it is.',
  };
  const $ = (id) => document.getElementById(id);
  const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
  const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

  // What the page holds: the slug, the response's session and rev, the document drawn, and the page
  // shown. Editing (kit-662) keeps two copies: `base`, the document as the server has applied it, and
  // `pending`, the page's own edits not yet acked ({ ops, seq, kind, entry }, seq null until sent), in
  // order; `doc` is base with pending applied over it, what is drawn. `kept` (kit-668) holds the page's
  // own edits acked but not yet saved, each with the `rev` of its ack and the socket's `session` then:
  // a new session resends them. `saved` is the last `saved` rev and `savedOn` the socket's session it
  // came on; `locked` is null, 'view' (refused as a View person) or 'closed' (landed or removed): no
  // more edits either way.
  const state = {
    // sels (kit-669 §2): the selected ids of the shown page, in layer order; sel: the one id when
    // exactly one is selected, else null (every single-node tool reads it)
    slug: null, session: null, rev: null, doc: null, repo: null, pageId: null, sel: null, sels: [],
    base: null, pending: [], kept: [], saved: null, savedOn: null, locked: null, paused: false, closedText: null,
    // Change in (spec §3): { comp, name }, the variant a component's nodes are edited in, or null (Base);
    // placing: the component Place instance adds an instance of at the next click, or null
    variantMode: null, placing: null,
  };
  // The shown page's drawn nodes and Layers rows, by node id (Maps: an id is the document's string).
  let drawn = new Map();
  let layerRows = new Map();

  const setState = (s) => { document.body.dataset.state = s; };
  function showMsg(text) {
    const m = $('msg');
    m.textContent = text;
    m.hidden = false;
  }
  function hideMsg() {
    const m = $('msg');
    m.textContent = '';
    m.hidden = true;
  }
  function fail(text) {
    showMsg(text);
    setState('error');
  }

  // The doc-response frame the page needs to walk the document; the server judges the rest.
  function frameOk(b) {
    return isObj(b) && isObj(b.doc) && Array.isArray(b.doc.pages) && b.doc.pages.length > 0
      && b.doc.pages.every(isObj) && isObj(b.doc.nodes) && isObj(b.repo);
  }

  // The bar's chip: where every edit goes, and whether that place may be public (null counts as public).
  function showRepo(repo) {
    const name = typeof repo.name === 'string' && repo.name ? repo.name : null;
    const where = name === null ? "this project's repo" : name;
    const pub = name === null ? null : repo.public;
    const how = pub === true ? 'public' : pub === false ? 'private' : 'may be public';
    const chip = $('repoChip');
    const nameEl = document.createElement('span');
    nameEl.className = 'repo-name';
    nameEl.textContent = `Saved to ${where}`;
    const visEl = document.createElement('span');
    visEl.className = 'repo-vis';
    visEl.textContent = `· ${how}`;
    // the space between is text, so the chip's whole text reads `Saved to <where> · <how>`
    chip.replaceChildren(nameEl, ' ', visEl);
    chip.title = `Every edit is committed and pushed to ${where}.`;
    chip.classList.toggle('public', pub !== false);
    chip.hidden = false;
  }

  const pages = () => state.doc.pages;
  const pageById = (id) => pages().find((pg) => pg.id === id) || null;
  const pageName = (pg) => (typeof pg.name === 'string' ? pg.name : '');

  // The pages' ids and names, in order, as one string: the Pages list and the page select are rebuilt
  // only when it changes, so another person's edit leaves a focused link focused and an open picker's

      return (p) => vals[p];
    }
    return (p) => getPath(n, p);
  }

  // One node as DOM, or null when it is missing or already drawn on this page (in this instance).
  // inst: null, or { id, values, key, depth } for the instance whose component's tree this is in.
  function drawNode(id, parentMode, inst) {
    const key = `${inst ? inst.key : ''}/${id}`;
    if (drawing.seen.has(key)) return null;
    const n = nodeOf(id);
    if (!n) return null;
    drawing.seen.add(key);
    const g = getter(id, n, inst);
    const labels = drawing.labels.length;
    const after = drawing.after.length;
    const marked = drawing.marked.length;
    try {
      return drawOne(id, n, g, parentMode, inst);
    } catch {
      // nothing of the discarded element is kept: no label, no later measuring, and no drawn-node
      // entry (its nodes' Layers rows then select nothing drawn, rather than a detached element); an
      // id is drawn at most once per page, so each entry removed was added by this attempt
      drawing.labels.length = labels;
      drawing.after.length = after;
      for (const k of drawing.marked.splice(marked)) drawing.byId.delete(k);
      return placeholder(id, g, parentMode, inst);
    }
  }

  function drawChildren(el, kids, mode, inst) {
    for (const c of kids) {
      const child = drawNode(c, mode, inst);
      if (child) el.append(child);
    }
  }

  function drawOne(id, n, g, parentMode, inst) {
    let el;
    switch (n.type) {
      case 'frame':
      case 'component': {
        el = document.createElement('div');
        mark(el, id, inst);
        common(el, g, parentMode);
        const mode = layout(el, g);
        const hidden = g('visible') === false;
        if (hidden) drawing.hidden++;
        try { drawChildren(el, kidsOf(n), mode, inst); } finally { if (hidden) drawing.hidden--; }
        // a label only for a component that is shown: not hidden itself, nor inside a hidden frame
        if (n.type === 'component' && !inst && !hidden && drawing.hidden === 0) {
          const anchor = `--canvas-component-${++drawing.anchors}`;
          el.style.anchorName = anchor;
          const lab = document.createElement('div');
          lab.className = 'clabel';
          const name = g('name');
          lab.textContent = typeof name === 'string' && name ? name : 'Component';
          lab.style.positionAnchor = anchor;
          drawing.labels.push(lab);
        }
        break;
      }
      case 'text': {
        el = document.createElement('div');
        mark(el, id, inst);
        common(el, g, parentMode);
        const t = g('text');
        el.textContent = typeof t === 'string' ? t : '';
        el.style.whiteSpace = 'pre-wrap';
        const f = font(g('font'));
        el.style.fontFamily = f.family;
        el.style.fontSize = `${f.size}px`;
        el.style.fontWeight = String(f.weight);
        el.style.lineHeight = String(f.lineHeight);
        el.style.color = color(g('color')) ?? '#000000';
        el.style.textAlign = pick(TEXT_ALIGN, g('align'), 'left');
        break;
      }
      case 'rect':
      case 'ellipse':
        el = document.createElement('div');
        mark(el, id, inst);
        common(el, g, parentMode);
        paint(el, g);
        if (n.type === 'ellipse') el.style.borderRadius = '50%'; else radius(el, g);
        break;
      case 'vector': {
        el = document.createElementNS(SVG_NS, 'svg');
        mark(el, id, inst);
        el.style.overflow = 'visible';
        const hug = common(el, g, parentMode, { hugLater: true });
        let path = null;
        const d = g('path');
        if (pathOk(d)) {
          path = document.createElementNS(SVG_NS, 'path');
          path.setAttribute('d', d);
          path.style.fill = color(g('fill')) ?? 'none';
          path.style.stroke = color(g('stroke')) ?? 'none';
          path.style.strokeWidth = `${num(g('strokeWidth'), 0, 100000) ?? 0}px`;
          el.append(path);
        }
        if (hug.length && path) {
          const svg = el;
          drawing.after.push(() => {
            const b = path.getBBox();
            if (hug.includes('w')) svg.style.width = `${Math.max(0, b.x + b.width)}px`;
            if (hug.includes('h')) svg.style.height = `${Math.max(0, b.y + b.height)}px`;
          });
        }
        break;
      }
      case 'image': {
        const file = imageFile(g('src'));
        if (file === null) {
          // anything but an images/ file: an empty box of the node's size
          el = document.createElement('div');
          mark(el, id, inst);
          common(el, g, parentMode);
          break;
        }
        el = document.createElement('img');
        mark(el, id, inst);
        common(el, g, parentMode);
        const name = g('name');
        el.alt = typeof name === 'string' ? name : '';
        el.draggable = false;
        el.style.objectFit = pick(FIT, g('fit'), 'cover');
        radius(el, g);
        el.src = `/api/canvas/image/${encodeURIComponent(state.slug)}/${file}`;
        break;
      }
      case 'instance':
        return drawInstance(id, n, g, parentMode, inst);
      default:
        return placeholder(id, g, parentMode, inst);
    }
    hide(el, g);
    return el;
  }

  // An instance: its component's tree, resolved. Its root takes the instance's own name, visible,
  // opacity, x and y (stored, else their defaults), its own size.w and size.h when stored (else the
  // component root's), and everything else from the component root. Nested to a depth of 20; deeper,
  // or a component that doesn't resolve, is a placeholder; so is every instance once the page's
  // element budget is spent.
  function drawInstance(id, n, g, parentMode, inst) {
    const depth = inst ? inst.depth + 1 : 1;
    const compId = g('component');
    const comp = nodeOf(compId);
    if (depth > MAX_DEPTH || !comp || comp.type !== 'component') return placeholder(id, g, parentMode, inst);
    if (drawing.capped || drawing.used + compElements(compId, comp) > MAX_ELEMENTS) {
      drawing.capped = true;
      return placeholder(id, g, parentMode, inst);
    }
    drawing.used += compElements(compId, comp);
    const rootG = (p) => {
      if (INSTANCE_OWN.has(p)) return g(p);
      if (INSTANCE_SIZE.has(p)) {
        const v = g(p);
        if (v !== undefined) return v;
      }
      return getPath(comp, p);
    };
    const inner = { id, values: resolveInstance(n, comp), key: `${inst ? inst.key : ''}/${id}`, depth };
    const el = document.createElement('div');
    mark(el, id, inst);
    common(el, rootG, parentMode);
    const mode = layout(el, rootG);
    drawChildren(el, kidsOf(comp), mode, inner);
    hide(el, rootG);
    return el;
  }

  // The page's top-level nodes on #surface, each placed at its x, y.
  function drawPage(pageId) {
    const pg = pageById(pageId) || pages()[0];
    // the page's own tree, instances as one element each, counts against the budget first
    drawing = { seen: new Set(), after: [], labels: [], anchors: 0, byId: new Map(), marked: [], hidden: 0, sizes: new Map(), used: 0, capped: false };
    drawing.used = treeElements(kidsOf(pg));
    const els = [];
    for (const id of kidsOf(pg)) {
      const el = drawNode(id, 'page', null);
      if (el) els.push(el);
    }
    $('surface').replaceChildren(...els, ...drawing.labels);
    for (const f of drawing.after) { try { f(); } catch { /* a size it can't measure stays 0 */ } }
    drawn = drawing.byId;
    $('capNote').hidden = !drawing.capped;
    drawing = null;
  }

  // ---- layers, selection and the properties panel ----

  // A row's type mark: the page's own table (a frame's by its layout mode).
  const MARK = { component: '◆', instance: '◇', text: 'T', rect: '▭', ellipse: '○', vector: '✎', image: '▣' };
  const FRAME_MARK = { row: '→', column: '↓', grid: '▦', none: '#' };
  const typeOf = (n) => (typeof n.type === 'string' ? n.type : '');
  function markOf(n) {
    if (n.type === 'frame') return FRAME_MARK[pick(MODE, getPath(n, 'layout.mode'), 'none')];
    return own(MARK, typeOf(n)) ? MARK[n.type] : '?';
  }
  // A node's name, or its type when the name is empty.
  const labelOf = (n) => (typeof n.name === 'string' && n.name ? n.name : typeOf(n) || 'node');

  // The Layers tree: the shown page's nodes nested by children order, each listed once; an instance's
  // inner nodes are the component's and aren't listed. Indent by depth, a number the page works out.
  function renderLayers(pageId) {
    const pg = pageById(pageId) || pages()[0];
    const seen = new Set();
    const out = [];
    layerRows = new Map();
    const stack = kidsOf(pg).reverse().map((id) => [id, 0]);
    while (stack.length) {
      const [id, depth] = stack.pop();
      const n = nodeOf(id);
      if (!n || seen.has(id)) continue;
      seen.add(id);
      const row = document.createElement('div');
      row.className = 'layer';
      row.dataset.node = id;
      row.setAttribute('role', 'treeitem');
      row.setAttribute('aria-level', String(depth + 1));
      row.setAttribute('aria-selected', 'false');
      row.tabIndex = -1;
      row.style.paddingLeft = `${12 + Math.min(depth, 40) * 14}px`;
      const ic = document.createElement('span');
      ic.className = 'ic';
      ic.textContent = markOf(n);
      ic.title = typeOf(n);
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = labelOf(n);
      row.append(ic, nm);
      out.push(row);
      layerRows.set(id, row);
      if (CONTAINERS.has(n.type)) stack.push(...kidsOf(n).reverse().map((c) => [c, depth + 1]));
    }
    $('layers').replaceChildren(...out);
  }

  // One label and value row of the Properties panel; the value is text.
  function propRow(label, field, value) {
    const row = document.createElement('div');
    row.className = 'row';
    const k = document.createElement('span');
    k.className = 'k';
    k.textContent = label;
    const v = document.createElement('span');
    v.className = 'v';
    v.dataset.field = field;
    v.textContent = value;
    row.append(k, v);
    return row;
  }

  // The Properties panel: kit-661's read-only rows (the selected node's name and type, and for an
  // instance its component's name and variant), then, on a canvas open for editing, the fields that
  // change it (kit-662); with nothing selected, a note. The panel isn't rebuilt while a field in it has
  // focus or a press that started in it is under way: someone else's edit never takes a field from under
  // a person typing, and a click that follows a field's edit (whose change fires on that very press)
  // lands on the button it was aimed at. It is rebuilt once focus leaves the field, and after a press or
  // a click in it ends with no field focused; a button that merely has focus holds nothing, and the
  // focused control, when the new panel has it again, keeps focus.
  let propsStale = false;
  let pressing = false;
  // The colour fields set to Hex while their value isn't one (`<id> <path>`): kept until a hex is sent
  // or the selection changes, so the panel rebuilt meanwhile still shows the hex input.
  const hexChosen = new Set();
  const inProps = (x) => x instanceof Node && $('props').contains(x);
  // A field a person types or chooses in (a checkbox, like a button, holds nothing).
  const fieldFocused = () => {
    const a = document.activeElement;
    return inProps(a) && a.matches('input:not([type="checkbox"]), select, textarea');
  };
  const holdProps = () => pressing || fieldFocused();
  function renderProps() {
    if (holdProps()) { propsStale = true; return; }
    buildProps();
  }
  // The same control in a rebuilt panel: by its data-prop or data-action, and its data-value or data-variant.
  const controlKey = (e) => (e instanceof HTMLElement ? ['prop', 'action', 'value', 'variant'].map((k) => e.dataset[k] ?? '').join('\u0000') : null);
  function buildProps() {
    propsStale = false;
    const was = inProps(document.activeElement) ? controlKey(document.activeElement) : null;
    const box = $('props');
    if (state.sels.length > 1) {
      // several (kit-669 §2): how many, and Delete layers
      const p = document.createElement('p');
      p.className = 'note';
      p.dataset.field = 'count';
      p.textContent = `${state.sels.length} layers selected.`;
      const out = [p];
      if (state.session !== null) {
        const foot = document.createElement('div');
        foot.className = 'foot';
        const del = document.createElement('button');
        del.type = 'button';
        del.dataset.action = 'delete';
        del.textContent = 'Delete layers';
        del.disabled = !editable();
        del.addEventListener('click', () => deleteSelection());
        foot.append(del);
        out.push(foot);
      }
      box.replaceChildren(...out);
      if (was !== null && was !== '\u0000\u0000\u0000') {
        const again = [...box.querySelectorAll('button')].find((e) => controlKey(e) === was);
        if (again && !again.disabled) again.focus({ preventScroll: true });
      }
      return;
    }
    const n = state.sel === null ? null : nodeOf(state.sel);
    if (!n) {
      const p = document.createElement('p');
      p.className = 'note';
      p.textContent = TEXT.noSelection;
      box.replaceChildren(p);
      return;
    }
    const out = [propRow('Name', 'name', typeof n.name === 'string' ? n.name : ''), propRow('Type', 'type', typeOf(n))];
    if (n.type === 'instance') {
      const comp = nodeOf(n.component);
      const compName = comp && comp.type === 'component' ? (typeof comp.name === 'string' ? comp.name : '') : 'none';
      out.push(propRow('Component', 'component', compName));
      out.push(propRow('Variant', 'variant', typeof n.variant === 'string' && n.variant ? n.variant : 'none'));
    }
    if (state.session !== null) out.push(editFields(state.sel, n));
    box.replaceChildren(...out);
    if (was !== null && was !== '\u0000\u0000\u0000') {
      const again = [...box.querySelectorAll('input, select, textarea, button')].find((e) => controlKey(e) === was);
      if (again && !again.disabled) again.focus({ preventScroll: true });
    }
  }
  // After a press or a click in the panel ends: rebuilt when due, unless a field has focus.
  const settleProps = () => { if (propsStale && !pressing && !fieldFocused()) buildProps(); };
  $('props').addEventListener('pointerdown', () => { pressing = true; }, true);
  const pressEnd = () => {
    if (!pressing) return;
    // the click this press makes comes before this timer, so it reaches the control pressed
    setTimeout(() => { pressing = false; settleProps(); }, 0);
  };
  window.addEventListener('pointerup', pressEnd, true);
  window.addEventListener('pointercancel', pressEnd, true);
  $('props').addEventListener('click', () => { setTimeout(settleProps, 0); });
  $('props').addEventListener('focusout', () => {
    // after focus has landed: a move to another field of the panel keeps it as it is
    setTimeout(() => { if (propsStale && !holdProps()) buildProps(); }, 0);
  });

  // The shown page's ids in the Layers tree's order (its tree in pre-order, as renderLayers lists it).
  const layerOrder = () => [...layerRows.keys()];
  $('layers').setAttribute('aria-multiselectable', 'true');
  // Select nodes of the shown page (kit-669 §2): the ids listed in Layers kept, in layer order, each one's
  // row and drawn node marked; [] selects nothing. state.sel is the one id when exactly one is selected.
  // The tree keeps one row in the tab order (the ARIA tree pattern): the first selected row, else the
  // first. The server is told (queueSelect).
  function selectIds(ids) {
    const want = new Set(Array.isArray(ids) ? ids.filter((id) => layerRows.has(id)) : []);
    const next = layerOrder().filter((id) => want.has(id));
    const stop = next.length ? next[0] : (layerRows.keys().next().value ?? null);
    for (const [rid, row] of layerRows) {
      row.setAttribute('aria-selected', want.has(rid) ? 'true' : 'false');
      row.tabIndex = rid === stop ? 0 : -1;
    }
    for (const el of $('surface').querySelectorAll('.sel')) el.classList.remove('sel');
    for (const id of next) if (drawn.has(id)) drawn.get(id).classList.add('sel');
    if (next.length !== state.sels.length || next.some((id, i) => id !== state.sels[i])) hexChosen.clear();
    state.sels = next;
    state.sel = next.length === 1 ? next[0] : null;
    renderProps();
    queueSelect();
    drawHandles();
  }
  // One node selected alone, or nothing (null).
  const select = (id) => selectIds(id === null ? [] : [id]);
  // Shift+click: a node added to the selection, or taken out of it when it is in it.
  const toggleSel = (id) => selectIds(state.sels.includes(id) ? state.sels.filter((x) => x !== id) : [...state.sels, id]);
  // The selection's roots: the selected ids not inside another selected one, in layer order.
  function selRoots() {
    const sel = new Set(state.sels);
    return state.sels.filter((id) => {
      let cur = nodeOf(id)?.parent;
      for (let steps = 0; steps <= MAX_ELEMENTS && nodeOf(cur); steps++) {
        if (sel.has(cur)) return false;
        cur = nodeOf(cur).parent;
      }
      return true;
    });
  }

  $('layers').addEventListener('click', (e) => {
    const row = e.target instanceof Element ? e.target.closest('.layer[data-node]') : null;
    if (!row) return;
    if (e.shiftKey) toggleSel(row.dataset.node); else select(row.dataset.node);
  });
  // The tree by keyboard: ArrowDown and ArrowUp select the next and previous row, Home and End the first
  // and last, focus following (they are the tree's: they never nudge); Delete or Backspace deletes the
  // focused row's node as the Delete key does elsewhere (same guard, same words), at 760 px and over:
  // the whole selection when that row is selected, else that row's node alone.
  $('layers').addEventListener('keydown', (e) => {
    if (!ready() || e.ctrlKey || e.metaKey || e.altKey) return;
    const row = e.target instanceof Element ? e.target.closest('.layer[data-node]') : null;
    if (!row || !layerRows.has(row.dataset.node)) return;
    if (e.key === 'Delete' || e.key === 'Backspace') {
      e.preventDefault();
      e.stopPropagation(); // the page's own Delete would delete the selection, which may be another row
      if (editable()) { if (state.sels.includes(row.dataset.node)) deleteSelection(); else deleteNode(row.dataset.node); }
      return;
    }
    const ids = [...layerRows.keys()];
    const i = ids.indexOf(row.dataset.node);
    const to = { ArrowDown: ids[Math.min(i + 1, ids.length - 1)], ArrowUp: ids[Math.max(i - 1, 0)], Home: ids[0], End: ids[ids.length - 1] }[e.key];
    if (to === undefined) return;
    e.preventDefault();
    select(to);
    layerRows.get(to).focus();
  });
  // A click on the stage: the nearest drawn node with a data-id (inside an instance, the instance), or
  // on empty stage nothing. The stage's own controls are not the stage.
  $('stage').addEventListener('click', (e) => {
    if (panned) { panned = false; return; } // the click that ends a Space drag is a pan, not a click
    if (toolPress) { toolPress = false; return; } // the click that ends a tool's press made something
    if (!state.doc || e.button !== 0 || !(e.target instanceof Element)) return;
    if (e.target.closest('.zoom, .stage-top, #tools')) return;
    const hit = e.target.closest('#surface [data-id]');
    // Shift+click on a node adds it or takes it out (kit-669 §2); on empty stage it changes nothing
    if (e.shiftKey) { if (hit) toggleSel(hit.dataset.id); return; }
    select(hit ? hit.dataset.id : null);
  });
  // Escape ends a tool (a drag, a path, the drag rectangle) and returns to Move; with Move on, it clears
  // the selection.
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (tool !== 'move' || gesture !== null || pen !== null) { setTool('move'); return; }
    if (state.sels.length) select(null);
  });

  // ---- zoom and pan ----

  // The view: #surface moved by translate(x, y) scale(z), origin top-left, x and y in stage px.
  const ZMIN = 0.1;
  const ZMAX = 8;
  const STEP = 1.25;
  const view = { x: 0, y: 0, z: 1 };
  let moved = false; // the person has zoomed or panned since the page was shown
  let panned = false; // the pointer press now ending was a pan
  let pan = null;
  let spaceHeld = false;

  function applyView() {
    $('surface').style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
    $('zoomPct').textContent = `${Math.round(view.z * 100)}%`;
    drawPen(); // a path being drawn follows the view
    drawHandles(); // and the resize handles
  }
  // Zoom by `factor` around the stage point (sx, sy), which stays put; z kept to [0.1, 8], so at a
  // bound the view doesn't change at all.
  function zoomTo(target, sx, sy) {
    if (!Number.isFinite(target) || target <= 0) return;
    const z = Math.min(ZMAX, Math.max(ZMIN, target));
    if (z === view.z) return;
    const k = z / view.z;
    view.x = sx - (sx - view.x) * k;
    view.y = sy - (sy - view.y) * k;
    view.z = z;
    moved = true;
    applyView();
  }
  const zoomAt = (factor, sx, sy) => zoomTo(view.z * factor, sx, sy);
  const stageSize = () => ({ w: $('stage').clientWidth, h: $('stage').clientHeight });
  const zoomCentre = (z) => { const s = stageSize(); zoomTo(z, s.w / 2, s.h / 2); };
  // The shown page's content bounds in page px: the union of its top-level nodes' rectangles plus
  // 200 px around (contract §9), or null on a page with nothing shown.
  function contentBounds() {
    const surface = $('surface');
    const o = surface.getBoundingClientRect();
    let b = null;
    for (const el of surface.children) {
      if (!el.dataset.id || el.getClientRects().length === 0) continue;
      const r = el.getBoundingClientRect();
      const l = (r.left - o.left) / view.z;
      const t = (r.top - o.top) / view.z;
      const rr = l + r.width / view.z;
      const bb = t + r.height / view.z;
      b = b === null ? { l, t, r: rr, b: bb } : { l: Math.min(b.l, l), t: Math.min(b.t, t), r: Math.max(b.r, rr), b: Math.max(b.b, bb) };
    }
    return b && { l: b.l - 200, t: b.t - 200, r: b.r + 200, b: b.b + 200 };
  }
  // Fit: the content bounds fill the stage, at most 100%, centred.
  function fit() {
    const b = contentBounds();
    const s = stageSize();
    if (!b || s.w <= 0 || s.h <= 0) {
      Object.assign(view, { x: 0, y: 0, z: 1 });
    } else {
      const z = Math.min(1, Math.max(ZMIN, Math.min(s.w / (b.r - b.l), s.h / (b.b - b.t))));
      Object.assign(view, { z, x: (s.w - (b.r - b.l) * z) / 2 - b.l * z, y: (s.h - (b.b - b.t) * z) / 2 - b.t * z });
    }
    moved = false;
    applyView();
  }
  const ready = () => state.doc !== null && document.body.dataset.state !== 'error';

  $('zoomIn').addEventListener('click', () => { if (ready()) zoomCentre(view.z * STEP); });
  $('zoomOut').addEventListener('click', () => { if (ready()) zoomCentre(view.z / STEP); });
  $('zoomFit').addEventListener('click', () => { if (ready()) fit(); });
  // a resized window (a phone turned, a panel shown or hidden at 760 px) refits, unless the person has moved
  let wasNarrow = null;
  window.addEventListener('resize', () => {
    if (narrow() && (tool !== 'move' || gesture !== null || pen !== null)) setTool('move'); // under 760 px, watch only
    // across 760 px the panel's fields are built again, usable or not
    if (narrow() !== wasNarrow) { wasNarrow = narrow(); if (ready()) { renderProps(); renderPages(); } }
    if (ready() && !moved) fit();
    drawHandles(); // shown only at 760 px and over, and on the box where the resize left it
  });

  // The wheel pans; with Ctrl or ⌘ (a trackpad's pinch comes as Ctrl+wheel) it zooms around the pointer.
  $('stage').addEventListener('wheel', (e) => {
    if (!ready()) return;
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? stageSize().h : 1;
    const dx = e.deltaX * unit;
    const dy = e.deltaY * unit;

    // kit-669 §5 (as ruled): over 64 KB, cut in this order where no reference is left unresolved and
    // sent as consecutive edits; with no such cut nothing is sent, said, and the entry is kept
    const parts = splitParts(out, state.doc);
    if (parts === null) { pushEntry(entry); say(SAY.tooBig); return; }
    let sent = false;
    for (const part of parts) if (edit(part, { kind: 'undo' })) sent = true;
    if (sent && skipped) say(UNDO_SAY.part);
  }
  // Ctrl+Z (Cmd+Z on a Mac), no Shift, no Alt: only while no field has focus (there it is the field's),
  // at 760 px and over, while editing is allowed, and not during a drag (its throttled release or
  // restore included) or a path being drawn.
  document.addEventListener('keydown', (e) => {
    if (!(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey || typeof e.key !== 'string' || e.key.toLowerCase() !== 'z') return;
    if (!toolsOn() || typing(e.target) || gesture !== null || pen !== null || dragWaiting()) return;
    e.preventDefault();
    undo();
  });

  // ---- copy and paste (kit-669 §4): a canvas-doc@1 document as text, checked and resolved here ----
  // Text pasted from another canvas is hostile: it is parsed as JSON only, checked against the
  // contract's shape, every value put through its class's checker (a value outside is left out), its
  // references resolved against this canvas, and only then sent as one edit of adds; it reaches the
  // drawing only as any document does. The only request it makes is the image check.
  const PASTE_SAY = {
    notClip: "That isn't a canvas's layers, so nothing was pasted.",
    tooMuch: 'That is too much to paste at once.',
    frames: "Instances of components this canvas doesn't have were pasted as frames.",
    rects: "Images this canvas doesn't have were pasted as rectangles.",
    values: "Some values weren't valid here, so they were left out.",
  };
  const DOC_BYTES = 5242880; // canvas@1 §7 docBytes
  const NODES_MAX = 20000; // canvas@1 §7 nodes
  const DEPTH_MAX = 100; // canvas@1 §7 depth (a page's children are depth 1)
  const MAP_MAX = 32; // canvas@1 §7 props and variants, per component
  const OVERRIDE_ENTRIES = 1000; // canvas@1 §7 overrideEntries, per instance's overrides or variant
  const PAGES_MAX_DOC = 100; // canvas@1 §7 pages
  const NODE_ID_RE = /^[A-Za-z0-9_-]{1,40}$/;
  const TOKEN_PATH_RE = /^[A-Za-z0-9_-]{1,40}(?:\.[A-Za-z0-9_-]{1,40}){0,7}$/;
  const FIGMA_RE = /^[A-Za-z0-9:;_-]{1,100}$/;
  const NODE_TYPES = new Set(['frame', 'text', 'rect', 'ellipse', 'vector', 'image', 'component', 'instance']);
  const RECT_FILL = '#d9d9d9';

  // Every token path a value names by $ref, at any depth, added to `out`.
  function refPaths(v, out) {
    const stack = [v];
    while (stack.length) {
      const x = stack.pop();
      if (Array.isArray(x)) stack.push(...x);
      else if (isObj(x)) {
        if (own(x, '$ref') && typeof x.$ref === 'string') out.add(x.$ref);
        else stack.push(...Object.values(x));
      }
    }
    return out;
  }
  // The token at a dotted path of a token tree ({ $type, $value }), or null: own keys only.
  function tokenAt(tokens, path) {
    if (typeof path !== 'string' || !TOKEN_PATH_RE.test(path)) return null;
    let at = tokens;
    for (const seg of path.split('.')) {
      if (!isObj(at) || !own(at, seg)) return null;
      at = at[seg];
    }
    return isObj(at) && own(at, '$type') && own(at, '$value') ? at : null;
  }

  // The clip: the selection's roots (not inside another selected node, in layer order) on one page, the
  // shown one's id and name; each root's subtree as stored, the root's parent the page. A root drawn
  // with a box has x, y its drawn top-left in the page's px and a `fill` side its drawn size, rounded;
  // one without (hidden) keeps what is stored. `tokens`: every token the nodes name, with its groups.
  function makeClip() {
    const pg = pageById(state.pageId);
    const roots = selRoots().filter((id) => nodeOf(id));
    const nodes = {};
    const refs = new Set();
    const s = $('surface').getBoundingClientRect();
    const z = view.z;
    for (const r of roots) {
      for (const id of subtreeIds(state.doc, r)) refPaths(put(nodes, id, structuredClone(nodeOf(id))), refs);
      const n = nodes[r];
      n.parent = pg.id;
      if (!hasBox(r)) continue;
      const b = drawn.get(r).getBoundingClientRect();
      n.x = clamp(Math.round((b.left - s.left) / z), -PX, PX);
      n.y = clamp(Math.round((b.top - s.top) / z), -PX, PX);
      if (getPath(n, 'size.w') === 'fill') n.size.w = clamp(Math.round(b.width / z), 0, PX);
      if (getPath(n, 'size.h') === 'fill') n.size.h = clamp(Math.round(b.height / z), 0, PX);
    }
    const tokens = {};
    for (const path of refs) {
      const tk = tokenAt(state.doc.tokens, path);
      if (!tk) continue;
      const segs = path.split('.');
      let at = tokens;
      for (const seg of segs.slice(0, -1)) at = own(at, seg) && isObj(at[seg]) ? at[seg] : put(at, seg, {});
      put(at, segs[segs.length - 1], structuredClone(tk));
    }
    return { canvas: 1, rev: 0, tokens, pages: [{ id: pg.id, name: pageName(pg), children: roots }], nodes };
  }
  // Copy (Ctrl+C, Cmd+C, the browser's Copy) with a selection and no field focused: the clip as
  // compact JSON, text/plain. Watching too: it changes nothing. Else the browser's own copy.
  document.addEventListener('copy', (e) => {
    if (!ready() || state.sels.length === 0 || typing(e.target) || !e.clipboardData || !pageById(state.pageId)) return;
    e.preventDefault();
    e.clipboardData.setData('text/plain', JSON.stringify(makeClip()));
  });

  // The value classes (contract §2), each a checker (v, r) giving the value to keep or undefined to
  // leave it out. A `{ $ref }` is handed to `r(v, $type, fits)`: on the clip's own check (cleanClip) it
  // is kept as it is, its form checked; at paste (buildPaste) it is resolved against this canvas.
  const tokRef = (v) => isObj(v) && Object.keys(v).length === 1 && own(v, '$ref') && typeof v.$ref === 'string' && TOKEN_PATH_RE.test(v.$ref);
  const inRange = (v, lo, hi) => finite(v) && v >= lo && v <= hi;
  const weightOk = (v) => Number.isInteger(v) && v >= 100 && v <= 900 && v % 100 === 0;
  // A string of at most `max` code points (a code point is one or two UTF-16 units), free text.
  const textOk = (v, max) => typeof v === 'string' && (v.length <= max || (v.length <= max * 2 && [...v].length <= max)) && freeText(v);
  const familyOk = (v) => typeof v === 'string' && own(FAMILY, v);
  const fontOk = (v) => isObj(v) && familyOk(v.family) && inRange(v.size, 1, 1000) && weightOk(v.weight) && inRange(v.lineHeight, 0.5, 10);
  const dimOk = (v) => inRange(v, -PX, PX);
  const lenNum = (v) => inRange(v, 0, PX);
  const hexOk = (v) => typeof v === 'string' && HEX_RE.test(v);
  const lit = (ok) => (v) => (ok(v) ? v : undefined);
  const orRef = (ok, type) => (v, r) => (tokRef(v) ? r(v, type, ok) : ok(v) ? v : undefined);
  const oneOf = (...words) => lit((v) => typeof v === 'string' && words.includes(v));
  const CLASS = {
    name: lit((v) => textOk(v, 200)),
    text: lit((v) => textOk(v, 10000)),
    bool: lit((v) => typeof v === 'boolean'),
    opacity: lit((v) => inRange(v, 0, 1)),
    dim: orRef(dimOk, 'dimension'),
    len: orRef(lenNum, 'dimension'),
    color: orRef(hexOk, 'color'),
    paint: (v, r) => (v === null ? null : CLASS.color(v, r)),
    sizing: (v, r) => (v === 'hug' || v === 'fill' ? v : CLASS.len(v, r)),
    padding(v, r) {
      if (!Array.isArray(v) || v.length !== 4) return undefined;
      const out = v.map((x) => CLASS.len(x, r));
      return out.includes(undefined) ? undefined : out;
    },
    tracks: (v) => (Array.isArray(v) && v.length <= 64 && v.every((t) => lenNum(t) || t === 'auto' || (typeof t === 'string' && FR_RE.test(t))) ? [...v] : undefined),
    font(v, r) {
      if (tokRef(v)) return r(v, 'typography', fontOk);
      if (!isObj(v) || Object.keys(v).length !== 4 || !['family', 'size', 'weight', 'lineHeight'].every((k) => own(v, k))) return undefined;
      const out = {
        family: orRef(familyOk, 'fontFamily')(v.family, r),
        size: orRef((x) => inRange(x, 1, 1000), 'dimension')(v.size, r),
        weight: orRef(weightOk, 'fontWeight')(v.weight, r),
        lineHeight: orRef((x) => inRange(x, 0.5, 10), 'number')(v.lineHeight, r),
      };
      return Object.values(out).includes(undefined) ? undefined : out;
    },
    pathData: lit(pathOk),
    imageSrc: lit((v) => typeof v === 'string' && SRC_RE.test(v)),
    figmaId: lit((v) => typeof v === 'string' && FIGMA_RE.test(v)),
    componentRef: lit((v) => typeof v === 'string' && NODE_ID_RE.test(v)),
    variantName: lit((v) => v === null || (typeof v === 'string' && VARIANT_RE.test(v))),
  };
  // Property path → its class's checker: one per row of contract §2's Properties table (the maps,
  // props, variants and overrides, are checked entry by entry: propDefOf, propValueOf, overridesOf).
  const PROP_CLASS = Object.assign(Object.create(null), {
    name: CLASS.name, visible: CLASS.bool, opacity: CLASS.opacity, x: CLASS.dim, y: CLASS.dim,
    'size.w': CLASS.sizing, 'size.h': CLASS.sizing, figma: CLASS.figmaId,
    fill: CLASS.paint, stroke: CLASS.paint, strokeWidth: CLASS.len, radius: CLASS.len, clip: CLASS.bool,
    'layout.mode': oneOf('none', 'row', 'column', 'grid'), 'layout.gap': CLASS.len, 'layout.padding': CLASS.padding,
    'layout.align': oneOf('start', 'center', 'end', 'stretch'), 'layout.justify': oneOf('start', 'center', 'end', 'between'),
    'layout.wrap': CLASS.bool, 'layout.columns': CLASS.tracks, 'layout.rows': CLASS.tracks,
    text: CLASS.text, font: CLASS.font, color: CLASS.color, align: oneOf('left', 'center', 'right', 'justify'),
    path: CLASS.pathData, src: CLASS.imageSrc, fit: oneOf('cover', 'contain', 'fill'),
    component: CLASS.componentRef, variant: CLASS.variantName,
  });
  // Type → its plain property paths (a group's, layout and size, as `<group>.<key>`), and its maps.
  const TYPE_PROPS = Object.assign(Object.create(null), Object.fromEntries(Object.entries(PATHS).map(([t, ps]) => [t, new Set([...ps, 'figma'])])));
  const TYPE_MAPS = { component: new Set(['props', 'variants']), instance: new Set(['props', 'overrides']) };
  // An override may set a property of its target's type but these (contract §2).
  const NOT_OVERRIDDEN = new Set(['name', 'figma', 'component', 'variant', 'props', 'variants', 'overrides']);
  const overridable = (type, prop) => !NOT_OVERRIDDEN.has(prop) && own(TYPE_PROPS, type) && TYPE_PROPS[type].has(prop);
  // A component's prop definition, exactly { type, default, target: { id, prop } } and in its class, as
  // a fresh object, or undefined.
  function propDefOf(pd) {
    if (!isObj(pd) || Object.keys(pd).length !== 3 || !['type', 'default', 'target'].every((k) => own(pd, k))) return undefined;
    const tg = pd.target;
    if (!isObj(tg) || Object.keys(tg).length !== 2 || !own(tg, 'id') || !own(tg, 'prop') || typeof tg.id !== 'string' || !NODE_ID_RE.test(tg.id)) return undefined;
    if (pd.type === 'text' && textOk(pd.default, 10000) && tg.prop === 'text') return { type: 'text', default: pd.default, target: { id: tg.id, prop: 'text' } };
    if (pd.type === 'bool' && typeof pd.default === 'boolean' && tg.prop === 'visible') return { type: 'bool', default: pd.default, target: { id: tg.id, prop: 'visible' } };
    return undefined;
  }
  const propValueOf = (v) => (typeof v === 'boolean' || textOk(v, 10000) ? v : undefined);
  // An override map's shape ({ <node id>: { <prop>: value } }) as a fresh object, its first 1000
  // entries (canvas@1 §7 overrideEntries; the rest left out and said); its values are checked at
  // paste, against the target's type there (overrideOf).
  function overridesOf(m, said) {
    const out = {};
    if (!isObj(m)) { said.values = true; return out; }
    let room = OVERRIDE_ENTRIES;
    for (const tid of Object.keys(m)) {
      if (!NODE_ID_RE.test(tid) || !isObj(m[tid])) { said.values = true; continue; }
      const props = Object.keys(m[tid]);
      if (props.length > room) said.values = true;
      const kept = props.slice(0, room);
      if (kept.length === 0) continue;
      const o = put(out, tid, {});
      for (const prop of kept) put(o, prop, m[tid][prop]);
      room -= kept.length;
    }
    return out;
  }

  // The clip's shape (spec §4 step 1): null when it holds to canvas-doc@1's rules top, page-shape,
  // node-shape, id-form, id-unique and tree, with no node holding an `id` key and no component inside a
  // component; else the first rule that fails.
  function clipShape(doc) {
    const TOP = ['canvas', 'rev', 'tokens', 'pages', 'nodes'];
    if (!isObj(doc) || Object.keys(doc).length !== TOP.length || !TOP.every((k) => own(doc, k))) return 'top';
    if (doc.canvas !== 1 || !Number.isSafeInteger(doc.rev) || doc.rev < 0 || !isObj(doc.tokens) || !Array.isArray(doc.pages) || !isObj(doc.nodes)) return 'top';
    if (doc.pages.length < 1 || doc.pages.length > PAGES_MAX_DOC) return 'limits';
    const ids = Object.keys(doc.nodes);
    if (ids.length > NODES_MAX) return 'limits';
    const pageIds = new Set();
    for (const pg of doc.pages) {
      if (!isObj(pg) || Object.keys(pg).length !== 3 || !['id', 'name', 'children'].every((k) => own(pg, k))) return 'page-shape';
      if (!Array.isArray(pg.children) || !pg.children.every((c) => typeof c === 'string')) return 'page-shape';
      if (typeof pg.id !== 'string' || !NODE_ID_RE.test(pg.id)) return 'id-form';
      if (pageIds.has(pg.id) || own(doc.nodes, pg.id)) return 'id-unique';
      pageIds.add(pg.id);
    }
    const node = (id) => doc.nodes[id];
    for (const id of ids) {
      if (!NODE_ID_RE.test(id)) return 'id-form';
      const n = node(id);
      if (!isObj(n) || !own(n, 'type') || !NODE_TYPES.has(n.type) || !own(n, 'parent') || typeof n.parent !== 'string' || own(n, 'id')) return 'node-shape';
      if (CONTAINERS.has(n.type) ? !(own(n, 'children') && Array.isArray(n.children) && n.children.every((c) => typeof c === 'string')) : own(n, 'children')) return 'node-shape';
    }
    // each listed child exists, names that parent and is listed once; each node's parent is a page or
    // a container that lists it; every node reached from a page
    const listedBy = new Map();
    const lists = doc.pages.map((pg) => [pg.id, pg.children]);
    for (const id of ids) if (CONTAINERS.has(node(id).type)) lists.push([id, node(id).children]);
    for (const [owner, kids] of lists) {
      for (const c of kids) {
        if (listedBy.has(c) || !own(doc.nodes, c) || node(c).parent !== owner) return 'tree';
        listedBy.set(c, owner);
      }
    }
    for (const id of ids) {
      const pid = node(id).parent;
      if (!pageIds.has(pid) && !(own(doc.nodes, pid) && CONTAINERS.has(node(pid).type))) return 'tree';
      if (listedBy.get(id) !== pid) return 'tree';
    }
    // the walk carries each node's depth: deeper than 100 is refused (limits), so no walk up a
    // clip's parents is longer than that
    const queue = [];
    for (const pg of doc.pages) for (const c of pg.children) queue.push([c, false, 1]);
    for (let i = 0; i < queue.length; i++) {
      const [id, inComp, depth] = queue[i];
      const n = node(id);
      if (depth > DEPTH_MAX) return 'limits';
      if (n.type === 'component' && inComp) return 'components';
      if (CONTAINERS.has(n.type)) for (const c of n.children) queue.push([c, inComp || n.type === 'component', depth + 1]);
    }
    if (queue.length !== ids.length) return 'tree';
    return null;
  }

  // The clip's nodes cleaned (spec §4 step 1's keys and classes): per node, a key not of its type's
  // properties or a value not in its class is left out; a node then missing a required property (a
  // vector's path, an image's src, an instance's component; none of them holds children) is left out.
  // → { pages: [{ id, children }], nodes: Map id → node, tokens, said: { values } }.
  function cleanClip(doc) {
    const said = { values: false };
    const keepRef = (v) => ({ $ref: v.$ref });
    const keep = (path, v) => {
      const out = PROP_CLASS[path](v, keepRef);
      if (out === undefined) said.values = true;
      return out;
    };
    const nodes = new Map();
    for (const id of Object.keys(doc.nodes)) {
      const n = doc.nodes[id];
      const paths = TYPE_PROPS[n.type];
      const out = { type: n.type, parent: n.parent };
      if (CONTAINERS.has(n.type)) out.children = [...n.children];
      for (const k of Object.keys(n)) {
        if (k === 'type' || k === 'parent' || k === 'children') continue;
        if ((k === 'layout' || k === 'size') && paths.has(k === 'size' ? 'size.w' : 'layout.mode')) {
          if (!isObj(n[k])) { said.values = true; continue; }
          const g = {};
          for (const sub of Object.keys(n[k])) {
            const path = `${k}.${sub}`;
            if (!paths.has(path)) { said.values = true; continue; }
            const v = keep(path, n[k][sub]);
            if (v !== undefined) g[sub] = v;
          }
          if (Object.keys(g).length) out[k] = g;
        } else if (!k.includes('.') && paths.has(k)) {
          const v = keep(k, n[k]);
          if (v !== undefined) out[k] = v;
        } else if (own(TYPE_MAPS, n.type) && TYPE_MAPS[n.type].has(k)) {
          const m = n[k];
          if (!isObj(m)) { said.values = true; continue; }
          const o = {};
          if (k === 'overrides') Object.assign(out, { overrides: overridesOf(m, said) });
          else if (k === 'variants') {
            for (const name of Object.keys(m)) {
              if (VARIANT_RE.test(name) && Object.keys(o).length < MAP_MAX) put(o, name, overridesOf(m[name], said));
              else said.values = true;
            }
            out.variants = o;
          } else {
            const check = n.type === 'component' ? propDefOf : propValueOf;
            for (const name of Object.keys(m)) {
              const room = n.type !== 'component' || Object.keys(o).length < MAP_MAX;
              const v = VARIANT_RE.test(name) && room ? check(m[name]) : undefined;
              if (v === undefined) said.values = true; else put(o, name, v);
            }
            out.props = o;
          }
        } else said.values = true;
      }
      const lacks = (n.type === 'vector' && !own(out, 'path')) || (n.type === 'image' && !own(out, 'src')) || (n.type === 'instance' && !own(out, 'component'));
      if (lacks) said.values = true; else nodes.set(id, out);
    }
    const listed = (kids) => kids.filter((c) => nodes.has(c));
    for (const n of nodes.values()) if (n.children) n.children = listed(n.children);
    return { pages: doc.pages.map((pg) => ({ id: pg.id, children: listed(pg.children) })), nodes, tokens: doc.tokens, said };
  }

  // A token's literal value of `type` (spec §4 step 2): a colour token's hex, else #rrggbb or
  // #rrggbbaa from its components and alpha; a dimension's px value; a fontFamily's word; a
  // fontWeight's and a number's number; a typography token's { family, size, weight, lineHeight }.
  const hex2 = (n) => Math.round(n * 255).toString(16).padStart(2, '0');
  function literalOf(tk, type) {
    if (!isObj(tk) || tk.$type !== type) return undefined;
    const x = tk.$value;
    switch (type) {
      case 'color': {
        if (!isObj(x)) return undefined;
        if (typeof x.hex === 'string' && HEX6_RE.test(x.hex)) return x.hex;
        const c = x.components;
        const a = own(x, 'alpha') ? x.alpha : 1;
        if (!Array.isArray(c) || c.length !== 3 || !c.every((n) => inRange(n, 0, 1)) || !inRange(a, 0, 1)) return undefined;
        return `#${c.map(hex2).join('')}${a === 1 ? '' : hex2(a)}`;
      }
      case 'dimension': return isObj(x) && x.unit === 'px' && finite(x.value) ? x.value : undefined;
      case 'fontFamily': return familyOk(x) ? x : undefined;
      case 'fontWeight': return weightOk(x) ? x : undefined;
      case 'number': return finite(x) ? x : undefined;
      case 'typography': {
        if (!isObj(x)) return undefined;
        const out = {
          family: literalOf({ $type: 'fontFamily', $value: x.fontFamily }, 'fontFamily'),
          size: literalOf({ $type: 'dimension', $value: x.fontSize }, 'dimension'),
          weight: literalOf({ $type: 'fontWeight', $value: x.fontWeight }, 'fontWeight'),
          lineHeight: literalOf({ $type: 'number', $value: x.lineHeight }, 'number'),
        };
        return Object.values(out).includes(undefined) ? undefined : out;
      }
      default: return undefined;
    }
  }

  // The paste's ops (spec §4 steps 2 and 3) against this canvas as it stands, the shown page its
  // target; `lacking`: the image files this canvas doesn't have. → { ops, roots (the pasted roots' new
  // ids), files (every image file the ops name), said: { frames, rects, values } }, or null with no
  // shown page.
  function buildPaste(clip, lacking = new Set()) {
    const pg = pageById(state.pageId);
    if (!pg) return null;
    const d = state.doc;
    const said = { frames: false, rects: false, values: clip.said.values };
    const files = new Set();
    // a $ref resolved: kept when this canvas has the token with that type and a value that fits, else
    // the clip's token's literal when it fits, else left out
    const resolve = (v, type, fits) => {
      const mine = literalOf(tokenAt(d.tokens, v.$ref), type);
      if (mine !== undefined && fits(mine)) return { $ref: v.$ref };
      const theirs = literalOf(tokenAt(clip.tokens, v.$ref), type);
      return theirs !== undefined && fits(theirs) ? theirs : undefined;
    };
    const value = (path, v) => {
      let out = PROP_CLASS[path](v, resolve);
      if (path === 'src' && out !== undefined) {
        if (lacking.has(imageFile(out))) out = undefined; else files.add(imageFile(out));
      }
      if (out === undefined) said.values = true;
      return out;
    };
    // the types as pasted: an instance of a component this canvas doesn't have a frame, an image of a
    // file it doesn't have a rect
    const isComp = (id) => nodeIn(d, id)?.type === 'component';
    const typed = new Map();
    for (const [id, n] of clip.nodes) {
      if (n.type === 'instance' && !isComp(n.component)) typed.set(id, 'frame');
      else if (n.type === 'image' && lacking.has(imageFile(n.src))) typed.set(id, 'rect');
      else typed.set(id, n.type);
    }
    // new ids for every node pasted
    const fresh = new Map();
    for (const cp of clip.pages) {
      const stack = [...cp.children].reverse();
      while (stack.length) {
        const id = stack.pop();
        fresh.set(id, newId());
        stack.push(...[...(clip.nodes.get(id).children ?? [])].reverse());
      }
    }
    // each clip node's nearest component (null for none), found once by a walk down from the pages
    const encl = new Map();
    for (const cp of clip.pages) {
      const stack = cp.children.map((c) => [c, null]);
      while (stack.length) {
        const [id, comp] = stack.pop();
        encl.set(id, comp);
        const n = clip.nodes.get(id);

  // ---- the pen: a click per point; Enter or a double-click ends the path, Escape drops it ----

  // The document fetched again as base (its session too); the ops held meanwhile applied after it, in
  // order, those above its rev. A fetch that fails closes the socket, and the next welcome fetches. When
  // the fetched session isn't the one base had (a restart or a replace), or a welcome came at a lower
  // rev, kept goes back in front of pending, in seq order; pending is then sent from the start either way
  // (a same-session resend is re-acked). A fetch a reload came during is thrown away, failed or not, and
  // asked again at once.
  async function refetch() {
    if (sock.fetching) { sock.again = true; return; }
    sock.fetching = true;
    sock.again = false;
    const epoch = sock.epoch;
    const before = state.session;
    let b = null;
    try {
      const res = await fetch(`/api/canvas/doc?slug=${encodeURIComponent(state.slug)}`, { credentials: 'same-origin', cache: 'no-store' });
      if (res.status === 200) {
        const j = await res.json();
        if (frameOk(j)) b = j;
      }
    } catch { b = null; }
    sock.fetching = false;
    if (epoch !== sock.epoch) { refetch(); return; }
    if (b === null) {
      sock.held = [];
      sock.stale = true;
      if (sock.ws) sock.ws.close();
      return;
    }
    sock.stale = false;
    takeDoc(b);
    if (state.session !== before || sock.lowered) {
      state.pending = [...state.kept.sort(bySeq), ...state.pending];
      state.kept = [];
      sock.lowered = false;
      sock.highest = state.base.rev;
    }
    sock.cursor = 0;
    // frames of another session than the one fetched are dropped: their acks don't count there
    for (const m of sock.held.splice(0)) {
      if (m.via !== state.session) continue;
      if (sock.fetching) sock.held.push(m); else takeOps(m);
    }
    if (sock.again && !sock.fetching) refetch();
    redraw();
    pump();
    // kit-663 §6 (kit-669 F2): the selection is sent again once the fetch lands, after the re-sent
    // edits are acked, even when it equals the last one sent: a restart or a reload may have taken
    // those ids out of the server's selection
    sock.lastSelect = null;
    queueSelect();
  }

  async function start() {
    setState('loading');
    const m = /^\/view\/canvas\/([^/]*)$/.exec(location.pathname);
    const slug = m ? m[1] : '';
    if (!SLUG_RE.test(slug)) return fail(TEXT.notAddress);
    state.slug = slug;
    $('title').textContent = slug;
    document.title = `${slug} · canvas`;
    let res;
    try {
      res = await fetch(`/api/canvas/doc?slug=${encodeURIComponent(slug)}`, { credentials: 'same-origin', cache: 'no-store' });
    } catch {
      return fail(TEXT.notLoaded);
    }
    if (res.status === 404) return fail(TEXT.notOpen);
    const withStatus = `${TEXT.notLoaded} (${res.status})`;
    if (res.status !== 200) return fail(withStatus);
    let body;
    try { body = await res.json(); } catch { return fail(withStatus); }
    if (!frameOk(body)) return fail(withStatus);
    takeDoc(body);
    state.doc = state.base;
    showRepo(body.repo);
    renderPages();
    renderPageSel();
    showPage(hashPage());
    syncBody();
    // main's copy (session null) is read-only: no socket, no editing
    if (state.session !== null) connect();
  }

  start().catch(() => fail(TEXT.notLoaded));
})();
</script>
