<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas</title>
<!-- The canvas editor (kit-661): a canvas-doc@1 document read from GET /api/canvas/doc and drawn as
     plain DOM. Its own HTML, CSS and one script; nothing from another origin. The document is data:
     text goes in with textContent, every style value through a checker and one CSSOM property. -->
<style>
  /* the dashboard's tokens (devteam-ui tokens), with the system font stacks: this page loads no font */
  :root {
    color-scheme: light;
    --bg: #fafafa; --surface: #ffffff; --raised: #ffffff; --hover: #f2f2f2; --well: #f2f2f2;
    --fg: #171717; --fg-2: #666666; --muted: #8f8f8f; --line: #ebebeb; --line-2: #dcdcdc;
    --blue: #0070f3; --blue-fg: #0068d6; --red: #ee0000; --red-fg: #cb2a2f; --amber: #f5a623; --amber-fg: #a35200; --green: #45a557; --green-fg: #297a3a;
    --shadow: 0 1px 2px rgba(0,0,0,.04);
    --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --serif: ui-serif, Georgia, Cambria, 'Times New Roman', serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    /* this page's own */
    --stage: #ececec; --amber-bg: #fff4e5; --sel: #0070f3;
    --bar-h: 49px; --left-w: 240px; --right-w: 300px;
    /* running text: six of twelve columns at 1440 (the dashboard's devteam-layout measure) */
    --measure: calc((1200px - 2 * 32px - 11 * 16px) / 2 + 5 * 16px);
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --bg: #000000; --surface: #0a0a0a; --raised: #111111; --hover: #1a1a1a; --well: #111111;
    --fg: #ededed; --fg-2: #a1a1a1; --muted: #7d7d7d; --line: #1f1f1f; --line-2: #2e2e2e;
    --blue: #52a8ff; --blue-fg: #52a8ff; --red: #ff6166; --red-fg: #ff6166; --amber: #ffb224; --amber-fg: #ffb224; --green: #3cd58c; --green-fg: #62c073;
    --shadow: none;
    --stage: #161616; --amber-bg: #2a1d05; --sel: #52a8ff;
  } }

  * { box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); }
  body { margin: 0; color: var(--fg); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  [hidden] { display: none !important; }
  button { font: inherit; font-size: 12px; font-weight: 500; height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); cursor: pointer; }
  button:hover { background: var(--hover); }
  select { font: inherit; font-size: 12px; color: var(--fg); background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px; height: 28px; padding: 0 8px; min-width: 0; }

  /* the bar */
  .bar { height: var(--bar-h); display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--surface); position: relative; z-index: 5; }
  .bar .back { color: var(--fg-2); text-decoration: none; white-space: nowrap; }
  .bar .back:hover { color: var(--fg); }
  .bar h1 { font-size: 14px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .bar .where { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .bar .grow { flex: 1; }
  .chip { font-size: 11px; height: 24px; padding: 0 8px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg-2); display: inline-flex; align-items: center; white-space: nowrap; overflow: hidden; min-width: 0; }
  /* the chip's two parts: the repo name may be cut with an ellipsis (a block, so one is drawn), the
     visibility never is */
  .chip .repo-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
  .chip .repo-vis { display: block; white-space: nowrap; flex: none; margin-left: .3em; }
  .chip.public { color: var(--amber-fg); border-color: var(--amber-fg); background: var(--amber-bg); }

  /* the three columns */
  .work { position: absolute; top: var(--bar-h); left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: var(--left-w) minmax(0, 1fr) var(--right-w); }
  .panel { background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; min-height: 0; }
  .panel.right { border-right: 0; border-left: 1px solid var(--line); }
  .ptitle { font: 500 11px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 14px 12px 8px; margin: 0; }
  .pages a { display: block; padding: 5px 12px; color: var(--fg-2); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pages a:hover { background: var(--hover); }
  .pages a[aria-current="page"] { color: var(--fg); background: var(--well); }
  .layers { padding-bottom: 20px; }
  .layer { display: flex; align-items: center; gap: 6px; height: 26px; padding-right: 8px; color: var(--fg-2); cursor: pointer; white-space: nowrap; font-size: 12px; }
  .layer:hover { background: var(--hover); }
  .layer[aria-selected="true"] { background: color-mix(in srgb, var(--sel) 14%, transparent); color: var(--fg); }
  /* the focused row (kit-662: the tree by keyboard) is ringed, not only tinted */
  .layer:focus { outline: none; }
  .layer:focus-visible { outline: 2px solid var(--sel); outline-offset: -2px; }
  .layer .ic { width: 14px; text-align: center; color: var(--muted); font-family: var(--mono); font-size: 10px; flex: none; }
  .layer .nm { overflow: hidden; text-overflow: ellipsis; }
  .props { padding: 0 12px 24px; }
  .props .row { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; align-items: baseline; margin: 8px 0; font-size: 12px; }
  .props .row .k { color: var(--fg-2); }
  .props .row .v { overflow-wrap: anywhere; max-width: var(--measure); }
  .note { font-size: 12px; color: var(--fg-2); margin: 8px 0; max-width: var(--measure); }
  /* the editable fields (kit-662), under the read-only rows */
  .props .fields { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 4px; }
  .props .fields .row { align-items: center; }
  .props input, .props textarea { font: inherit; font-size: 12px; color: var(--fg); background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px; height: 28px; padding: 0 8px; min-width: 0; width: 100%; }
  .props .foot { margin-top: 16px; }
  .props .ctl { display: flex; gap: 4px; align-items: center; min-width: 0; }
  .props .ctl > select, .props .ctl > input:not([type="checkbox"]) { flex: 1 1 0; width: auto; }
  .props select { width: 100%; }
  .props input[type="checkbox"] { width: 16px; height: 16px; margin: 0; padding: 0; }
  .props textarea { height: auto; min-height: 64px; padding: 4px 8px; resize: vertical; line-height: 1.4; }
  .props .group { display: flex; flex-wrap: wrap; gap: 2px; flex: 1 1 auto; min-width: 0; }
  .props .group button { flex: 1 1 auto; padding: 0 5px; }
  .props .group button[aria-pressed="true"] { background: var(--well); border-color: var(--fg-2); color: var(--fg); }
  .props .pad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; flex: 1 1 auto; min-width: 0; }
  .props .pad input { padding: 0 4px; }
  .props .swatch { flex: none; width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--line-2); }
  .props .swatch.none { border-style: dashed; }
  .props .fnote { margin: -4px 0 8px 80px; color: var(--red-fg); }
  .props :disabled { opacity: .5; cursor: not-allowed; }
  .props .acts { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
  .props .vname { flex: 1 1 auto; overflow-wrap: anywhere; }

  /* the stage: the page surface is the one element zoom and pan move */
  /* clip, not hidden: the stage is no scroll container, so nothing (scrollIntoView included) scrolls it */
  .stage { position: relative; background: var(--stage); overflow: clip; min-width: 0; touch-action: none; user-select: none; }
  .stage.panning, .stage.space { cursor: grab; }
  .stage.panning { cursor: grabbing; }
  #surface { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .zoom { position: absolute; right: 12px; top: 12px; display: flex; gap: 4px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; z-index: 3; }
  .zoom .pct { font-size: 12px; width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
  .stage-top { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; z-index: 3; max-width: calc(100% - 24px); }
  #pageSel, #narrowNote { display: none; }
  #capNote { font-size: 12px; color: var(--fg-2); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; margin: 0; max-width: var(--measure); }
  #narrowNote { font-size: 12px; color: var(--fg-2); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; margin: 0; max-width: var(--measure); }
  #msg { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); margin: 0; padding: 0 16px; width: max-content; max-width: min(var(--measure), 100%); color: var(--fg-2); text-align: center; z-index: 2; pointer-events: none; }
  /* the banner and the message line (kit-662): at the stage's top, centred, clear of its corners; they
     take no pointer events, so the stage under them can still be used */
  .say { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; width: max-content; max-width: calc(100% - 24px); z-index: 4; pointer-events: none; }
  .say p { margin: 0; max-width: var(--measure); font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
  #banner { background: var(--amber-bg); color: var(--amber-fg); border-color: var(--amber-fg); }
  /* the tools bar (kit-662): one row at the stage's foot, centred, its right edge at least 160 px left
     of the stage's (kit-661 checks the stage's own bottom-right corner, 60 and 120 px in). It never
     wraps, and stays centred while key buttons of a usable size fit so: by the stage's width it shows
     names and keys (about 470 px, centred, from 840 px), the keys alone (about 190 px, centred, from
     520 px), then below that the keys in 12 px buttons at the stage's left (90 px); under a 260 px
     stage, where not even that keeps 160 px clear, it is hidden and the tool keys still work. */
  .stage { container: stage / inline-size; }
  .tools { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: nowrap; gap: 2px; width: max-content; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; box-shadow: var(--shadow); z-index: 3; }
  .tools button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; border-color: transparent; background: transparent; }
  @container stage (width < 840px) {
    .tools .tn { display: none; }
  }
  @container stage (width < 520px) {
    .tools { left: 4px; transform: none; gap: 0; padding: 2px; }
    .tools button { width: 12px; padding: 0; overflow: hidden; }
  }
  @container stage (width < 260px) {
    .tools { display: none; }
  }
  .tools button:hover { background: var(--hover); }
  .tools button[aria-pressed="true"] { background: var(--well); border-color: var(--fg-2); }
  .tools button:disabled { opacity: .5; cursor: not-allowed; }
  .tools kbd { font: 10px/1 var(--mono); color: var(--muted); }
  .stage.drawing:not(.space):not(.panning) { cursor: crosshair; }
  /* a tool's preview: stage chrome, never a drawn node, taking no pointer events */
  .draft { position: absolute; border: 1px dashed var(--sel); pointer-events: none; z-index: 2; }
  .draft.round { border-radius: 50%; }
  .pen { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 2; }
  .pen polyline { fill: none; stroke: var(--sel); stroke-width: 1.5px; stroke-dasharray: 4 3; }
  body[data-state="error"] #surface, body[data-state="error"] .zoom { display: none; }

  /* under 760 px, watch and comment: no panels, the stage the full width under the bar, the bar's
     title and chip cut with an ellipsis (never wrapped), the page select and the note on the stage,
     at its bottom left, clear of the zoom controls at its top right */
  @media (max-width: 760px) {
    .work { grid-template-columns: minmax(0, 1fr); }
    .panel { display: none; }
    .bar { gap: 8px; }
    .bar > * { min-width: 0; }
    .bar .where { display: none; }
    .bar h1, .bar .back { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar .back { flex: none; }
    /* the title gives way first (shrink weighs by size, so a factor this large cuts it before the chip),
       down to a floor of its whole text or 5em, whichever is less; then the chip's repo name gives way.
       (min() takes no intrinsic size, so calc-size; without it, a 5em floor.) */
    .bar h1 { flex: 0 1000 auto; min-width: 5em; min-width: calc-size(max-content, min(size, 5em)); }
    .bar .chip { flex: 0 1 auto; }
    .stage-top { top: auto; bottom: 12px; }
    #pageSel { display: block; max-width: 100%; }
    .say { top: 52px; }
    #narrowNote { display: block; }
    #tools { display: none; }
  }

  /* the design being drawn keeps its own colours, light or dark */
  .dnode { margin: 0; }
  img.dnode, svg.dnode { display: block; }
  .dnode.sel { outline: 2px solid var(--sel); }
  /* a node that can't be drawn: a dashed box with its name */
  .placeholder { border: 1px dashed #8f8f8f; color: #666666; font: 11px/1.4 var(--sans); padding: 2px 6px; min-width: 24px; min-height: 18px; white-space: nowrap; background: transparent; }
  /* a component's label: stage chrome above its box, placed by CSS anchor positioning */
  .clabel { position: absolute; left: anchor(left); bottom: anchor(top); margin-bottom: 4px; font: 500 11px/1 var(--sans); color: var(--sel); white-space: nowrap; pointer-events: none; }
  /* without anchor positioning a label would sit at the surface's corner, over the design: none then */
  @supports not (anchor-name: --a) { .clabel { display: none; } }
</style>
</head>
<body data-state="loading">
<header class="bar">
  <a class="back" href="/#library">&larr; Library</a>
  <h1 id="title"></h1>
  <span class="where">canvas</span>
  <span class="grow"></span>
  <span class="chip" id="repoChip" hidden></span>
</header>
<main class="work">
  <aside class="panel left">
    <h2 class="ptitle">Pages</h2>
    <nav class="pages" id="pages" aria-label="Pages"></nav>
    <h2 class="ptitle">Layers</h2>
    <div class="layers" id="layers" role="tree" aria-label="Layers"></div>
  </aside>
  <section class="stage" id="stage" aria-label="Canvas">
    <div id="surface"></div>
    <div class="stage-top">
      <select id="pageSel" aria-label="Page"></select>
      <p id="narrowNote">Watching: editing needs a wider screen.</p>
      <p id="capNote" role="status" hidden>Some components weren't drawn: this page holds too many.</p>
    </div>
    <div class="zoom">
      <button id="zoomOut" type="button" aria-label="Zoom out">&minus;</button>
      <span class="pct" id="zoomPct">100%</span>
      <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
      <button id="zoomFit" type="button">Fit</button>
    </div>
    <p id="msg" role="status" hidden></p>
    <div class="say">
      <p id="banner" role="status" hidden></p>
      <p id="toast" role="status" hidden></p>
    </div>
    <div class="tools" id="tools" role="toolbar" aria-label="Tools" hidden>
      <button type="button" data-tool="move" aria-pressed="true" aria-label="Move" title="Move (V)"><span class="tn">Move</span> <kbd>V</kbd></button>
      <button type="button" data-tool="frame" aria-pressed="false" aria-label="Frame" title="Frame (F)"><span class="tn">Frame</span> <kbd>F</kbd></button>
      <button type="button" data-tool="text" aria-pressed="false" aria-label="Text" title="Text (T)"><span class="tn">Text</span> <kbd>T</kbd></button>
      <button type="button" data-tool="rect" aria-pressed="false" aria-label="Rectangle" title="Rectangle (R)"><span class="tn">Rectangle</span> <kbd>R</kbd></button>
      <button type="button" data-tool="ellipse" aria-pressed="false" aria-label="Ellipse" title="Ellipse (O)"><span class="tn">Ellipse</span> <kbd>O</kbd></button>
      <button type="button" data-tool="vector" aria-pressed="false" aria-label="Vector" title="Vector (P)"><span class="tn">Vector</span> <kbd>P</kbd></button>
      <button type="button" data-tool="image" aria-pressed="false" aria-label="Image" title="Image (I)"><span class="tn">Image</span> <kbd>I</kbd></button>
    </div>
    <input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp,image/gif" aria-label="Image file" hidden>
  </section>
  <aside class="panel right">
    <h2 class="ptitle">Properties</h2>
    <div class="props" id="props"><p class="note">Select a layer to see what it is.</p></div>
  </aside>
</main>
<script>
'use strict';
(() => {
  const SLUG_RE = /^[a-z][a-z0-9]*(-[a-z0-9]+)*$/;
  const TEXT = {
    notAddress: "This isn't a canvas address.",
    notOpen: "This canvas isn't open for editing.",
    notLoaded: "This canvas couldn't be loaded.",
    empty: 'This page is empty.',
    noSelection: 'Select a layer to see what it is.',
  };
  const $ = (id) => document.getElementById(id);
  const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
  const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

  // What the page holds: the slug, the response's session and rev, the document drawn, and the page
  // shown. Editing (kit-662) keeps two copies: `base`, the document as the server has applied it, and
  // `pending`, the page's own edits not yet acked ({ ops, seq, kind, entry }, seq null until sent), in
  // order; `doc` is base with pending applied over it, what is drawn. `kept` (kit-668) holds the page's
  // own edits acked but not yet saved, each with the `rev` of its ack and the socket's `session` then:
  // a new session resends them. `saved` is the last `saved` rev; `locked` is null, 'view' (refused as a
  // View person) or 'closed' (landed or removed): no more edits either way.
  const state = {
    slug: null, session: null, rev: null, doc: null, repo: null, pageId: null, sel: null,
    base: null, pending: [], kept: [], saved: null, locked: null, paused: false, closedText: null,
    // Change in (spec §3): { comp, name }, the variant a component's nodes are edited in, or null (Base);
    // placing: the component Place instance adds an instance of at the next click, or null
    variantMode: null, placing: null,
  };
  // The shown page's drawn nodes and Layers rows, by node id (Maps: an id is the document's string).
  let drawn = new Map();
  let layerRows = new Map();

  const setState = (s) => { document.body.dataset.state = s; };
  function showMsg(text) {
    const m = $('msg');
    m.textContent = text;
    m.hidden = false;
  }
  function hideMsg() {
    const m = $('msg');
    m.textContent = '';
    m.hidden = true;
  }
  function fail(text) {
    showMsg(text);
    setState('error');
  }

  // The doc-response frame the page needs to walk the document; the server judges the rest.
  function frameOk(b) {
    return isObj(b) && isObj(b.doc) && Array.isArray(b.doc.pages) && b.doc.pages.length > 0
      && b.doc.pages.every(isObj) && isObj(b.doc.nodes) && isObj(b.repo);
  }

  // The bar's chip: where every edit goes, and whether that place may be public (null counts as public).
  function showRepo(repo) {
    const name = typeof repo.name === 'string' && repo.name ? repo.name : null;
    const where = name === null ? "this project's repo" : name;
    const pub = name === null ? null : repo.public;
    const how = pub === true ? 'public' : pub === false ? 'private' : 'may be public';
    const chip = $('repoChip');
    const nameEl = document.createElement('span');
    nameEl.className = 'repo-name';
    nameEl.textContent = `Saved to ${where}`;
    const visEl = document.createElement('span');
    visEl.className = 'repo-vis';
    visEl.textContent = `· ${how}`;
    // the space between is text, so the chip's whole text reads `Saved to <where> · <how>`
    chip.replaceChildren(nameEl, ' ', visEl);
    chip.title = `Every edit is committed and pushed to ${where}.`;
    chip.classList.toggle('public', pub !== false);
    chip.hidden = false;
  }

  const pages = () => state.doc.pages;
  const pageById = (id) => pages().find((pg) => pg.id === id) || null;
  const pageName = (pg) => (typeof pg.name === 'string' ? pg.name : '');

  // The pages' ids and names, in order, as one string: the Pages list and the page select are rebuilt
  // only when it changes, so another person's edit leaves a focused link focused and an open picker's
  // options in place (redraw runs on every edit).
  const pagesKey = () => JSON.stringify(pages().map((pg) => [typeof pg.id === 'string' ? pg.id : '', pageName(pg)]));
  let pagesDrawn = null;
  let pageSelDrawn = null;

  // The Pages list: one link per page, by name, in order. A link that had focus has it again (its
  // page's new link), when the pages changed under it.
  function renderPages() {
    const nav = $('pages');
    const key = pagesKey();
    if (key === pagesDrawn) return;
    pagesDrawn = key;
    const a = document.activeElement;
    const focusPage = a instanceof Element && a.matches('#pages a[data-page]') ? a.dataset.page : null;
    const links = pages().map((pg) => {
      const a = document.createElement('a');
      const id = typeof pg.id === 'string' ? pg.id : '';
      a.dataset.page = id;
      a.href = `#page=${encodeURIComponent(id)}`;
      a.textContent = pageName(pg);
      return a;
    });
    nav.replaceChildren(...links);
    const back = focusPage === null ? null : links.find((l) => l.dataset.page === focusPage) || links[0] || null;
    if (back) back.focus({ preventScroll: true });
  }

  // The page <select> (the stage's page switch on a narrow screen): one option per page, by name.
  function renderPageSel() {
    const sel = $('pageSel');
    const key = pagesKey();
    if (key === pageSelDrawn) return;
    pageSelDrawn = key;
    const opts = pages().map((pg) => {
      const o = document.createElement('option');
      o.value = typeof pg.id === 'string' ? pg.id : '';
      o.textContent = pageName(pg);
      return o;
    });
    sel.replaceChildren(...opts);
  }

  // The images drawn on the page, loaded or failed: the page is ready once none is still loading.
  function imagesSettled() {
    const imgs = [...$('surface').querySelectorAll('img')].filter((img) => !img.complete);
    return Promise.all(imgs.map((img) => new Promise((r) => {
      img.addEventListener('load', r, { once: true });
      img.addEventListener('error', r, { once: true });
    })));
  }

    mark(el, id, inst);
    common(el, rootG, parentMode);
    const mode = layout(el, rootG);
    drawChildren(el, kidsOf(comp), mode, inner);
    hide(el, rootG);
    return el;
  }

  // The page's top-level nodes on #surface, each placed at its x, y.
  function drawPage(pageId) {
    const pg = pageById(pageId) || pages()[0];
    // the page's own tree, instances as one element each, counts against the budget first
    drawing = { seen: new Set(), after: [], labels: [], anchors: 0, byId: new Map(), marked: [], hidden: 0, sizes: new Map(), used: 0, capped: false };
    drawing.used = treeElements(kidsOf(pg));
    const els = [];
    for (const id of kidsOf(pg)) {
      const el = drawNode(id, 'page', null);
      if (el) els.push(el);
    }
    $('surface').replaceChildren(...els, ...drawing.labels);
    for (const f of drawing.after) { try { f(); } catch { /* a size it can't measure stays 0 */ } }
    drawn = drawing.byId;
    $('capNote').hidden = !drawing.capped;
    drawing = null;
  }

  // ---- layers, selection and the properties panel ----

  // A row's type mark: the page's own table (a frame's by its layout mode).
  const MARK = { component: '◆', instance: '◇', text: 'T', rect: '▭', ellipse: '○', vector: '✎', image: '▣' };
  const FRAME_MARK = { row: '→', column: '↓', grid: '▦', none: '#' };
  const typeOf = (n) => (typeof n.type === 'string' ? n.type : '');
  function markOf(n) {
    if (n.type === 'frame') return FRAME_MARK[pick(MODE, getPath(n, 'layout.mode'), 'none')];
    return own(MARK, typeOf(n)) ? MARK[n.type] : '?';
  }
  // A node's name, or its type when the name is empty.
  const labelOf = (n) => (typeof n.name === 'string' && n.name ? n.name : typeOf(n) || 'node');

  // The Layers tree: the shown page's nodes nested by children order, each listed once; an instance's
  // inner nodes are the component's and aren't listed. Indent by depth, a number the page works out.
  function renderLayers(pageId) {
    const pg = pageById(pageId) || pages()[0];
    const seen = new Set();
    const out = [];
    layerRows = new Map();
    const stack = kidsOf(pg).reverse().map((id) => [id, 0]);
    while (stack.length) {
      const [id, depth] = stack.pop();
      const n = nodeOf(id);
      if (!n || seen.has(id)) continue;
      seen.add(id);
      const row = document.createElement('div');
      row.className = 'layer';
      row.dataset.node = id;
      row.setAttribute('role', 'treeitem');
      row.setAttribute('aria-level', String(depth + 1));
      row.setAttribute('aria-selected', 'false');
      row.tabIndex = -1;
      row.style.paddingLeft = `${12 + Math.min(depth, 40) * 14}px`;
      const ic = document.createElement('span');
      ic.className = 'ic';
      ic.textContent = markOf(n);
      ic.title = typeOf(n);
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = labelOf(n);
      row.append(ic, nm);
      out.push(row);
      layerRows.set(id, row);
      if (CONTAINERS.has(n.type)) stack.push(...kidsOf(n).reverse().map((c) => [c, depth + 1]));
    }
    $('layers').replaceChildren(...out);
  }

  // One label and value row of the Properties panel; the value is text.
  function propRow(label, field, value) {
    const row = document.createElement('div');
    row.className = 'row';
    const k = document.createElement('span');
    k.className = 'k';
    k.textContent = label;
    const v = document.createElement('span');
    v.className = 'v';
    v.dataset.field = field;
    v.textContent = value;
    row.append(k, v);
    return row;
  }

  // The Properties panel: kit-661's read-only rows (the selected node's name and type, and for an
  // instance its component's name and variant), then, on a canvas open for editing, the fields that
  // change it (kit-662); with nothing selected, a note. The panel isn't rebuilt while a field in it has
  // focus or a press that started in it is under way: someone else's edit never takes a field from under
  // a person typing, and a click that follows a field's edit (whose change fires on that very press)
  // lands on the button it was aimed at. It is rebuilt once focus leaves the field, and after a press or
  // a click in it ends with no field focused; a button that merely has focus holds nothing, and the
  // focused control, when the new panel has it again, keeps focus.
  let propsStale = false;
  let pressing = false;
  // The colour fields set to Hex while their value isn't one (`<id> <path>`): kept until a hex is sent
  // or the selection changes, so the panel rebuilt meanwhile still shows the hex input.
  const hexChosen = new Set();
  const inProps = (x) => x instanceof Node && $('props').contains(x);
  // A field a person types or chooses in (a checkbox, like a button, holds nothing).
  const fieldFocused = () => {
    const a = document.activeElement;
    return inProps(a) && a.matches('input:not([type="checkbox"]), select, textarea');
  };

    if (holdProps()) { propsStale = true; return; }

  const controlKey = (e) => (e instanceof HTMLElement ? ['prop', 'action', 'value', 'variant'].map((k) => e.dataset[k] ?? '').join('\u0000') : null);
  function buildProps() {

    const box = $('props');
    const n = state.sel === null ? null : nodeOf(state.sel);
    if (!n) {
      const p = document.createElement('p');
      p.className = 'note';
      p.textContent = TEXT.noSelection;
      box.replaceChildren(p);
      return;
    }
    const out = [propRow('Name', 'name', typeof n.name === 'string' ? n.name : ''), propRow('Type', 'type', typeOf(n))];
    if (n.type === 'instance') {
      const comp = nodeOf(n.component);
      const compName = comp && comp.type === 'component' ? (typeof comp.name === 'string' ? comp.name : '') : 'none';
      out.push(propRow('Component', 'component', compName));
      out.push(propRow('Variant', 'variant', typeof n.variant === 'string' && n.variant ? n.variant : 'none'));

    if (state.session !== null) out.push(editFields(state.sel, n));
    box.replaceChildren(...out);
    if (was !== null && was !== '\u0000\u0000\u0000') {

      if (again && !again.disabled) again.focus({ preventScroll: true });
    }

  // After a press or a click in the panel ends: rebuilt when due, unless a field has focus.
  const settleProps = () => { if (propsStale && !pressing && !fieldFocused()) buildProps(); };
  $('props').addEventListener('pointerdown', () => { pressing = true; }, true);
  const pressEnd = () => {
    if (!pressing) return;
    // the click this press makes comes before this timer, so it reaches the control pressed
    setTimeout(() => { pressing = false; settleProps(); }, 0);

  window.addEventListener('pointercancel', pressEnd, true);
  $('props').addEventListener('click', () => { setTimeout(settleProps, 0); });
  $('props').addEventListener('focusout', () => {

    setTimeout(() => { if (propsStale && !holdProps()) buildProps(); }, 0);
  });

  // Select a node of the shown page (its row and its drawn node marked), or nothing (null). The tree
  // keeps one row in the tab order (the ARIA tree pattern): the selected row, else the first.
  function select(id) {
    const next = id !== null && layerRows.has(id) ? id : null;

  $('layers').addEventListener('click', (e) => {
    const row = e.target instanceof Element ? e.target.closest('.layer[data-node]') : null;

  // The tree by keyboard: ArrowDown and ArrowUp select the next and previous row, Home and End the first
  // and last, focus following (they are the tree's: they never nudge); Delete or Backspace deletes the

  $('layers').addEventListener('keydown', (e) => {
    if (!ready() || e.ctrlKey || e.metaKey || e.altKey) return;
    const row = e.target instanceof Element ? e.target.closest('.layer[data-node]') : null;
    if (!row || !layerRows.has(row.dataset.node)) return;

    const ids = [...layerRows.keys()];
    const i = ids.indexOf(row.dataset.node);
    const to = { ArrowDown: ids[Math.min(i + 1, ids.length - 1)], ArrowUp: ids[Math.max(i - 1, 0)], Home: ids[0], End: ids[ids.length - 1] }[e.key];
    if (to === undefined) return;
    e.preventDefault();

  // A click on the stage: the nearest drawn node with a data-id (inside an instance, the instance), or
  // on empty stage nothing. The stage's own controls are not the stage.
  $('stage').addEventListener('click', (e) => {
    if (panned) { panned = false; return; } // the click that ends a Space drag is a pan, not a click
    if (toolPress) { toolPress = false; return; } // the click that ends a tool's press made something
    if (!state.doc || e.button !== 0 || !(e.target instanceof Element)) return;
    if (e.target.closest('.zoom, .stage-top, #tools')) return;
    const hit = e.target.closest('#surface [data-id]');

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (tool !== 'move' || gesture !== null || pen !== null) { setTool('move'); return; }
    if (state.sel !== null) select(null);
  });

  // ---- zoom and pan ----

  // The view: #surface moved by translate(x, y) scale(z), origin top-left, x and y in stage px.
  const ZMIN = 0.1;
  const ZMAX = 8;
  const STEP = 1.25;
  const view = { x: 0, y: 0, z: 1 };
  let moved = false; // the person has zoomed or panned since the page was shown
  let panned = false; // the pointer press now ending was a pan
  let pan = null;
  let spaceHeld = false;

  function applyView() {
    $('surface').style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
    $('zoomPct').textContent = `${Math.round(view.z * 100)}%`;
    drawPen(); // a path being drawn follows the view
  }
  // Zoom by `factor` around the stage point (sx, sy), which stays put; z kept to [0.1, 8], so at a
  // bound the view doesn't change at all.
  function zoomTo(target, sx, sy) {
    if (!Number.isFinite(target) || target <= 0) return;
    const z = Math.min(ZMAX, Math.max(ZMIN, target));
    if (z === view.z) return;
    const k = z / view.z;
    view.x = sx - (sx - view.x) * k;
    view.y = sy - (sy - view.y) * k;
    view.z = z;
    moved = true;
    applyView();

  const zoomAt = (factor, sx, sy) => zoomTo(view.z * factor, sx, sy);
  const stageSize = () => ({ w: $('stage').clientWidth, h: $('stage').clientHeight });
  const zoomCentre = (z) => { const s = stageSize(); zoomTo(z, s.w / 2, s.h / 2); };
  // The shown page's content bounds in page px: the union of its top-level nodes' rectangles plus
  // 200 px around (contract §9), or null on a page with nothing shown.
  function contentBounds() {
    const surface = $('surface');
    const o = surface.getBoundingClientRect();
    let b = null;
    for (const el of surface.children) {
      if (!el.dataset.id || el.getClientRects().length === 0) continue;
      const r = el.getBoundingClientRect();
      const l = (r.left - o.left) / view.z;
      const t = (r.top - o.top) / view.z;
      const rr = l + r.width / view.z;
      const bb = t + r.height / view.z;
      b = b === null ? { l, t, r: rr, b: bb } : { l: Math.min(b.l, l), t: Math.min(b.t, t), r: Math.max(b.r, rr), b: Math.max(b.b, bb) };
    }
    return b && { l: b.l - 200, t: b.t - 200, r: b.r + 200, b: b.b + 200 };
  }
  // Fit: the content bounds fill the stage, at most 100%, centred.
  function fit() {
    const b = contentBounds();
    const s = stageSize();
    if (!b || s.w <= 0 || s.h <= 0) {
      Object.assign(view, { x: 0, y: 0, z: 1 });
    } else {
      const z = Math.min(1, Math.max(ZMIN, Math.min(s.w / (b.r - b.l), s.h / (b.b - b.t))));
      Object.assign(view, { z, x: (s.w - (b.r - b.l) * z) / 2 - b.l * z, y: (s.h - (b.b - b.t) * z) / 2 - b.t * z });
    }

    applyView();

  $('zoomIn').addEventListener('click', () => { if (ready()) zoomCentre(view.z * STEP); });
  $('zoomOut').addEventListener('click', () => { if (ready()) zoomCentre(view.z / STEP); });
  $('zoomFit').addEventListener('click', () => { if (ready()) fit(); });
  // a resized window (a phone turned, a panel shown or hidden at 760 px) refits, unless the person has moved
  let wasNarrow = null;
  window.addEventListener('resize', () => {
    if (narrow() && (tool !== 'move' || gesture !== null || pen !== null)) setTool('move'); // under 760 px, watch only
    // across 760 px the panel's fields are built again, usable or not
    if (narrow() !== wasNarrow) { wasNarrow = narrow(); if (ready()) renderProps(); }

  // The wheel pans; with Ctrl or ⌘ (a trackpad's pinch comes as Ctrl+wheel) it zooms around the pointer.
  $('stage').addEventListener('wheel', (e) => {

    const dx = e.deltaX * unit;
    const dy = e.deltaY * unit;

    }

    view.y -= dy;
    moved = true;
    applyView();
  }, { passive: false });

  // Dragging with the middle button, or with Space held, pans; the stage keeps the pointer meanwhile.

  const TAP_SLOP = 6; // px a touch may wander and still be a tap

  const stagePoint = (pt) => { const r = $('stage').getBoundingClientRect(); return { x: pt.x - r.left, y: pt.y - r.top }; };
  // (Re)start the touch gesture from the pointers now down: one pans, two pinch.
  function startTouch() {

    pinch = null;

    } else if (pts.length >= 2) {
      const [[ia, a], [ib, b]] = pts;
      const d = Math.hypot(b.x - a.x, b.y - a.y);

    if (pan) return;
    if (!(e.button === 1 || (e.button === 0 && spaceHeld))) return;
    e.preventDefault();
    pan = { id: e.pointerId, cx: e.clientX, cy: e.clientY, x: view.x, y: view.y };
    panned = true;
    try { $('stage').setPointerCapture(e.pointerId); } catch { /* the pan still follows moves over the stage */ }

  });
  $('stage').addEventListener('pointermove', (e) => {
    if (touches.has(e.pointerId)) {

        const z = Math.min(ZMAX, Math.max(ZMIN, pinch.z * (Math.hypot(b.x - a.x, b.y - a.y) / pinch.d)));

  // Keys: +/= zoom in, - zoom out, 0 sets 100%, Shift+1 fits (by its code, so any layout's Shift+1);
  // Space held, with the pointer over the stage, makes a drag pan. None of them while typing in a
  // field, and Space is left to a focused button or link (it presses it).
  const typing = (t) => t instanceof Element && (t.closest('input, select, textarea') !== null || (t instanceof HTMLElement && t.isContentEditable));
  const pressable = (t) => t instanceof Element && t.closest('button, a, summary, [role="button"], [role="link"]') !== null;

  document.documentElement.addEventListener('pointerleave', () => { overStage = false; });

  // ---- pages ----

  let shown = 0; // the count of showPage calls: a slower one finishing after a newer one doesn't mark it ready

  function markPage(pg) {

  }

    const pg = pageById(id) || pages()[0];
    if (pg.id !== state.pageId) state.sel = null;
    state.pageId = pg.id;
    const n = ++shown;
    markPage(pg);
    setState('loading');
    drawPage(pg.id);
    renderLayers(pg.id);
    select(state.sel);
    if (kidsOf(pg).length === 0) showMsg(TEXT.empty); else hideMsg();

    fit();
    imagesSettled().then(() => {
      if (n !== shown) return;
      if (!moved) fit();

    });

  // ---- editing (kit-662): the socket, the two copies, and the edits ----

  // What the page says when an edit is refused (by refused.why), and its other plain words.
  const REFUSED = {
    missing: 'That layer was deleted by someone else.',
    parent: "That layer can't go there.",
    cycle: "A layer can't go inside itself.",
    exists: 'That layer is already on the canvas.',
    ref: "That is still used by a component, an instance or a token, so it wasn't changed.",
    limit: "The canvas is at its size limit, so that wasn't added.",
    view: 'You can watch this canvas but not change it.',
  };

  function sizeField(id, axis, label) {

  // The font: a select of the typography tokens and Custom; choosing Custom sends the font drawn now

  const FONT_PART_OK = {

      const x = parts[k];

      ps.addEventListener('change', () => {
        const val = ps.value;
        sendPart(k, val.startsWith('@') ? { $ref: val.slice(1) } : k === 'weight' ? Number(val) : val);

    rows.push(fieldRow('Size', numInput('font#size', 'Font size', parts.size, 1, 1000, (x) => sendPart('size', x))));

  function setTool(name) {

    if (!toolsOn() || typing(e.target) || e.ctrlKey || e.metaKey || e.altKey) return;

  // Where a new (or moved) node goes for a pointer at (cx, cy): the deepest frame or component drawn

      if (exclude !== null && inSubtree(id, exclude)) continue;

      pel = el;

    const z = view.z;
    const o = (pel ?? $('surface')).getBoundingClientRect();

    const pid = parent ?? state.pageId;
    const pn = parent === null ? null : nodeOf(parent);
    const kids = (pn ? kidsOf(pn) : kidsOf(pageById(pid) || { children: [] })).filter((k) => k !== exclude);
    const mode = pn ? pick(MODE, getPath(pn, 'layout.mode'), 'none') : 'none';
    if (mode === 'none') return { parent: pid, after: kids.length ? kids[kids.length - 1] : null, x, y, free: true };
    const wrap = getPath(pn, 'layout.wrap') === true;
    let after = null;
    for (const k of kids) {
      const el = drawn.get(k);
      if (!el || el.getClientRects().length === 0) continue;
      const r = el.getBoundingClientRect();
      const mx = (r.left + r.right) / 2;
      const my = (r.top + r.bottom) / 2;
      let before;
      if (mode === 'row' && !wrap) before = mx < cx;
      else if (mode === 'column' && !wrap) before = my < cy;
      else if (mode === 'column') before = r.right <= cx || (r.left <= cx && my < cy);
      else before = r.bottom <= cy || (r.top <= cy && mx < cx);
      if (before) after = k;
    }
    return { parent: pid, after, x, y, free: false };

  // A new node of `type` at a placement, with its own properties: one add edit; then selected, and the
  // tool back to Move. The new node's id is new (newId). True when it was queued.
  function addNode(type, at, props) {

  // A press by a creating tool: followed with the pointer captured, so a release outside the stage

    g.draft.style.top = `${Math.min(g.sy, g.cy) - st.top}px`;

  // What a press made: placed by where it was pressed; a drag's box (frame, rectangle, ellipse, image)
  // gives its top-left and its size, in page px.
  function make(g) {

      ? { at: { ...at, x: at.x + (Math.min(g.sx, g.cx) - g.sx) / z, y: at.y + (Math.min(g.sy, g.cy) - g.sy) / z }, w: Math.abs(g.cx - g.sx) / z, h: Math.abs(g.cy - g.sy) / z }

      case 'rect':
      case 'ellipse':

      }
      default:
    }
  }

    const { dx, dy } = moveBy(g);

  }

  // Arrow keys nudge the selected node placed by x, y: 1 px, 10 with Shift; one set each, so held keys

  const ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };

  // ---- the image: posted, then added under the src the server answers ----
  $('imageFile').addEventListener('cancel', () => { placing = null; });

      const body = JSON.stringify({ name: uploadName(file.name), data: btoa(bin) });

  // ---- the pen: a click per point; Enter or a double-click ends the path, Escape drops it ----
  function penPoint(cx, cy) {

    const keep = [];
    let before = 0;
    state.pending.forEach((e, i) => { if (!drop(e)) keep.push(e); else if (i < sock.cursor) before += 1; });
    state.pending = keep;
    sock.cursor -= before;
  }

  function message(data) {
    let m;
    try { m = JSON.parse(data); } catch { return; }
    if (!isObj(m) || typeof m.t !== 'string' || !state.base) return;
    if (m.t === 'welcome') welcome(m);
    else if (m.t === 'ops') { if (Number.isSafeInteger(m.rev)) { m.via = sock.session; ops(m); } }
    else if (m.t === 'refused') refused(m);
    else if (m.t === 'saved') { if (Number.isSafeInteger(m.rev)) saved(m); }
    else if (m.t === 'ping') send({ t: 'pong' });
    else if (m.t === 'paused') { state.paused = true; showBanner(); }
    else if (m.t === 'resumed') { state.paused = false; showBanner(); }
    else if (m.t === 'closed') lock('closed', m.why === 'landed' ? BANNER.landed : BANNER.removed);
    else if (m.t === 'reload') {
      // the document replaced whole, a new session on this socket: the frames held from before it are
      // the old session's (their acks no longer count, so those edits stay pending and are resent), and
      // the document is fetched again; a fetch already running is superseded (its answer thrown away)
      if (typeof m.session !== 'string') return;
      sock.session = m.session;
      sock.held = [];
      sock.epoch += 1;
      refetch();
    }
    // any other kind is ignored
  }
  // welcome: on the session loaded and at base's rev, send again what was sent and not acked, then the
  // rest; on any other (a new session, a rev below the highest seen, or edits made while away, which the
  // socket doesn't replay), fetch the document first (the fetch then resends kept on a new session).
  function welcome(m) {
    sock.session = m.session;
    if (m.session === state.session && Number.isSafeInteger(m.rev) && m.rev < sock.highest) {
      sock.lowered = true;
      sock.held = []; // their revs are gone
    }
    if (Number.isSafeInteger(m.rev)) sock.highest = Math.max(sock.highest, m.rev);
    sock.live = true;
    sock.down = false;
    sock.tries = 0;
    sock.cursor = 0;
    showBanner();
    syncBody();
    if (!sock.stale && !sock.lowered && m.session === state.session && m.rev === state.base.rev) pump();
    else refetch();
  }
  // ops: applied to base when it is the next rev (dropped at or below base's rev; one missed fetches
  // the document); this page's own ack drops that edit, and any earlier one, from pending.
  function ops(m) {
    if (sock.fetching) { sock.held.push(m); return; }
    takeOps(m);
    redraw();
    pump();
  }
  function takeOps(m) {
    if (m.rev > state.base.rev + 1) { sock.held.push(m); refetch(); return; }
    if (m.via === sock.session) sock.highest = Math.max(sock.highest, m.rev);
    if (m.rev === state.base.rev + 1) {
      applyOps(state.base, m.ops);
      state.base.rev = m.rev;
    }
    const ack = m.ack;
    if (isObj(ack) && ack.client === CLIENT && Number.isSafeInteger(ack.seq)) {
      const acked = [];
      dropPending((e) => { const hit = e.seq !== null && e.seq <= ack.seq; if (hit) acked.push(e); return hit; });
      for (const e of acked) { e.rev = m.rev; e.session = m.via; state.kept.push(e); }
      if (state.kept.length > KEPT_MAX) {
        state.kept.splice(0, state.kept.length - KEPT_MAX);
        say(SAY.notSaved);
      }
    }
  }
  // saved: the socket's session's kept edits at or below its rev are on disk; another session's stay.
  function saved(m) {
    state.saved = m.rev;
    state.kept = state.kept.filter((e) => e.session !== sock.session || e.rev > m.rev);
    syncBody();
  }
  // A refused edit's undo entry goes with it (kit-668 §3; no undo entries yet).
  function dropEntryOf() {}
  // refused, for this page: that edit dropped (from pending, or kept should a resent one be refused) and
  // why said in plain words; then the document fetched again (canvas@1 §5), the other pending edits
  // drawn over it and sent after it.
  function refused(m) {
    if (m.client !== CLIENT || !Number.isSafeInteger(m.seq)) return;
    const gone = [];
    dropPending((e) => { const hit = e.seq === m.seq; if (hit) gone.push(e); return hit; });
    state.kept = state.kept.filter((e) => { const hit = e.seq === m.seq; if (hit) gone.push(e); return !hit; });
    for (const e of gone) dropEntryOf(e);
    const why = typeof m.why === 'string' && own(REFUSED, m.why) ? m.why : null;
    say(why === null ? NOT_VALID : REFUSED[why]);
    if (why === 'view') lock('view');
    redraw();
    refetch();
  }
  const bySeq = (a, b) => a.seq - b.seq;
  // The document fetched again as base (its session too); the ops held meanwhile applied after it, in
  // order, those above its rev. A fetch that fails closes the socket, and the next welcome fetches. When
  // the fetched session isn't the one base had (a restart or a replace), or a welcome came at a lower
  // rev, kept goes back in front of pending, in seq order; pending is then sent from the start either way
  // (a same-session resend is re-acked). A fetch a reload came during is thrown away, failed or not, and
  // asked again at once.
  async function refetch() {
    if (sock.fetching) { sock.again = true; return; }
    sock.fetching = true;
    sock.again = false;
    const epoch = sock.epoch;
    const before = state.session;
    let b = null;
    try {
      const res = await fetch(`/api/canvas/doc?slug=${encodeURIComponent(state.slug)}`, { credentials: 'same-origin', cache: 'no-store' });
      if (res.status === 200) {
        const j = await res.json();
        if (frameOk(j)) b = j;
      }
    } catch { b = null; }
    sock.fetching = false;
    if (epoch !== sock.epoch) { refetch(); return; }
    if (b === null) {
      sock.held = [];
      sock.stale = true;
      if (sock.ws) sock.ws.close();
      return;
    }
    sock.stale = false;
    takeDoc(b);
    if (state.session !== before || sock.lowered) {
      state.pending = [...state.kept.sort(bySeq), ...state.pending];
      state.kept = [];
      sock.lowered = false;
      sock.highest = state.base.rev;
    }
    sock.cursor = 0;
    // frames of another session than the one fetched are dropped: their acks don't count there
    for (const m of sock.held.splice(0)) {
      if (m.via !== state.session) continue;
      if (sock.fetching) sock.held.push(m); else takeOps(m);
    }
    if (sock.again && !sock.fetching) refetch();
    redraw();
    pump();
  }

  async function start() {
    setState('loading');
    const m = /^\/view\/canvas\/([^/]*)$/.exec(location.pathname);
    const slug = m ? m[1] : '';
    if (!SLUG_RE.test(slug)) return fail(TEXT.notAddress);
    state.slug = slug;
    $('title').textContent = slug;
    document.title = `${slug} · canvas`;
    let res;
    try {
      res = await fetch(`/api/canvas/doc?slug=${encodeURIComponent(slug)}`, { credentials: 'same-origin', cache: 'no-store' });
    } catch {
      return fail(TEXT.notLoaded);
    }
    if (res.status === 404) return fail(TEXT.notOpen);
    const withStatus = `${TEXT.notLoaded} (${res.status})`;
    if (res.status !== 200) return fail(withStatus);
    let body;
    try { body = await res.json(); } catch { return fail(withStatus); }
    if (!frameOk(body)) return fail(withStatus);
    takeDoc(body);
    state.doc = state.base;
    showRepo(body.repo);
    renderPages();
    renderPageSel();
    showPage(hashPage());
    syncBody();
    // main's copy (session null) is read-only: no socket, no editing
    if (state.session !== null) connect();
  }

  start().catch(() => fail(TEXT.notLoaded));
})();
</script>
