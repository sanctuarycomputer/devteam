<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas</title>
<!-- The canvas editor (kit-661): a canvas-doc@1 document read from GET /api/canvas/doc and drawn as
     plain DOM. Its own HTML, CSS and one script; nothing from another origin. The document is data:
     text goes in with textContent, every style value through a checker and one CSSOM property. -->
<style>
  /* the dashboard's tokens (devteam-ui tokens), with the system font stacks: this page loads no font */
  :root {
    color-scheme: light;
    --bg: #fafafa; --surface: #ffffff; --raised: #ffffff; --hover: #f2f2f2; --well: #f2f2f2;
    --fg: #171717; --fg-2: #666666; --muted: #8f8f8f; --line: #ebebeb; --line-2: #dcdcdc;
    --blue: #0070f3; --blue-fg: #0068d6; --red: #ee0000; --red-fg: #cb2a2f; --amber: #f5a623; --amber-fg: #a35200; --green: #45a557; --green-fg: #297a3a;
    --shadow: 0 1px 2px rgba(0,0,0,.04);
    --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --serif: ui-serif, Georgia, Cambria, 'Times New Roman', serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    /* this page's own */
    --stage: #ececec; --amber-bg: #fff4e5; --sel: #0070f3;
    --bar-h: 49px; --left-w: 240px; --right-w: 300px;
    /* running text: six of twelve columns at 1440 (the dashboard's devteam-layout measure) */
    --measure: calc((1200px - 2 * 32px - 11 * 16px) / 2 + 5 * 16px);
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --bg: #000000; --surface: #0a0a0a; --raised: #111111; --hover: #1a1a1a; --well: #111111;
    --fg: #ededed; --fg-2: #a1a1a1; --muted: #7d7d7d; --line: #1f1f1f; --line-2: #2e2e2e;
    --blue: #52a8ff; --blue-fg: #52a8ff; --red: #ff6166; --red-fg: #ff6166; --amber: #ffb224; --amber-fg: #ffb224; --green: #3cd58c; --green-fg: #62c073;
    --shadow: none;
    --stage: #161616; --amber-bg: #2a1d05; --sel: #52a8ff;
  } }

  * { box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); }
  body { margin: 0; color: var(--fg); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  [hidden] { display: none !important; }
  button { font: inherit; font-size: 12px; font-weight: 500; height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); cursor: pointer; }
  button:hover { background: var(--hover); }
  select { font: inherit; font-size: 12px; color: var(--fg); background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px; height: 28px; padding: 0 8px; min-width: 0; }

  /* the bar */
  .bar { height: var(--bar-h); display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--surface); position: relative; z-index: 5; }
  .bar .back { color: var(--fg-2); text-decoration: none; white-space: nowrap; }
  .bar .back:hover { color: var(--fg); }
  .bar h1 { font-size: 14px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .bar .where { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .bar .grow { flex: 1; }
  .chip { font-size: 11px; height: 24px; padding: 0 8px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg-2); display: inline-flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .chip.public { color: var(--amber-fg); border-color: var(--amber-fg); background: var(--amber-bg); }

  /* the three columns */
  .work { position: absolute; top: var(--bar-h); left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: var(--left-w) minmax(0, 1fr) var(--right-w); }
  .panel { background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; min-height: 0; }
  .panel.right { border-right: 0; border-left: 1px solid var(--line); }
  .ptitle { font: 500 11px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 14px 12px 8px; margin: 0; }
  .pages a { display: block; padding: 5px 12px; color: var(--fg-2); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pages a:hover { background: var(--hover); }
  .pages a[aria-current="page"] { color: var(--fg); background: var(--well); }
  .layers { padding-bottom: 20px; }
  .layer { display: flex; align-items: center; gap: 6px; height: 26px; padding-right: 8px; color: var(--fg-2); cursor: pointer; white-space: nowrap; font-size: 12px; }
  .layer:hover { background: var(--hover); }
  .layer[aria-selected="true"] { background: color-mix(in srgb, var(--sel) 14%, transparent); color: var(--fg); }
  .layer .ic { width: 14px; text-align: center; color: var(--muted); font-family: var(--mono); font-size: 10px; flex: none; }
  .layer .nm { overflow: hidden; text-overflow: ellipsis; }
  .props { padding: 0 12px 24px; }
  .props .row { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; align-items: baseline; margin: 8px 0; font-size: 12px; }
  .props .row .k { color: var(--fg-2); }
  .props .row .v { overflow-wrap: anywhere; max-width: var(--measure); }
  .note { font-size: 12px; color: var(--fg-2); margin: 8px 0; max-width: var(--measure); }

  /* the stage: the page surface is the one element zoom and pan move */
  .stage { position: relative; background: var(--stage); overflow: hidden; min-width: 0; touch-action: none; }
  #surface { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .zoom { position: absolute; right: 12px; top: 12px; display: flex; gap: 4px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; z-index: 3; }
  .zoom .pct { font-size: 12px; width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
  .stage-top { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; z-index: 3; max-width: calc(100% - 24px); }
  #pageSel, #narrowNote { display: none; }
  #narrowNote { font-size: 12px; color: var(--fg-2); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; margin: 0; max-width: var(--measure); }
  #msg { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); margin: 0; padding: 0 16px; width: max-content; max-width: min(var(--measure), 100%); color: var(--fg-2); text-align: center; z-index: 2; }
  body[data-state="error"] #surface, body[data-state="error"] .zoom { display: none; }

  /* the design being drawn keeps its own colours, light or dark */
  .dnode { margin: 0; }
  img.dnode, svg.dnode { display: block; }
  .dnode.sel { outline: 2px solid var(--sel); }
  /* a node that can't be drawn: a dashed box with its name */
  .placeholder { border: 1px dashed #8f8f8f; color: #666666; font: 11px/1.4 var(--sans); padding: 2px 6px; min-width: 24px; min-height: 18px; white-space: nowrap; background: transparent; }
  /* a component's label: stage chrome above its box, placed by CSS anchor positioning */
  .clabel { position: absolute; left: anchor(left); bottom: anchor(top); margin-bottom: 4px; font: 500 11px/1 var(--sans); color: var(--sel); white-space: nowrap; pointer-events: none; }
</style>
</head>
<body data-state="loading">
<header class="bar">
  <a class="back" href="/#library">&larr; Library</a>
  <h1 id="title"></h1>
  <span class="where">canvas</span>
  <span class="grow"></span>
  <span class="chip" id="repoChip" hidden></span>
</header>
<main class="work">
  <aside class="panel left">
    <h2 class="ptitle">Pages</h2>
    <nav class="pages" id="pages" aria-label="Pages"></nav>
    <h2 class="ptitle">Layers</h2>
    <div class="layers" id="layers" role="tree" aria-label="Layers"></div>
  </aside>
  <section class="stage" id="stage" aria-label="Canvas">
    <div id="surface"></div>
    <div class="stage-top">
      <select id="pageSel" aria-label="Page"></select>
      <p id="narrowNote">Watching: editing needs a wider screen.</p>
    </div>
    <div class="zoom">
      <button id="zoomOut" type="button" aria-label="Zoom out">&minus;</button>
      <span class="pct" id="zoomPct">100%</span>
      <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
      <button id="zoomFit" type="button">Fit</button>
    </div>
    <p id="msg" role="status" hidden></p>
  </section>
  <aside class="panel right">
    <h2 class="ptitle">Properties</h2>
    <div class="props" id="props"><p class="note">Select a layer to see what it is.</p></div>
  </aside>
</main>
<script>
'use strict';
(() => {
  const SLUG_RE = /^[a-z][a-z0-9]*(-[a-z0-9]+)*$/;
  const TEXT = {
    notAddress: "This isn't a canvas address.",
    notOpen: "This canvas isn't open for editing.",
    notLoaded: "This canvas couldn't be loaded.",
    empty: 'This page is empty.',
    noSelection: 'Select a layer to see what it is.',
  };
  const $ = (id) => document.getElementById(id);
  const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
  const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

  // What the page holds: the slug, the response's session and rev (kit-662 and kit-668 use them), the
  // document, and the page shown.
  const state = { slug: null, session: null, rev: null, doc: null, repo: null, pageId: null, sel: null };
  // The shown page's drawn nodes and Layers rows, by node id (Maps: an id is the document's string).
  let drawn = new Map();
  let layerRows = new Map();

  const setState = (s) => { document.body.dataset.state = s; };
  function showMsg(text) {
    const m = $('msg');
    m.textContent = text;
    m.hidden = false;
  }
  function hideMsg() {
    const m = $('msg');
    m.textContent = '';
    m.hidden = true;
  }
  function fail(text) {
    showMsg(text);
    setState('error');
  }

  // The doc-response frame the page needs to walk the document; the server judges the rest.
  function frameOk(b) {
    return isObj(b) && isObj(b.doc) && Array.isArray(b.doc.pages) && b.doc.pages.length > 0
      && b.doc.pages.every(isObj) && isObj(b.doc.nodes) && isObj(b.repo);
  }

  // The bar's chip: where every edit goes, and whether that place may be public (null counts as public).
  function showRepo(repo) {
    const name = typeof repo.name === 'string' && repo.name ? repo.name : null;
    const where = name === null ? "this project's repo" : name;
    const pub = name === null ? null : repo.public;
    const how = pub === true ? 'public' : pub === false ? 'private' : 'may be public';
    const chip = $('repoChip');
    chip.textContent = `Saved to ${where} · ${how}`;
    chip.title = `Every edit is committed and pushed to ${where}.`;
    chip.classList.toggle('public', pub !== false);
    chip.hidden = false;
  }

  const pages = () => state.doc.pages;
  const pageById = (id) => pages().find((pg) => pg.id === id) || null;
  const pageName = (pg) => (typeof pg.name === 'string' ? pg.name : '');

  // The Pages list: one link per page, by name, in order.
  function renderPages() {
    const nav = $('pages');
    const links = pages().map((pg) => {
      const a = document.createElement('a');
      const id = typeof pg.id === 'string' ? pg.id : '';
      a.dataset.page = id;
      a.href = `#page=${encodeURIComponent(id)}`;
      a.textContent = pageName(pg);
      return a;
    });
    nav.replaceChildren(...links);
  }

  // The page <select> (the stage's page switch on a narrow screen): one option per page, by name.
  function renderPageSel() {
    const sel = $('pageSel');
    const opts = pages().map((pg) => {
      const o = document.createElement('option');
      o.value = typeof pg.id === 'string' ? pg.id : '';
      o.textContent = pageName(pg);
      return o;
    });
    sel.replaceChildren(...opts);
  }

  // The images drawn on the page, loaded or failed: the page is ready once none is still loading.
  function imagesSettled() {
    const imgs = [...$('surface').querySelectorAll('img')].filter((img) => !img.complete);
    return Promise.all(imgs.map((img) => new Promise((r) => {
      img.addEventListener('load', r, { once: true });
      img.addEventListener('error', r, { once: true });
    })));
  }

  // ---- checkers: every style value comes from one of these, never a document string passed through ----

  const HEX_RE = /^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i;
  const HEX6_RE = /^#[0-9a-f]{6}$/i;
  const SRC_RE = /^images\/([0-9a-f]{16}\.(?:png|jpg|webp|gif))$/;
  const FR_RE = /^([1-9][0-9]{0,2})fr$/;
  const finite = (v) => typeof v === 'number' && Number.isFinite(v);
  const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
  const isRef = (v) => isObj(v) && Object.keys(v).length === 1 && typeof v.$ref === 'string';
  // The page's own tables: a document word is looked up here, never passed through.
  const FAMILY = {
    sans: "ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif",
    serif: "ui-serif, Georgia, Cambria, 'Times New Roman', serif",
    mono: 'ui-monospace, SFMono-Regular, Menlo, monospace',
  };
  const MODE = { none: 'none', row: 'row', column: 'column', grid: 'grid' };
  const ALIGN = { start: 'flex-start', center: 'center', end: 'flex-end', stretch: 'stretch' };
  const JUSTIFY = { start: 'flex-start', center: 'center', end: 'flex-end', between: 'space-between' };
  const TEXT_ALIGN = { left: 'left', center: 'center', right: 'right', justify: 'justify' };
  const FIT = { cover: 'cover', contain: 'contain', fill: 'fill' };
  const pick = (table, v, dflt) => (typeof v === 'string' && own(table, v) ? table[v] : table[dflt]);

  // The token a $ref names ({ $type, $value }), or null: one step, no aliases (contract §2 Tokens).
  function token(v) {
    if (!isRef(v)) return null;
    let at = isObj(state.doc.tokens) ? state.doc.tokens : null;
    for (const seg of v.$ref.split('.')) {
      if (!isObj(at) || !own(at, seg)) return null;
      at = at[seg];
    }
    return isObj(at) && own(at, '$type') && own(at, '$value') ? at : null;
  }
  // A colour token's value as CSS the page builds: its hex, or else rgb() from its components and alpha.
  function colorToken(x) {
    if (!isObj(x)) return null;
    if (typeof x.hex === 'string' && HEX6_RE.test(x.hex)) return x.hex;
    const c = x.components;
    if (!Array.isArray(c) || c.length !== 3 || !c.every((n) => finite(n) && n >= 0 && n <= 1)) return null;
    const a = own(x, 'alpha') ? x.alpha : 1;
    if (!finite(a) || a < 0 || a > 1) return null;
    const [r, g, b] = c.map((n) => Math.round(n * 255));
    return `rgb(${r} ${g} ${b} / ${a})`;
  }
  // A $ref's literal value (of `type` when given), or undefined when it doesn't resolve.
  function ref(v, type) {
    const tk = token(v);
    if (!tk || (type && tk.$type !== type)) return undefined;
    const x = tk.$value;
    switch (tk.$type) {
      case 'color': return colorToken(x) ?? undefined;
      case 'dimension': return isObj(x) && x.unit === 'px' && finite(x.value) ? x.value : undefined;
      case 'fontFamily': case 'fontWeight': case 'number': return x;
      case 'typography': return isObj(x) ? x : undefined;
      default: return undefined;
    }
  }
  // A colour (a hex, or a colour token), or null.
  function color(v) {
    if (isRef(v)) return ref(v, 'color') ?? null;
    return typeof v === 'string' && HEX_RE.test(v) ? v : null;
  }
  // A finite number (or, with `type`, a token of that type) clamped to [min, max], or null.
  function num(v, min, max, type = 'dimension') {
    const x = isRef(v) ? (type ? ref(v, type) : undefined) : v;
    return finite(x) ? clamp(x, min, max) : null;
  }
  // 'hug', 'fill' or a fixed px size; anything else is the default, 'hug'.
  function sizing(v) {
    if (v === 'hug' || v === 'fill') return v;
    const n = num(v, 0, 100000);
    return n === null ? 'hug' : n;
  }
  // A CSS track list rebuilt from px, `auto` and `<n>fr`; '' for an empty list or one out of its class.
  function tracks(v) {
    if (!Array.isArray(v) || v.length > 64) return '';
    const out = [];
    for (const t of v) {
      if (finite(t) && t >= 0 && t <= 100000) out.push(`${t}px`);
      else if (t === 'auto') out.push('auto');
      else if (typeof t === 'string' && FR_RE.test(t)) out.push(`${Number(FR_RE.exec(t)[1])}fr`);
      else return '';
    }
    return out.join(' ');
  }
  // A whole font: a typography token, or the four fields each a literal or a token; each field that
  // fails its check takes its default.
  function font(v) {
    const out = { family: FAMILY.sans, size: 16, weight: 400, lineHeight: 1.4 };
    let fam; let size; let weight; let lh;
    if (isRef(v)) {
      const t = ref(v, 'typography');
      if (!t) return out;
      fam = t.fontFamily;
      size = isObj(t.fontSize) && t.fontSize.unit === 'px' ? t.fontSize.value : undefined;
      weight = t.fontWeight;
      lh = t.lineHeight;
    } else if (isObj(v)) {
      fam = isRef(v.family) ? ref(v.family, 'fontFamily') : v.family;
      size = isRef(v.size) ? ref(v.size, 'dimension') : v.size;
      weight = isRef(v.weight) ? ref(v.weight, 'fontWeight') : v.weight;
      lh = isRef(v.lineHeight) ? ref(v.lineHeight, 'number') : v.lineHeight;
    } else return out;
    if (typeof fam === 'string' && own(FAMILY, fam)) out.family = FAMILY[fam];
    if (finite(size) && size >= 1 && size <= 1000) out.size = size;
    if (finite(weight) && weight >= 100 && weight <= 900 && weight % 100 === 0) out.weight = weight;
    if (finite(lh) && lh >= 0.5 && lh <= 10) out.lineHeight = lh;
    return out;
  }
  // The contract's pathData grammar: optional whitespace, a move, then commands and numbers separated
  // by whitespace and at most one comma (none leading, none trailing, never two in a row); at most
  // 65536 bytes. A scan with a sticky number pattern, so a long path costs linear time and no regular
  // expression backtracks over the whole string.
  const PATH_NUM = /[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/y;
  const PATH_CMD = 'MLHVCSQTAZmlhvcsqtaz';
  const PATH_WS = ' \t\n\r\f';
  function pathOk(s) {
    if (typeof s !== 'string' || s.length > 65536) return false;
    let i = 0;
    const n = s.length;
    const ws = () => { while (i < n && PATH_WS.includes(s[i])) i++; };
    ws();
    if (s[i] !== 'M' && s[i] !== 'm') return false;
    i++;
    for (;;) {
      ws();
      let comma = false;
      if (s[i] === ',') { comma = true; i++; ws(); }
      if (i >= n) return !comma;
      if (PATH_CMD.includes(s[i])) { i++; continue; }
      PATH_NUM.lastIndex = i;
      if (!PATH_NUM.test(s)) return false;
      i = PATH_NUM.lastIndex;
    }
  }
  // The image route's file for an `images/<16 hex>.<ext>` src, or null.
  function imageFile(src) {
    const m = typeof src === 'string' ? SRC_RE.exec(src) : null;
    return m ? m[1] : null;
  }

  // ---- the document's nodes ----

  const COMMON = ['name', 'visible', 'opacity', 'x', 'y', 'size.w', 'size.h'];
  const STROKE = ['fill', 'stroke', 'strokeWidth'];
  const BOX = [...STROKE, 'radius', 'clip', 'layout.mode', 'layout.gap', 'layout.padding', 'layout.align',
    'layout.justify', 'layout.wrap', 'layout.columns', 'layout.rows'];
  // Per type, the plain properties an instance resolves (contract §2 Properties).
  const PATHS = {
    frame: [...COMMON, ...BOX], component: [...COMMON, ...BOX],
    text: [...COMMON, 'text', 'font', 'color', 'align'],
    rect: [...COMMON, ...STROKE, 'radius'], ellipse: [...COMMON, ...STROKE],
    vector: [...COMMON, 'path', ...STROKE], image: [...COMMON, 'src', 'fit', 'radius'],
    instance: [...COMMON, 'component', 'variant'],
  };
  // An instance's own stored properties, over its component root's.
  const INSTANCE_OWN = new Set(COMMON);
  const CONTAINERS = new Set(['frame', 'component']);
  const MAX_DEPTH = 20;
  const SVG_NS = 'http://www.w3.org/2000/svg';

  const nodeOf = (id) => (typeof id === 'string' && own(state.doc.nodes, id) && isObj(state.doc.nodes[id]) ? state.doc.nodes[id] : null);
  const kidsOf = (x) => (Array.isArray(x.children) ? x.children.filter((c) => typeof c === 'string') : []);
  function getPath(o, path) {
    let at = o;
    for (const k of path.split('.')) {
      if (!isObj(at) || !own(at, k)) return undefined;
      at = at[k];
    }
    return at;
  }

  // An instance's component tree, resolved (contract §2 "Resolution order", as the fake's resolve):
  // per descendant, its stored values, then a prop's default aimed at it, then the chosen variant's
  // override, then the instance's override, then the instance's prop value; the last present wins.
  // A value not stored anywhere stays absent, so it takes its default when drawn.
  function resolveInstance(inst, comp) {
    const out = new Map();
    const stack = kidsOf(comp).reverse();
    while (stack.length) {
      const id = stack.pop();
      if (out.has(id)) continue;
      const n = nodeOf(id);
      if (!n || !own(PATHS, n.type)) continue;
      const vals = Object.create(null);
      for (const path of PATHS[n.type]) {
        const v = getPath(n, path);
        if (v !== undefined) vals[path] = v;
      }
      out.set(id, vals);
      if (CONTAINERS.has(n.type)) stack.push(...kidsOf(n).reverse());
    }
    const set = (id, prop, v) => { if (typeof id === 'string' && out.has(id) && typeof prop === 'string') out.get(id)[prop] = v; };
    const each = (m, f) => { if (isObj(m)) for (const k of Object.keys(m)) f(k, m[k]); };
    const props = isObj(comp.props) ? comp.props : {};
    each(props, (_, pd) => { if (isObj(pd) && isObj(pd.target)) set(pd.target.id, pd.target.prop, pd.default); });
    const variant = typeof inst.variant === 'string' && isObj(comp.variants) && own(comp.variants, inst.variant) ? comp.variants[inst.variant] : null;
    each(variant, (id, o) => each(o, (prop, v) => set(id, prop, v)));
    each(inst.overrides, (id, o) => each(o, (prop, v) => set(id, prop, v)));
    each(inst.props, (name, v) => {
      const pd = own(props, name) ? props[name] : null;
      if (isObj(pd) && isObj(pd.target)) set(pd.target.id, pd.target.prop, v);
    });
    return out;
  }

  // ---- drawing ----

  // One drawing of a page: the ids drawn (per instance), work to do once the tree is attached, and the
  // components' labels.
  let drawing = null;

  function mark(el, id, inst) {
    el.classList.add('dnode');
    if (inst) { el.dataset.of = inst.id; el.dataset.src = id; } else { el.dataset.id = id; drawing.byId.set(id, el); }
  }

  // One side's size: px, `hug` (the content's size) or `fill` (by the parent's layout).
  function size(el, axis, s, parentMode) {
    const prop = axis === 'w' ? 'width' : 'height';
    const flex = parentMode === 'row' || parentMode === 'column';
    const mainAxis = flex && (parentMode === 'row') === (axis === 'w');
    if (typeof s === 'number') {
      el.style[prop] = `${s}px`;
      if (mainAxis) el.style.flexShrink = '0';
      return;
    }
    if (s === 'fill') {
      if (flex) {
        if (mainAxis) el.style.flex = '1 1 0px'; else el.style.alignSelf = 'stretch';
        return;
      }
      if (parentMode === 'none') { el.style[prop] = '100%'; return; }
      if (parentMode === 'grid') { el.style[axis === 'w' ? 'justifySelf' : 'alignSelf'] = 'stretch'; return; }
      // at a page's top level, fill acts as hug
    }
    if (flex) return;
    if (parentMode === 'grid') { el.style[axis === 'w' ? 'justifySelf' : 'alignSelf'] = 'start'; return; }
    el.style[prop] = 'max-content';
  }

  // What every type has: visibility, opacity, placement under a `none` parent, size.
  function common(el, g, parentMode, { hugLater = false } = {}) {
    const o = num(g('opacity'), 0, 1, null);
    if (o !== null && o !== 1) el.style.opacity = String(o);
    if (parentMode === 'none' || parentMode === 'page') {
      el.style.position = 'absolute';
      el.style.left = `${num(g('x'), -100000, 100000) ?? 0}px`;
      el.style.top = `${num(g('y'), -100000, 100000) ?? 0}px`;
    }
    const sides = [];
    for (const axis of ['w', 'h']) {
      const s = sizing(g(`size.${axis}`));
      if (hugLater && (s === 'hug' || (s === 'fill' && parentMode === 'page'))) {
        el.style[axis === 'w' ? 'width' : 'height'] = '0px';
        sides.push(axis);
      } else size(el, axis, s, parentMode);
    }
    return sides;
  }
  function hide(el, g) { if (g('visible') === false) el.style.display = 'none'; }

  function paint(el, g) {
    const f = color(g('fill'));
    if (f) el.style.backgroundColor = f;
    const s = color(g('stroke'));
    const w = num(g('strokeWidth'), 0, 100000);
    if (s && w) el.style.boxShadow = `inset 0 0 0 ${w}px ${s}`;
  }
  function radius(el, g) {
    const r = num(g('radius'), 0, 100000);
    if (r) el.style.borderRadius = `${r}px`;
  }

  // A frame's or a component's box and layout; returns its children's layout mode.
  function layout(el, g) {
    const mode = pick(MODE, g('layout.mode'), 'none');
    if (mode === 'row' || mode === 'column') {
      el.style.display = 'flex';
      el.style.flexDirection = mode;
      if (g('layout.wrap') === true) el.style.flexWrap = 'wrap';
    } else if (mode === 'grid') {
      el.style.display = 'grid';
      el.style.gridTemplateColumns = tracks(g('layout.columns')) || 'auto';
      const rows = tracks(g('layout.rows'));
      if (rows) el.style.gridTemplateRows = rows;
    } else if (el.style.position !== 'absolute') el.style.position = 'relative';
    if (mode !== 'none') {
      const gap = num(g('layout.gap'), 0, 100000);
      if (gap) el.style.gap = `${gap}px`;
      el.style.alignItems = pick(ALIGN, g('layout.align'), 'start');
      el.style.justifyContent = pick(JUSTIFY, g('layout.justify'), 'start');
    }
    const pad = g('layout.padding');
    if (Array.isArray(pad) && pad.length === 4) {
      const [t, r, b, l] = pad.map((v) => num(v, 0, 100000) ?? 0);
      el.style.padding = `${t}px ${r}px ${b}px ${l}px`;
    }
    paint(el, g);
    radius(el, g);
    if (g('clip') === true) el.style.overflow = 'hidden';
    return mode;
  }

  function placeholder(id, g, parentMode, inst) {
    const el = document.createElement('div');
    mark(el, id, inst);
    el.classList.add('placeholder');
    const name = g('name');
    el.textContent = typeof name === 'string' ? name : '';
    try { common(el, g, parentMode); } catch { /* a placeholder needs no size */ }
    return el;
  }

  // The getter of one node's values: inside an instance, its resolved values; else what it stores.
  function getter(id, n, inst) {
    if (inst && inst.values.has(id)) {
      const vals = inst.values.get(id);
      return (p) => vals[p];
    }
    return (p) => getPath(n, p);
  }

  // One node as DOM, or null when it is missing or already drawn on this page (in this instance).
  // inst: null, or { id, values, key, depth } for the instance whose component's tree this is in.
  function drawNode(id, parentMode, inst) {
    const key = `${inst ? inst.key : ''}/${id}`;
    if (drawing.seen.has(key)) return null;
    const n = nodeOf(id);
    if (!n) return null;
    drawing.seen.add(key);
    const g = getter(id, n, inst);
    try {
      return drawOne(id, n, g, parentMode, inst);
    } catch {
      return placeholder(id, g, parentMode, inst);
    }
  }

  function drawChildren(el, kids, mode, inst) {
    for (const c of kids) {
      const child = drawNode(c, mode, inst);
      if (child) el.append(child);
    }
  }

  function drawOne(id, n, g, parentMode, inst) {
    let el;
    switch (n.type) {
      case 'frame':
      case 'component': {
        el = document.createElement('div');
        mark(el, id, inst);
        common(el, g, parentMode);
        const mode = layout(el, g);
        drawChildren(el, kidsOf(n), mode, inst);
        if (n.type === 'component' && !inst && g('visible') !== false) {
          const anchor = `--canvas-component-${++drawing.anchors}`;
          el.style.anchorName = anchor;
          const lab = document.createElement('div');
          lab.className = 'clabel';
          const name = g('name');
          lab.textContent = typeof name === 'string' && name ? name : 'Component';
          lab.style.positionAnchor = anchor;
          drawing.labels.push(lab);
        }
        break;
      }
      case 'text': {
        el = document.createElement('div');
        mark(el, id, inst);
        common(el, g, parentMode);
        const t = g('text');
        el.textContent = typeof t === 'string' ? t : '';
        el.style.whiteSpace = 'pre-wrap';
        const f = font(g('font'));
        el.style.fontFamily = f.family;
        el.style.fontSize = `${f.size}px`;
        el.style.fontWeight = String(f.weight);
        el.style.lineHeight = String(f.lineHeight);
        el.style.color = color(g('color')) ?? '#000000';
        el.style.textAlign = pick(TEXT_ALIGN, g('align'), 'left');
        break;
      }
      case 'rect':
      case 'ellipse':
        el = document.createElement('div');
        mark(el, id, inst);
        common(el, g, parentMode);
        paint(el, g);
        if (n.type === 'ellipse') el.style.borderRadius = '50%'; else radius(el, g);
        break;
      case 'vector': {
        el = document.createElementNS(SVG_NS, 'svg');
        mark(el, id, inst);
        el.style.overflow = 'visible';
        const hug = common(el, g, parentMode, { hugLater: true });
        let path = null;
        const d = g('path');
        if (pathOk(d)) {
          path = document.createElementNS(SVG_NS, 'path');
          path.setAttribute('d', d);
          path.style.fill = color(g('fill')) ?? 'none';
          path.style.stroke = color(g('stroke')) ?? 'none';
          path.style.strokeWidth = `${num(g('strokeWidth'), 0, 100000) ?? 0}px`;
          el.append(path);
        }
        if (hug.length && path) {
          const svg = el;
          drawing.after.push(() => {
            const b = path.getBBox();
            if (hug.includes('w')) svg.style.width = `${Math.max(0, b.x + b.width)}px`;
            if (hug.includes('h')) svg.style.height = `${Math.max(0, b.y + b.height)}px`;
          });
        }
        break;
      }
      case 'image': {
        const file = imageFile(g('src'));
        if (file === null) {
          // anything but an images/ file: an empty box of the node's size
          el = document.createElement('div');
          mark(el, id, inst);
          common(el, g, parentMode);
          break;
        }
        el = document.createElement('img');
        mark(el, id, inst);
        common(el, g, parentMode);
        const name = g('name');
        el.alt = typeof name === 'string' ? name : '';
        el.draggable = false;
        el.style.objectFit = pick(FIT, g('fit'), 'cover');
        radius(el, g);
        el.src = `/api/canvas/image/${encodeURIComponent(state.slug)}/${file}`;
        break;
      }
      case 'instance':
        return drawInstance(id, n, g, parentMode, inst);
      default:
        return placeholder(id, g, parentMode, inst);
    }
    hide(el, g);
    return el;
  }

  // An instance: its component's tree, resolved; its root the component root's properties with the
  // instance's own name, visible, opacity, x, y and size over them. Nested to a depth of 20; deeper, or
  // a component that doesn't resolve, is a placeholder.
  function drawInstance(id, n, g, parentMode, inst) {
    const depth = inst ? inst.depth + 1 : 1;
    const comp = nodeOf(g('component'));
    if (depth > MAX_DEPTH || !comp || comp.type !== 'component') return placeholder(id, g, parentMode, inst);
    const rootG = (p) => {
      if (INSTANCE_OWN.has(p)) {
        const v = g(p);
        if (v !== undefined) return v;
      }
      return getPath(comp, p);
    };
    const inner = { id, values: resolveInstance(n, comp), key: `${inst ? inst.key : ''}/${id}`, depth };
    const el = document.createElement('div');
    mark(el, id, inst);
    common(el, rootG, parentMode);
    const mode = layout(el, rootG);
    drawChildren(el, kidsOf(comp), mode, inner);
    hide(el, rootG);
    return el;
  }

  // The page's top-level nodes on #surface, each placed at its x, y.
  function drawPage(pageId) {
    const pg = pageById(pageId) || pages()[0];
    drawing = { seen: new Set(), after: [], labels: [], anchors: 0, byId: new Map() };
    const els = [];
    for (const id of kidsOf(pg)) {
      const el = drawNode(id, 'page', null);
      if (el) els.push(el);
    }
    $('surface').replaceChildren(...els, ...drawing.labels);
    for (const f of drawing.after) { try { f(); } catch { /* a size it can't measure stays 0 */ } }
    drawn = drawing.byId;
    drawing = null;
  }

  // ---- layers, selection and the properties panel ----

  // A row's type mark: the page's own table (a frame's by its layout mode).
  const MARK = { component: '◆', instance: '◇', text: 'T', rect: '▭', ellipse: '○', vector: '✎', image: '▣' };
  const FRAME_MARK = { row: '→', column: '↓', grid: '▦', none: '#' };
  const typeOf = (n) => (typeof n.type === 'string' ? n.type : '');
  function markOf(n) {
    if (n.type === 'frame') return FRAME_MARK[pick(MODE, getPath(n, 'layout.mode'), 'none')];
    return own(MARK, typeOf(n)) ? MARK[n.type] : '?';
  }
  // A node's name, or its type when the name is empty.
  const labelOf = (n) => (typeof n.name === 'string' && n.name ? n.name : typeOf(n) || 'node');

  // The Layers tree: the shown page's nodes nested by children order, each listed once; an instance's
  // inner nodes are the component's and aren't listed. Indent by depth, a number the page works out.
  function renderLayers(pageId) {
    const pg = pageById(pageId) || pages()[0];
    const seen = new Set();
    const out = [];
    layerRows = new Map();
    const stack = kidsOf(pg).reverse().map((id) => [id, 0]);
    while (stack.length) {
      const [id, depth] = stack.pop();
      const n = nodeOf(id);
      if (!n || seen.has(id)) continue;
      seen.add(id);
      const row = document.createElement('div');
      row.className = 'layer';
      row.dataset.node = id;
      row.setAttribute('role', 'treeitem');
      row.setAttribute('aria-level', String(depth + 1));
      row.setAttribute('aria-selected', 'false');
      row.tabIndex = -1;
      row.style.paddingLeft = `${12 + Math.min(depth, 40) * 14}px`;
      const ic = document.createElement('span');
      ic.className = 'ic';
      ic.textContent = markOf(n);
      ic.title = typeOf(n);
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = labelOf(n);
      row.append(ic, nm);
      out.push(row);
      layerRows.set(id, row);
      if (CONTAINERS.has(n.type)) stack.push(...kidsOf(n).reverse().map((c) => [c, depth + 1]));
    }
    $('layers').replaceChildren(...out);
  }

  // One label and value row of the Properties panel; the value is text.
  function propRow(label, field, value) {
    const row = document.createElement('div');
    row.className = 'row';
    const k = document.createElement('span');
    k.className = 'k';
    k.textContent = label;
    const v = document.createElement('span');
    v.className = 'v';
    v.dataset.field = field;
    v.textContent = value;
    row.append(k, v);
    return row;
  }

  // The Properties panel, read-only: the selected node's name and type, and for an instance its
  // component's name and variant; with nothing selected, a note.
  function renderProps() {
    const box = $('props');
    const n = state.sel === null ? null : nodeOf(state.sel);
    if (!n) {
      const p = document.createElement('p');
      p.className = 'note';
      p.textContent = TEXT.noSelection;
      box.replaceChildren(p);
      return;
    }
    const out = [propRow('Name', 'name', typeof n.name === 'string' ? n.name : ''), propRow('Type', 'type', typeOf(n))];
    if (n.type === 'instance') {
      const comp = nodeOf(n.component);
      const compName = comp && comp.type === 'component' ? (typeof comp.name === 'string' ? comp.name : '') : 'none';
      out.push(propRow('Component', 'component', compName));
      out.push(propRow('Variant', 'variant', typeof n.variant === 'string' && n.variant ? n.variant : 'none'));
    }
    box.replaceChildren(...out);
  }

  // Select a node of the shown page (its row and its drawn node marked), or nothing (null).
  function select(id) {
    const next = id !== null && layerRows.has(id) ? id : null;
    for (const [rid, row] of layerRows) row.setAttribute('aria-selected', rid === next ? 'true' : 'false');
    for (const el of $('surface').querySelectorAll('.sel')) el.classList.remove('sel');
    if (next !== null && drawn.has(next)) drawn.get(next).classList.add('sel');
    state.sel = next;
    renderProps();
  }

  $('layers').addEventListener('click', (e) => {
    const row = e.target instanceof Element ? e.target.closest('.layer[data-node]') : null;
    if (row) select(row.dataset.node);
  });
  // A click on the stage: the nearest drawn node with a data-id (inside an instance, the instance), or
  // on empty stage nothing. The stage's own controls are not the stage.
  $('stage').addEventListener('click', (e) => {
    if (!state.doc || e.button !== 0 || !(e.target instanceof Element)) return;
    if (e.target.closest('.zoom, .stage-top')) return;
    const hit = e.target.closest('#surface [data-id]');
    select(hit ? hit.dataset.id : null);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.sel !== null) select(null);
  });

  // ---- pages ----

  let shown = 0; // the count of showPage calls: a slower one finishing after a newer one doesn't mark it ready
  function showPage(id) {
    const pg = pageById(id) || pages()[0];
    if (pg.id !== state.pageId) state.sel = null;
    state.pageId = pg.id;
    const n = ++shown;
    for (const a of $('pages').querySelectorAll('a[data-page]')) {
      if (a.dataset.page === pg.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    }
    $('pageSel').value = typeof pg.id === 'string' ? pg.id : '';
    setState('loading');
    drawPage(pg.id);
    renderLayers(pg.id);
    select(state.sel);
    if (kidsOf(pg).length === 0) showMsg(TEXT.empty); else hideMsg();
    imagesSettled().then(() => { if (n === shown) setState('ready'); });
  }

  // The shown page from the address (#page=<id>), or null.
  function hashPage() {
    const m = /^#page=(.*)$/.exec(location.hash);
    if (!m) return null;
    try { return decodeURIComponent(m[1]); } catch { return null; }
  }
  // Show a page by putting it in the address (a reload stays on it); the hashchange shows it.
  function goPage(id) {
    const h = `#page=${encodeURIComponent(id)}`;
    if (location.hash === h) showPage(id); else location.hash = h;
  }
  window.addEventListener('hashchange', () => { if (state.doc) showPage(hashPage()); });
  $('pageSel').addEventListener('change', (e) => { if (state.doc) goPage(e.target.value); });

  async function start() {
    setState('loading');
    const m = /^\/view\/canvas\/([^/]*)$/.exec(location.pathname);
    const slug = m ? m[1] : '';
    if (!SLUG_RE.test(slug)) return fail(TEXT.notAddress);
    state.slug = slug;
    $('title').textContent = slug;
    document.title = `${slug} · canvas`;
    let res;
    try {
      res = await fetch(`/api/canvas/doc?slug=${encodeURIComponent(slug)}`, { credentials: 'same-origin', cache: 'no-store' });
    } catch {
      return fail(TEXT.notLoaded);
    }
    if (res.status === 404) return fail(TEXT.notOpen);
    const withStatus = `${TEXT.notLoaded} (${res.status})`;
    if (res.status !== 200) return fail(withStatus);
    let body;
    try { body = await res.json(); } catch { return fail(withStatus); }
    if (!frameOk(body)) return fail(withStatus);
    state.session = own(body, 'session') ? body.session : null;
    state.rev = own(body, 'rev') ? body.rev : null;
    state.doc = body.doc;
    state.repo = body.repo;
    showRepo(body.repo);
    renderPages();
    renderPageSel();
    showPage(hashPage());
  }

  start().catch(() => fail(TEXT.notLoaded));
})();
</script>
</body>
</html>
